<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="왼쪽은 높은 점선 위에서 출렁이는 강조색 물결, 오른쪽은 높이를 빼고 가운데 점선 둘레에서 출렁이는 같은 물결. 가운데 화살표 선이 둘을 잇는다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
