<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="CM 반회로. 입력원 v_CM이 베이스 B에 걸리고, 컬렉터 출력 v_o는 R_C를 통해 V_CC(AC 접지)에 연결돼요. v_o에서 이미터 노드 v_e로 제어 전류원 i_c = g_m v_π가 아래 방향으로 흐르고 v_π = v_CM − v_e(베이스 +, 이미터 −)예요. v_e에서 접지로 테일 Q₃의 출력저항을 반으로 나눈 2r_O3이 있어요. 추가 근사 β→∞(α≈1)로 r_π는 개방이에요."><style>
