<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Q3 소신호 등가회로: 시험 전압 V_X가 컬렉터 노드에 걸리고 전류 I_X가 컬렉터로 들어가요. 컬렉터와 이미터 노드 v_E 사이에 컬렉터에서 이미터 방향의 제어 전류원 g_m3 v_π와 r_O3가 병렬로 있고, v_E에서 접지로 R_1과 r_π3이 병렬로 연결돼요. r_π3의 아래 끝은 AC 접지된 베이스이고 v_π는 베이스가 +, 이미터가 −라서 v_π = −v_E예요."><style>
