<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="두 부분으로 된 그림이에요. 왼쪽은 1.5 V 건전지 두 개를 같은 방향으로 위아래 직렬 연결한 그림이고, 양 끝을 묶은 선 괄호 옆에 3 V라고 적혀 있어요. 오른쪽은 테두리 원 입력원 v in의 위쪽 선이 테두리 상자 피드포워드 시스템의 더하기 입력으로 가고, 상자의 빼기 입력은 아래 테두리 상자 귀환 회로망의 더하기 출력으로 이어지며, 귀환 회로망의 빼기 출력과 입력원의 아래쪽은 접지된 선으로 묶여 있어요. 위쪽 노드에는 파란 점과 v in = 1 V, 가운데 노드에는 빨간 점과 v F = 0.9 V, 상자 입력 사이에는 v e = 0.1 V가 적혀 있어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
