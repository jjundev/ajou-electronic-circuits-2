<svg xmlns="http://www.w3.org/2000/svg" width="560" height="335" viewBox="0 0 560 335" role="img" aria-label="왼쪽은 PMOS 캐스코드 전류원. 맨 위 V_DD에 M2의 소스가 붙고 게이트에 V_B2가 걸려요. M2 드레인은 색칠된 점인 노드 X에서 M1의 소스와 만나고, M1 게이트에는 V_B1이 걸려요. M1 드레인이 맨 아래 출력이고, 강조색 화살표가 아래에서 출력을 들여다보는 R_out이에요. 오른쪽은 소신호 등가회로. 맨 위 AC 접지와 노드 X 사이에 r_O2 하나만 남고, X와 출력 사이에는 r_O1과 위쪽 화살표가 든 마름모 전류원 g_m1 v_gs1이 나란히 있어요. v_gs1은 마이너스 v_X예요."><style>
