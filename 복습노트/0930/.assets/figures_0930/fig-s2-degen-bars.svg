<svg xmlns="http://www.w3.org/2000/svg" width="440" height="180" viewBox="0 0 440 180" role="img" aria-label="테두리만 있는 막대 그래프 두 묶음. 왼쪽 묶음의 막대 셋은 키가 크고 높이가 서로 많이 다르다. 오른쪽 묶음의 막대 셋은 키가 작고 높이가 거의 같다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
