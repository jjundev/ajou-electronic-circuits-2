<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="세로로 선 관에 테두리만 있는 상자 모양의 문이 위와 아래에 하나씩 달려 있어요. 위 문 위, 두 문 사이, 아래 문 아래에 색칠된 물방울이 세 개씩 같은 개수로 있고, 강조색 화살표가 아래로 흘러요. 위 문 옆에는 지나가게만 해요, 아래 문 옆에는 양을 정해요라고 적혀 있어요."><style>
