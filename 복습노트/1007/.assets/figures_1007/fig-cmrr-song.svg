<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="들어올 때는 색칠된 노래 막대와 경고색 테두리 소음 막대가 같은 높이이고, 나올 때는 색칠된 노래 막대가 아주 높고 소음 막대는 바닥에 붙을 만큼 낮은 그림"><style>
