<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="세로로 쌓인 상자 네 개. 맨 위와 맨 아래 상자는 강조색 테두리이고 흐르는 양을 정한다고 적혀 있어요. 가운데 두 상자는 검은 테두리이고 자리만 지킨다고 적혀 있어요. 왼쪽에 위에서 아래로 향하는 화살표가 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
