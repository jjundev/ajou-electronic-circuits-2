<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-label="왼쪽 상자 증폭기와 오른쪽 상자 다음 증폭기가 선으로 이어져 있다. 이음선의 갈림점에서 두 평행판을 지나 땅으로 내려가는 숨은 통이 강조색 선으로 그려져 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
