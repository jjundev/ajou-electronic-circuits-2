<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="테두리 막대 두 개를 비교해요. 왼쪽 막대는 구멍 없는 탑으로 높아요. 오른쪽 막대는 중간에 강조색 작은 원 구멍이 있고 왼쪽보다 꽤 낮아요."><style>
