<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-label="(a) 테일 저항 R SS를 2R SS 두 개로 나눠 M1과 M2의 소스 아래에 하나씩 둔 회로. 두 게이트에는 같은 ΔV in,CM이 들어가고, 드레인 위에는 R D가 있다. 두 소스를 잇는 선은 점선이고 전류 0이라고 적혀 있으며, 가운데 세로 강조 점선이 대칭선이다. (b) 자른 반쪽인 CM 절반 회로. 게이트에 ΔV in,CM, 드레인에 R D와 출력 ΔV out,CM, 소스와 접지 사이에 강조선으로 그린 2R SS가 있다."><style>
