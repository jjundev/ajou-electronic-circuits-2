<svg xmlns="http://www.w3.org/2000/svg" width="386" height="268" viewBox="0 0 386 268" role="img" aria-label="표 모양의 그림이에요. 위쪽 두 열은 출력 단의 선택으로, 왼쪽 열은 드레인으로 전류를 내보내는 출력(R out 큼), 오른쪽 열은 소스 팔로워로 전압을 내보내는 출력(R out 약 1/g m)이에요. 왼쪽 두 행은 입력 단의 선택으로, 위 행은 게이트로 전압을 받는 입력(R in 무한대), 아래 행은 공통 게이트의 소스로 전류를 받는 입력(R in 약 1/g m)이에요. 선으로 그린 네 칸에는 짝지은 결과를 적었어요. 게이트 입력과 드레인 출력은 트랜지스터 하나의 트랜스컨덕턴스 증폭기, 게이트 입력과 소스 팔로워 출력은 공통 소스에 소스 팔로워를 붙인 전압 증폭기, 공통 게이트 입력과 드레인 출력은 공통 게이트 하나의 전류 증폭기, 공통 게이트 입력과 소스 팔로워 출력은 공통 게이트에 소스 팔로워를 붙인 트랜스임피던스 증폭기예요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
