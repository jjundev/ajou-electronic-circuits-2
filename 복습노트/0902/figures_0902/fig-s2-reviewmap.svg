<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="네 칸이 선으로 차례로 이어진 그림이에요. 첫 칸 &#x27;전압과 전류 관계&#x27;는 강조색 테두리이고 위에 &#x27;오늘&#x27;이라고 적혀 있어요. 둘째 칸 &#x27;두 가지 모형&#x27;은 선 테두리이고 위에 &#x27;일부 오늘&#x27;이라고 적혀 있어요. &#x27;증폭기&#x27;, &#x27;또 다른 부품&#x27; 칸은 선 테두리이고 위에 &#x27;다음 시간&#x27;이라고 적혀 있어요."><style>
