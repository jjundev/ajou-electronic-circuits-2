<svg xmlns="http://www.w3.org/2000/svg" width="440" height="194" viewBox="0 0 440 194" role="img" aria-label="막대 두 쌍. 왼쪽 쌍은 원래 크기로, 강조색 테두리 막대가 그 옆 테두리 막대보다 두 배 높다. 오른쪽 쌍은 둘 다 조금 커졌을 때로, 점선이 원래 높이를 나타내고 두 막대가 모두 점선 위로 올라갔지만 강조색 테두리 막대는 여전히 옆 막대의 두 배 높이다."><style>
