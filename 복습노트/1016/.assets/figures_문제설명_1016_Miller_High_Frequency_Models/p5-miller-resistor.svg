@font-face { font-family: Pretendard; font-style: normal; font-weight: 600; src: url(data:font/woff;base64,) format('woff'); }

svg { color: #1b2130; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
svg text, svg text[class], svg text tspan, .fig-math, .fig-math tspan { font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal; }
svg tspan[baseline-shift="sub"], svg tspan[baseline-shift="super"] { font-size: 78%; }
svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2f6fdb; }
svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #d92d20; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style>

  <!-- 좌측: 변환 전 -->
  <text class="fig-muted" x="20" y="24" font-size="12">변환 전 (피드백 저항 R<tspan baseline-shift="sub">F</tspan>)</text>
  <path class="fig-ink" d="M20 70 H60"/>
  <circle class="fig-dot" data-node-color="blue" cx="60" cy="70" r="4"/>
  <text class="fig-text" x="52" y="60">X</text>
  <polygon class="fig-ink" points="75,45 145,70 75,95"/>
  <text class="fig-text" x="80" y="74" font-size="11">A ≈ -g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">C</tspan></text>
  <path class="fig-ink" d="M145 70 H185"/>
  <circle class="fig-dot" data-node-color="red" cx="185" cy="70" r="4"/>
  <text class="fig-text" x="180" y="60">v<tspan baseline-shift="sub">out</tspan></text>
  <!-- 피드백 저항 R_F -->
  <path class="fig-accent" d="M60 70 V36 H95 l4 -5 l6 10 l6 -10 l6 10 l6 -10 l6 10 l4 -5 H185 V70"/>
  <text class="fig-text" x="110" y="22" font-size="12">R<tspan baseline-shift="sub">F</tspan></text>

  <!-- 중앙 화살표 -->
  <path class="fig-ink" d="M220 70 H255 M247 64 L255 70 L247 76" stroke-width="2"/>
  <text class="fig-muted" x="216" y="92" font-size="11">밀러 정리</text>

  <!-- 우측: 변환 후 -->
  <text class="fig-muted" x="280" y="24" font-size="12">변환 후 (노드 X 등가 입력 부하)</text>
  <path class="fig-ink" d="M280 70 H330"/>
  <circle class="fig-dot" data-node-color="blue" cx="330" cy="70" r="4"/>
  <text class="fig-text" x="322" y="60">X</text>
  <!-- BJT 내부 저항 r_pi -->
  <path class="fig-ink" d="M330 70 H300 V85 l-5 3 l10 5 l-10 5 l10 5 l-10 5 l10 5 l-5 3 V130"/>
  <path class="fig-ink" d="M292 130 H308 M295 134 H305 M298 138 H302"/>
  <text class="fig-text" x="278" y="105" font-size="12">r<tspan baseline-shift="sub">π</tspan></text>
  <!-- 밀러 분할 저항 R_F,in -->
  <path class="fig-ink" d="M330 70 H360 V85 l-5 3 l10 5 l-10 5 l10 5 l-10 5 l10 5 l-5 3 V130"/>
  <path class="fig-ink" d="M352 130 H368 M355 134 H365 M358 138 H362"/>
  <text class="fig-text" x="368" y="105" font-size="11">R<tspan baseline-shift="sub">F</tspan>/(1+g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">C</tspan>)</text>
  <!-- 출력단 -->
  <polygon class="fig-ink" points="390,45 460,70 390,95"/>
  <text class="fig-text" x="398" y="74" font-size="11">-g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">C</tspan></text>
  <path class="fig-ink" d="M460 70 H495"/>
  <circle class="fig-dot" data-node-color="red" cx="495" cy="70" r="4"/>
  <text class="fig-text" x="490" y="60">v<tspan baseline-shift="sub">out</tspan></text>
  <!-- 설명 캡션 텍스트 -->
  <text class="fig-muted" x="310" y="152" font-size="11">R<tspan baseline-shift="sub">X</tspan> = r<tspan baseline-shift="sub">π</tspan> ‖ [R<tspan baseline-shift="sub">F</tspan>/(1+g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">C</tspan>)]</text>

</svg>