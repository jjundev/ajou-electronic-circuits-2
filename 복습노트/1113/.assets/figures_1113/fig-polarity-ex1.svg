<svg xmlns="http://www.w3.org/2000/svg" width="420" height="284" viewBox="0 0 420 284" role="img" aria-label="예제 I 회로예요. 위쪽 V DD에 PMOS M3, M4 전류 거울이 붙어 있고 M3은 게이트와 드레인이 이어져 있어요. 아래 NMOS 차동쌍 M1, M2의 소스는 함께 꼬리 전류원 I SS를 거쳐 접지로 가요. 왼쪽 입력 v in이 M1 게이트로 들어가요. M2 드레인이 오른쪽 출력 v out이고, 출력에서 R1과 R2로 나눈 노드 X가 M2 게이트로 돌아가요. 입력, 출력, X 노드에는 색칠된 점을 찍었어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
