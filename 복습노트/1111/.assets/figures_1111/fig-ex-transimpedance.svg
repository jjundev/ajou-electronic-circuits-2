<svg xmlns="http://www.w3.org/2000/svg" width="400" height="274" viewBox="0 0 400 274" role="img" aria-label="트랜스임피던스 증폭기 회로예요. 왼쪽 아래 위쪽을 향한 전류원 i in이 공통 게이트 M1의 소스로 전류를 넣고, M1 게이트는 바이어스 V b, 드레인은 R D를 거쳐 위쪽 V DD에 이어져요. M1 드레인 노드는 소스 팔로워 M2의 게이트로 이어지고, M2 드레인은 V DD, 소스는 아래 전류원을 거쳐 접지로 가요. M2 소스가 오른쪽 출력 v out이에요. 입력 노드 아래에는 오른쪽을 향한 화살표와 R in 약 1/g m1, 출력 아래에는 왼쪽을 향한 화살표와 R out 약 1/g m2를 적었어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
