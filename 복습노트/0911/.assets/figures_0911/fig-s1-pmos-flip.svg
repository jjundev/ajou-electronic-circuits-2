<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="왼쪽은 바닥 위에 테두리 상자 두 개를 쌓은 탑이고, 위에서 들어온 흐름이 강조색 화살표로 바닥 쪽으로 내려가요. 가운데 강조색 곡선 화살표 두 개가 위아래 뒤집기를 나타내요. 오른쪽은 천장에 테두리 상자 두 개가 매달린 탑이고, 강조색 화살표가 위에서 아래로 흘러 나와요."><style>
