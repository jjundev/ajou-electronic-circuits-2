<svg xmlns="http://www.w3.org/2000/svg" width="650" height="135" viewBox="0 0 650 135" role="img" aria-label="빠른 신호의 증폭 문제에서 커패시턴스 확인과 밀러 변환을 거쳐 통과 대역을 구하는 흐름"><style>
