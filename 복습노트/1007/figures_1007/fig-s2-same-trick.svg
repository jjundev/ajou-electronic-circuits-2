<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="테두리 상자 두 개가 위아래에 있다. 위 상자는 앞의 거울 회로, 부품 가, 아래 상자는 같은 모양 회로, 부품 나라고 적혀 있다. 두 상자에서 나온 강조색 선이 한 점에서 만나 화살표로 색칠된 동그라미에 닿고, 똑같이 두 배라고 적혀 있다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
