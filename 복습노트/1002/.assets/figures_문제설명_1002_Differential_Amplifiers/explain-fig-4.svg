<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290" role="img" aria-label="MOS 캐스코드 반회로. 출력 v_o와 중간 노드 v_x 사이에 M₃의 제어 전류원 g_m v_gs3(v_o에서 v_x로, v_gs3 = −v_x)과 r_O, v_x와 접지 사이에 M₁의 제어 전류원 g_m v_i(아래 방향)와 r_O가 있어요. 위 이상 전류원은 개방, 테일 노드는 가상 접지예요."><style>
