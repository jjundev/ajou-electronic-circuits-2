<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170" role="img" aria-label="두 점을 지그재그 선 두 개로 이은 그림 두 개. 왼쪽 그림은 왼쪽 점이 올라가고 오른쪽 점이 같은 만큼 내려가 선이 기울었고, 가운데 색칠된 점은 원래 높이를 나타내는 점선 위에 그대로 있다. 오른쪽 그림은 두 점이 같이 올라가서 가운데 색칠된 점도 점선보다 위에 있다."><style>
