notes:
  - "원본 파일의 원래 이름은 2018F중간(모범답안).pdf (4쪽, 한 쪽에 한 문항). 시험지 제목은 \"전자회로2 중간시험 (2018년 2학기)\"."
  - "원본은 모범답안이다. 인쇄된 문제 위아래에 손글씨 풀이가 겹친다 (1쪽 맨 위 \"Solution\" 포함). 인쇄된 글자만 옮긴다 (FORMAT-EXAM.md의 스캔 답안지 규칙)."
  - "배점은 각 문항 머리에 인쇄된 값이다 (1번 30점, 2번 30점, 3번 20점, 4번 20점)."
  - "학생 답안지는 보관하지 않음."
