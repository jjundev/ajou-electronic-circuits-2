name: Tests
on:
  pull_request: {}
  push:
    branches: [main]
    paths: ['**.py', '**.mjs', '**.cjs', '.agents/**', '.claude/**', 'workbook/**', '.gitattributes', '.github/workflows/tests.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # 러너의 기본 인코딩(cp1252)으로는 한국어를 읽고 쓸 수 없다.
      PYTHONUTF8: '1'
      # 도구가 없으면 건너뛰지 않고 실패한다.
      EC2_REQUIRE_TOOLS: '1'
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install packages
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install chromium
          node_dir="$RUNNER_TEMP/node-tools"
          if [ "$RUNNER_OS" = Windows ]; then node_dir="$(cygpath -m "$node_dir")"; fi
          npm install --prefix "$node_dir" --no-audit --no-fund puppeteer-core@25.18.1
          echo "EC2_PUPPETEER_CORE_PACKAGE=$node_dir/node_modules/puppeteer-core/package.json" >> "$GITHUB_ENV"
      - name: Run tests
        run: |
          # 같은 이름의 테스트 도우미가 있어 묶음마다 따로 실행한다.
          failed=()
          for suite in tests workbook/tests from_the_past/md/_tools/tests '교과서/마이크로전자회로/_tools/tests' \
              .agents/skills/ec2-concept-check/tests .agents/skills/ec2-interactive/tests \
              .agents/skills/ec2-review-video/tests .agents/skills/ec2-solution-video/tests \
              .claude/skills/ec2-problem-explain/tests .claude/skills/ec2-review-pack/tests; do
            echo "::group::$suite"
            python -m pytest -q -rs --tb=short "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}"
            exit 1
          fi
