<svg xmlns="http://www.w3.org/2000/svg" width="470" height="210" viewBox="0 0 470 210" role="img" aria-label="두 줄로 된 흐름도. 윗줄은 테두리 상자 세 개가 화살표로 이어진다. 빠른 흔들림을 크게 하고 싶어요, 위험색 테두리의 숨은 물통이 흔들림을 삼켜요, 강조색 테두리의 물통마다 느린 정도를 재요 순서다. 아랫줄에는 테두리 상자 두 개가 화살표로 이어진다. 크게 키울수록, 위험색 테두리의 더 느려져요 순서이고, 오른쪽에 색칠된 점과 알맞게 골라요라는 글이 있다."><style>
