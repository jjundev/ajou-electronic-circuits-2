<svg xmlns="http://www.w3.org/2000/svg" width="420" height="264" viewBox="0 0 420 264" role="img" aria-label="왼쪽 입력 V in이 테두리 삼각형 증폭기를 지나 NMOS M1의 게이트로 들어가요. 증폭기와 M1은 A1이라 적힌 점선 테두리 상자 안에 있어요. M1 드레인은 위쪽 열린 단자로 이어지고, 소스에서 아래로 흐르는 I out 화살표 뒤 노드 V F를 지나 강조선의 저항 R S를 거쳐 접지돼요. R S 옆에 귀환 회로망이라고 적혀 있고, V F 노드는 오른쪽 단자까지 이어져요. V in과 V F에는 색칠된 점이 있어요"><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
