<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="테두리 네모 칸을 세 묶음으로 그린 그림. 왼쪽은 한 칸(힘 1배), 가운데는 가로 두 칸 세로 두 칸인 네 칸(힘 2배), 오른쪽은 강조색 테두리로 그린 가로 네 칸 세로 네 칸인 열여섯 칸(힘 4배)"><style>
