<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280" role="img" aria-label="원 회로의 귀환망. 입력 노드 N은 위로 M1 소스에 연결되고 왼쪽 I_in이 접지에서 N으로 흐른다. N에서 R_F가 오른쪽 노드 P로 가고, P 위에는 레이저 R_L을 거쳐 M2 드레인에서 I_out이 내려온다. P에서 R_M이 접지로 간다. R_F와 R_M을 점선 상자로 묶었고, N 쪽 왼쪽 경계가 반송 포트, 레이저 쪽 위 경계가 감지 포트다."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
