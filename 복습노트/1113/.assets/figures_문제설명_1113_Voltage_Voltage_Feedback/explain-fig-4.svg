<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" role="img" aria-label="V_DD 레일에 R_D1과 R_D2가 매달려 있어요. R_D1 아래 노드 A는 M1 드레인에 붙고, 오른쪽으로 나간 도선이 아래로 돌아 M2 소스에 붙어요. M1 게이트는 왼쪽 입력 v_in에, M1 소스는 아래 도선을 따라 오른쪽 노드 X에 붙어요. M2 게이트는 고정 바이어스 V_b 단자에, M2 드레인은 R_D2 아래 노드에 붙고 그 노드는 오른쪽으로 분배기 위쪽 접속점을 지나 맨 오른쪽 출력 v_out 단자로 이어져요. 분배기는 v_out 접속점에서 R_F1, 노드 X, R_F2를 거쳐 접지로 내려가요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
