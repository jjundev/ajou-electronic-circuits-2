<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="두 줄의 흐름도예요. 위 줄은 늘 같은 양이 필요하다는 선 테두리 상자에서, 눈대중은 날마다 어긋난다는 경고색 테두리 상자를 지나, 계량컵 하나를 베껴 쓴다는 강조색 테두리 상자로 이어져요. 아래 줄은 작은 소식을 또렷이 보내고 싶다는 선 테두리 상자에서, 줄 하나는 주변 소란을 같이 싣는다는 경고색 테두리 상자를 지나, 두 줄로 거꾸로 보낸다는 강조색 테두리 상자로 이어져요."><style>
