<svg xmlns="http://www.w3.org/2000/svg" width="520" height="285" viewBox="0 0 520 285" role="img" aria-label="출력 임피던스를 구하는 블록도예요. 왼쪽 접지가 테두리 원 합산기의 플러스 입력에 이어져 입력이 0이에요. 합산기 출력은 점선 상자 피드포워드 시스템 안의 빨간 점 노드 마이너스 K V X를 지나 테두리 삼각형 A 0로 들어가고, A 0 출력의 파란 점 노드 마이너스 K A 0 V X에서 지그재그 저항 R out을 지나 상자 밖 빨간 점 분기점에 닿아요. 그 오른쪽 도선에는 왼쪽을 향한 화살표 I X가 있고, 맨 오른쪽 끝 빨간 점 위에 V X 플러스가 적혀 있어요. 그 점에서 아래로 테두리 원 시험 전압원과 접지가 이어져요. 분기점에서 아래로 내려간 선은 테두리 사각형 K를 지나 왼쪽 파란 점 노드 V F는 K V X를 거쳐 합산기의 마이너스 입력으로 올라가요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
