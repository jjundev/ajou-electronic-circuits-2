<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="막대 두 개. 왼쪽 선 테두리 막대는 기준이고, 오른쪽 강조색 테두리 막대는 따라 한 쪽인데 가로 점선보다 조금 더 높아요. 막대 아래에 뒤에서 미는 힘이 약함, 셈이라고 적혀 있어요."><style>
