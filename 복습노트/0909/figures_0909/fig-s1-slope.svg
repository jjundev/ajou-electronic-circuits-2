<svg xmlns="http://www.w3.org/2000/svg" width="520" height="255" viewBox="0 0 520 255" role="img" aria-label="선으로 그린 가로축과 세로축 위에 오른쪽으로 갈수록 가파르게 휘어 올라가는 곡선이 있어요. 곡선 위 낮은 곳과 높은 곳에 색칠된 점이 하나씩 있고, 각 점에 곡선과 살짝 닿는 강조색 곧은 선이 있어요. 높은 곳의 곧은 선이 더 가팔라요."><style>
