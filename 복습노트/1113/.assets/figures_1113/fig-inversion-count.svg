<svg xmlns="http://www.w3.org/2000/svg" width="400" height="286" viewBox="0 0 400 286" role="img" aria-label="두 줄 그림이에요. 위 줄 M2 있음(CS 두 단)은 테두리 상자 V in 위 화살표, V A 아래 화살표, V out 위 화살표, V X 위 화살표가 차례로 이어지고 앞의 두 화살표 위에 반전, 마지막 화살표 위에 분배라고 적었어요. 그 아래 강조색 테두리 상자에 M1 소스로 돌아와 V GS1이 줄어요, 음귀환이라고 적었어요. 아래 줄 M2 없음(CS 한 단)은 V in 위, V A 아래, V X 아래로 이어지고, 빨간 테두리 상자에 M1 소스로 돌아와 V GS1이 커져요, 양귀환이라고 적었어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
