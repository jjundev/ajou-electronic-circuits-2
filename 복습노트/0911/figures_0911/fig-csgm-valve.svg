<svg xmlns="http://www.w3.org/2000/svg" width="420" height="215" viewBox="0 0 420 215" role="img" aria-label="세로 관 가운데에 테두리로 그린 모래시계 모양 밸브 하나가 있고, 왼쪽에 테두리 원 손잡이가 달려 있어요. 오른쪽 강조색 화살표가 위에서 바닥으로 가는 흐름이에요."><style>
