<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="두 부분으로 된 그림이에요. 왼쪽 (a)는 아래로 향하는 화살표가 든 테두리 원 전류원 i 1과 i 2가 위의 파란 점 노드와 아래의 빨간 점 노드 사이에 나란히 병렬로 연결되고, 위아래 끝에 테두리 원 단자가 있어요. 위쪽 단자와 파란 점 사이 선에 아래로 향하는 화살표와 i 1 + i 2가 적혀 있어요. 오른쪽 (b)는 위로 향하는 화살표가 든 테두리 원 입력 전류원 i in 10 마이크로암페어의 아래쪽이 접지되고 위쪽 선이 파란 점 노드로 가요. 그 노드에서 오른쪽 선은 i e 1 마이크로암페어 화살표를 지나 테두리 상자 피드포워드 시스템으로, 아래로 내려간 선은 i F 9 마이크로암페어 화살표를 지나 테두리 상자 귀환 회로망으로 가요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
