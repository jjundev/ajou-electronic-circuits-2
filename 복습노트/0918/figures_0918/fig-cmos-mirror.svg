<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290" role="img" aria-label="CMOS 전류 미러 회로예요. 왼쪽에서 I_REF가 다이오드 연결된 NMOS M_REF로 흐르고, 그 게이트가 1:1 복사본 M_N1과 오른쪽 아래 M_N2의 게이트에 이어져요. M_N1은 위쪽의 다이오드 연결된 PMOS M_P,REF에서 강조색 화살표로 표시한 I_REF를 끌어내려요. M_P,REF의 게이트에서 나온 강조색 선이 M_P1의 게이트로 가고, M_P1은 V_DD에서 테두리만 있는 원인 노드 A로 전류를 흘려 넣어요(source). M_N2는 노드 B에서 접지로 전류를 빼내요(sink). 접속점은 색칠된 점이에요."><style>
