<svg xmlns="http://www.w3.org/2000/svg" width="630" height="250" viewBox="0 0 630 250" role="img" aria-label="세 열 비교 그림. 첫 열은 입력 A와 B로, 서로 반대로 움직이는 빠른 물결이 같은 느린 출렁임을 함께 타고 있다. 둘째 열(이상적 테일, R EE 무한대)에서는 노드 1, 노드 2, 그 차이가 모두 출렁임 없는 강조선 파형이다. 셋째 열(실제 테일, R EE 유한)에서는 노드 1과 노드 2가 같은 출렁임을 탄 위험색 선이지만, 둘의 차이는 출렁임 없는 강조선 파형이다."><style>
