<svg xmlns="http://www.w3.org/2000/svg" width="320" height="242" viewBox="0 0 320 242" role="img" aria-label="예제 IV 전류-전류 귀환 회로. 전류원 I_in이 M1 소스 노드로 들어가고, 같은 노드에서 I_F가 R_F를 지나 노드 P로 가요. M1은 게이트가 V_b인 공통 게이트이고 드레인 X에 R_D가 있어요. PMOS M2는 게이트가 X인 공통 소스로, 출력 전류 I_out이 부하 R_L을 지나 P에 닿고 P에서 R_M으로 접지돼요. R_F와 R_M은 강조색 선으로 그렸어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
