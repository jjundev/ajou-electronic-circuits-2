<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320" role="img" aria-label="슬라이드 27의 회로예요. 왼쪽은 0.3 mA 기준 전류원 아래 다이오드 연결된 M_REF(3(W/L))이고, 그 게이트에서 나온 강조색 게이트 공통선이 가운데 M_I1(2(W/L))과 오른쪽 M_I2(5(W/L))의 게이트에 이어져요. 가운데 기둥은 V_DD에 드레인을 둔 NMOS M1 소스 팔로워이고, 소스 쪽 출력 V_out1 아래로 강조색 화살표 I1 = 0.2 mA가 M_I1로 흘러요. 오른쪽 기둥은 소스를 V_DD에 둔 PMOS M2 공통 소스 단이고, 드레인 쪽 출력 V_out2 아래로 강조색 화살표 I2 = 0.5 mA가 M_I2로 흘러요. 접속점은 색칠된 점, 입출력 단자는 테두리만 있는 작은 원이에요."><style>
