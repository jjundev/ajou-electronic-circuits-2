<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="출력 상자 두 개. 왼쪽 상자는 아래 벽만 강조색 굵은 선이고 위 벽은 얇은 점선이에요. 오른쪽 상자는 위아래 벽이 모두 강조색 굵은 선이에요."><style>
