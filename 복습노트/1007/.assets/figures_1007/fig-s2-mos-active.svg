<svg xmlns="http://www.w3.org/2000/svg" width="510" height="315" viewBox="0 0 510 315" role="img" aria-label="능동 부하 MOS 차동쌍 회로. 위쪽에 PMOS M3, M4가 전원 V DD에 소스를 대고 게이트끼리 이어져 있다. M3는 게이트가 자기 드레인 노드 A에 이어진 다이오드 연결이다. 아래쪽 NMOS M1, M2의 게이트에는 더하기 델타 V와 빼기 델타 V가 들어가고, 소스는 노드 P에서 만나 테일 전류원 I SS로 내려간다. 강조색 선 화살표가 M1 쪽 가지의 더하기 델타 I, M2 쪽 가지의 빼기 델타 I, M4로 복사된 더하기 델타 I를 가리킨다. M2와 M4가 만나는 출력 노드에서 강조색 선이 출력 단자 V out으로 이어지고, 그 위 화살표에 2 델타 I라고 적혀 있다."><style>
