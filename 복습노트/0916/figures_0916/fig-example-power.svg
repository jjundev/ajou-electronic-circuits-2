<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="장치 두 개의 막대 그림. 키우는 크기 막대는 둘 다 같은 높이이고, 강조색 테두리의 쓰는 전기 막대는 오른쪽이 왼쪽의 두 배 높이예요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
