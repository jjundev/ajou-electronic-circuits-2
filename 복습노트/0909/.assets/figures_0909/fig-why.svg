<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" role="img" aria-label="테두리 상자 네 개가 왼쪽에서 오른쪽으로 강조색 화살표 선으로 이어져요. 첫 상자는 늘 같은 양을 흘리고 싶다는 바람, 빨간 테두리의 둘째 상자는 꼭지 하나는 세게 밀면 더 샌다는 한계, 강조색 테두리의 셋째 상자는 꼭지 위에 꼭지를 달아 훨씬 고르게 나온다는 해법, 점선 테두리의 넷째 상자는 위에 남는 높이 여유가 줄어든다는 대가예요."><style>
