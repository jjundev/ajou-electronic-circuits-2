<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="70 0 360 300" role="img" aria-label="왼쪽 반회로. 위쪽 AC 접지(R_DD 중점)에서 R_DD/2를 지나 출력 노드 v_o로 i_d가 내려와요. v_o에서 소스 노드 v_s로 M1의 제어 전류원 i_d = g_m·v_gs(아래로 흐름, v_gs = v_i − v_s)가 있고, v_s에서 R_SS/2를 지나 AC 접지(R_SS 중점)로 i_d가 내려가요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="70" y="0" width="360" height="300" rx="10" fill="#ffffff"/><path class="fig-ink" d="M160 30 H260"/><text class="fig-muted" x="165" y="20">R<tspan baseline-shift="sub">DD</tspan> 중점 → AC 접지</text><path class="fig-ink" d="M210 30 V51 l8 4 l-16 8 l16 8 l-16 8 l16 8 l-16 8 l8 4 V120"/><text class="fig-text" x="224" y="80">R<tspan baseline-shift="sub">DD</tspan>/2</text><path class="fig-ink" d="M188 64 V84 M183 79 L188 84 L193 79"/><circle class="fig-dot" cx="210" cy="120" r="3.5"/><text class="fig-text" x="196" y="124" text-anchor="end">v<tspan baseline-shift="sub">o</tspan></text><path class="fig-ink" d="M210 120 V146 M210 178 V205"/><polygon class="fig-ink" points="210,146 224,162 210,178 196,162"/><path class="fig-ink" d="M210 152 V171 M205 166 L210 171 L215 166"/><text class="fig-text" x="230" y="155">i<tspan baseline-shift="sub">d</tspan> = g<tspan baseline-shift="sub">m</tspan>v<tspan baseline-shift="sub">gs</tspan></text><text class="fig-muted" x="230" y="179">v<tspan baseline-shift="sub">gs</tspan> = v<tspan baseline-shift="sub">i</tspan> − v<tspan baseline-shift="sub">s</tspan></text><path class="fig-ink" d="M210 205 V213.5 l8 4 l-16 8 l16 8 l-16 8 l16 8 l-16 8 l8 4 V270"/><path class="fig-ink" d="M210 270 v8 M200 278 H220 M204 283 H216 M208 288 H212"/><text class="fig-text" x="224" y="232">R<tspan baseline-shift="sub">SS</tspan>/2</text><text class="fig-muted" x="224" y="256">중점(AC 접지)까지</text><path class="fig-ink" d="M188 225 V245 M183 240 L188 245 L193 240"/><text class="fig-text" x="180" y="240" text-anchor="end">i<tspan baseline-shift="sub">d</tspan></text><circle class="fig-dot" cx="210" cy="205" r="3.5"/><text class="fig-text" x="196" y="209" text-anchor="end">v<tspan baseline-shift="sub">s</tspan></text><text class="fig-text" x="180" y="79" text-anchor="end">i<tspan baseline-shift="sub">d</tspan></text></svg>
