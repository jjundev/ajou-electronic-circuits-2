<svg xmlns="http://www.w3.org/2000/svg" width="660" height="130" viewBox="0 0 660 130" role="img" aria-label="테두리 상자 네 개가 왼쪽에서 오른쪽으로 강조색 화살표로 이어져요. 첫 상자는 크게 키우고 싶어요, 경고색 테두리인 둘째 상자는 하나로는 금방 밀려요, 강조색 테두리인 셋째 상자는 하나 더 받쳐 세워요, 넷째 상자는 대신 높이를 더 써요라고 적혀 있어요."><style>
