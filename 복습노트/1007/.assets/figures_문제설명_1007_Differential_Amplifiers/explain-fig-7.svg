<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-label="능동 부하 차동쌍의 소신호 등가회로: AC 접지된 V_CC와 노드 v_x 사이에 다이오드 연결 Q3의 1/g_m과 r_OP가 병렬로, V_CC와 출력 노드 v_o 사이에 Q4의 r_OP와 v_o에서 위로 흐르는 제어 전류원 g_m v_x가 병렬로 있어요. v_x와 공통 이미터 노드 v_e 사이에 Q1의 아래 방향 제어 전류원 g_m(v_d/2 − v_e)와 r_ON이, v_o와 v_e 사이에 Q2의 g_m(−v_d/2 − v_e)와 r_ON이 병렬로 있고, 이상 테일은 개방이에요."><style>
