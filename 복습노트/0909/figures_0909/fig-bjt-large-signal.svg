<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="BJT 대신호 모델 회로예요. 왼쪽 베이스 B에서 선으로 그린 삼각형 다이오드가 아래 에미터 E로 이어져요. 가운데 위 컬렉터 C와 아래 에미터 E 사이에는 강조색 테두리 원으로 그린 전류원이 있고, 아래 방향 화살표가 들어 있어요. 오른쪽에 전류원 양단 전압이 V CE라고 표시돼 있어요."><style>
