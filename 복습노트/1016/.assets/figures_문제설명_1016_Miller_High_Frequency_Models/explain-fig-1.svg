@font-face { font-family: Pretendard; font-style: normal; font-weight: 600; src: url(data:font/woff;base64,) format('woff'); }

svg { color: #1b2130; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
svg text, svg text[class], svg text tspan, .fig-math, .fig-math tspan { font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal; }
svg tspan[baseline-shift="sub"], svg tspan[baseline-shift="super"] { font-size: 78%; }
svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2f6fdb; }
svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #d92d20; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style>

  <!-- 입력 노드 Vin -->
  <text class="fig-muted" x="20" y="25" font-size="12">입력단 (NMOS M₁ 게이트)</text>
  <path class="fig-ink" d="M20 70 H70"/>
  <circle class="fig-dot" data-node-color="blue" cx="70" cy="70" r="4"/>
  <text class="fig-text" x="60" y="60">V<tspan baseline-shift="sub">in</tspan></text>

  <!-- C_GS1 (Vin - 접지) -->
  <path class="fig-ink" d="M70 70 H100 V95 M100 105 V135"/>
  <path class="fig-accent" d="M90 95 H110 M90 105 H110" stroke-width="2.5"/>
  <path class="fig-ink" d="M92 135 H108 M95 139 H105 M98 143 H102"/>
  <text class="fig-text" x="114" y="105" font-size="11">C<tspan baseline-shift="sub">GS1</tspan></text>

  <!-- C_GD1 (Vin - Vout 피드백) -->
  <path class="fig-accent" d="M70 70 V35 H250 M270 35 H450 V70"/>
  <path class="fig-accent" d="M250 25 V45 M260 25 V45" stroke-width="2.5"/>
  <text class="fig-text" x="245" y="20" font-size="12">C<tspan baseline-shift="sub">GD1</tspan></text>

  <!-- 출력 노드 Vout -->
  <circle class="fig-dot" data-node-color="red" cx="450" cy="70" r="4"/>
  <text class="fig-text" x="445" y="60">V<tspan baseline-shift="sub">out</tspan></text>
  <path class="fig-ink" d="M450 70 H520"/>
  <text class="fig-muted" x="430" y="25" font-size="12">출력단 부하 (M₂ 다이오드 연결)</text>

  <!-- 출력-접지 병렬 소자들 -->
  <!-- 1. M1 제어 전류원 gm1*Vin (하향) -->
  <path class="fig-ink" d="M450 70 H180 V95"/>
  <polygon class="fig-ink" points="180,95 192,110 180,125 168,110"/>
  <path class="fig-ink" d="M180 102 V118 M176 113 L180 118 L184 113"/>
  <path class="fig-ink" d="M180 125 V145"/>
  <path class="fig-ink" d="M172 145 H188 M175 149 H185 M178 153 H182"/>
  <text class="fig-text" x="135" y="115" font-size="11">g<tspan baseline-shift="sub">m1</tspan>V<tspan baseline-shift="sub">in</tspan></text>

  <!-- 2. M1 출력저항 r_O1 -->
  <path class="fig-ink" d="M450 70 H250 V85 l-4 3 l8 4 l-8 4 l8 4 l-8 4 l8 4 l-4 3 V145"/>
  <path class="fig-ink" d="M242 145 H258 M245 149 H255 M248 153 H252"/>
  <text class="fig-text" x="256" y="115" font-size="11">r<tspan baseline-shift="sub">O1</tspan></text>

  <!-- 3. M2 다이오드 연결 저항 1/gm2 -->
  <path class="fig-ink" d="M450 70 H320 V85 l-4 3 l8 4 l-8 4 l8 4 l-8 4 l8 4 l-4 3 V145"/>
  <path class="fig-ink" d="M312 145 H328 M315 149 H325 M318 153 H322"/>
  <text class="fig-text" x="326" y="115" font-size="11">1/g<tspan baseline-shift="sub">m2</tspan></text>

  <!-- 4. M2 출력저항 r_O2 -->
  <path class="fig-ink" d="M450 70 H390 V85 l-4 3 l8 4 l-8 4 l8 4 l-8 4 l8 4 l-4 3 V145"/>
  <path class="fig-ink" d="M382 145 H398 M385 149 H395 M388 153 H392"/>
  <text class="fig-text" x="396" y="115" font-size="11">r<tspan baseline-shift="sub">O2</tspan></text>

  <!-- 5. 합산 출력 커패시터 C_T = C_DB1 + C_GS2 + C_DB2 -->
  <path class="fig-ink" d="M450 70 H470 V95 M470 105 V145"/>
  <path class="fig-accent" d="M460 95 H480 M460 105 H480" stroke-width="2.5"/>
  <path class="fig-ink" d="M462 145 H478 M465 149 H475 M468 153 H472"/>
  <text class="fig-text" x="484" y="105" font-size="11">C<tspan baseline-shift="sub">T</tspan></text>

  <!-- 하단 요약 문구 -->
  <text class="fig-muted" x="140" y="185" font-size="11">C<tspan baseline-shift="sub">T</tspan> = C<tspan baseline-shift="sub">DB1</tspan> + C<tspan baseline-shift="sub">GS2</tspan> + C<tspan baseline-shift="sub">DB2</tspan> (C<tspan baseline-shift="sub">GD2</tspan>는 단락 소거)</text>
  <text class="fig-muted" x="140" y="205" font-size="11">출력 저항 R<tspan baseline-shift="sub">out</tspan> = r<tspan baseline-shift="sub">O1</tspan> ‖ r<tspan baseline-shift="sub">O2</tspan> ‖ (1/g<tspan baseline-shift="sub">m2</tspan>) ≈ 1/g<tspan baseline-shift="sub">m2</tspan></text>

</svg>