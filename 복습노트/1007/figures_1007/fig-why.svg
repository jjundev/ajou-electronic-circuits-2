<svg xmlns="http://www.w3.org/2000/svg" width="470" height="210" viewBox="0 0 470 210" role="img" aria-label="두 줄로 된 흐름도. 윗줄은 테두리 상자 세 개가 화살표로 이어진다. 빼면 흔들림이 지워져요, 위험색 테두리의 컵이 조금 달라 조금 새요, 강조색 테두리의 새는 양을 몇 배로 재요 순서다. 아랫줄도 테두리 상자 세 개가 화살표로 이어진다. 한 컵으로만 내보내야 해요, 위험색 테두리의 한 컵만 쓰면 반만 남아요, 강조색 테두리의 옆 컵 몫을 옮겨 부어요 순서이고, 마지막 상자 오른쪽 아래에 색칠된 점과 다 모여요라는 글이 있다."><style>
