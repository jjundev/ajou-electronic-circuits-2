<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="커먼 모드 하프 서킷. 게이트에 ΔV in,CM이 들어가는 NMOS M1의 드레인 위에 R D가 V DD까지 있고, 드레인이 출력 ΔV out,CM이다. M1 소스 노드 P는 색칠된 점으로 표시했고 접지가 아니라고 적혀 있다. P와 접지 사이에는 강조선으로 그린 저항 2R SS가 있다."><style>
