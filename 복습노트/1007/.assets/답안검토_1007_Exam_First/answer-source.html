<style>
/* ==========================================================================
   답안지 템플릿 (문제 + 풀이 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 문제 데이터는 문제집과 같고, 문제마다
   solution {steps: [{label, html}], answer} 를 더한다. 1–3절은 문제집 템플릿과 같다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 11.339286pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 7.370536pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7.937500pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7.937500pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 17.008929pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 10.205357pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 7.370536pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.ans-tag {
  font-size: 7.370536pt; font-weight: 700; line-height: 1.4; color: var(--kind);
  border: .25mm solid var(--kind); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 11.339286pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 8.504464pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 40mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7.937500pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문: 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 (문제지와 같음) */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* 풀이 칸 (답안지): 점 격자 위에 번호 단계, 맨 아래 답. 맞춤: 글자 0.9 → 0.8 → 2단 */
.work {
  --sfs: 1;
  --sol-step-gap: 10mm;          /* 풀이 단계 사이 상하 여백 */
  display: flex; flex-direction: column; gap: 3mm; overflow: hidden;
  padding: 1mm 2mm 0 1mm;
  font-size: calc(var(--fs-body) * var(--sfs));
}
.sol-flow { flex: 1; min-height: 0; overflow: hidden; padding-top: 2.5mm; column-gap: 8mm; column-fill: auto; }
.sol-flow.is-2col { column-count: 2; }
.sol-steps { list-style: none; margin: 0; padding: 0; }
.sol-step {
  display: grid; grid-template-columns: 5mm minmax(0, 1fr); column-gap: 2mm;
  break-inside: avoid;
}
.sol-step + .sol-step { margin-top: var(--sol-step-gap); }
.sol-step::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: start;
  width: 5mm; height: 5mm; border-radius: 50%;
  background: var(--kind); color: var(--paper);
  font-size: 7.937500pt; font-weight: 700; line-height: 5mm; text-align: center;
}
.sol-step-label {
  grid-column: 2; grid-row: 1; align-self: center;
  font-size: .9em; font-weight: 700; line-height: 1.3;
}
.sol-step-body { grid-column: 2; margin-top: 2.5mm; }
.sol-step-body:first-child { grid-row: 1; margin-top: 0; }
.sol-step-body .katex-display { overflow-x: clip; }
.sol-answer { flex: none; }

/* 검토된 핵심 풀이의 그림: 원래 설명 HTML과 같은 SVG 클래스 계약. */
:is(.sol-step-body, .sol-answer) figure { margin: 2mm 0; break-inside: avoid; }
:is(.sol-step-body, .sol-answer) img, :is(.sol-step-body, .sol-answer) svg:not(.katex svg) {
  display: block; max-width: 100%; max-height: 45mm; height: auto; color: var(--ink);
}
:is(.sol-step-body, .sol-answer) svg:not(.katex svg) { width: 90mm; }
:is(.sol-step-body, .sol-answer) .fig-ink { stroke: currentColor; fill: none; stroke-width: 2; }
:is(.sol-step-body, .sol-answer) .fig-accent { stroke: var(--kind); fill: none; stroke-width: 2.5; }
:is(.sol-step-body, .sol-answer) .fig-danger { stroke: var(--overflow); fill: none; stroke-width: 2.5; }
:is(.sol-step-body, .sol-answer) .fig-dot { fill: var(--kind); }
:is(.sol-step-body, .sol-answer) .fig-text { fill: currentColor; font-size: 13px; font-family: inherit; }
:is(.sol-step-body, .sol-answer) svg :is(text, tspan) { font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal; }
:is(.sol-step-body, .sol-answer) svg :is(tspan[baseline-shift="sub"], tspan[baseline-shift="super"]) { font-size: 78%; }
:is(.sol-step-body, .sol-answer) svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2563eb; }
:is(.sol-step-body, .sol-answer) svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #dc2626; }
:is(.sol-step-body, .sol-answer) .fig-muted { fill: var(--muted); font-size: 12px; font-family: inherit; }
:is(.sol-step-body, .sol-answer) svg marker { fill: currentColor; }
:is(.sol-step-body, .sol-answer) .axis { stroke: var(--muted); stroke-width: 1.5; }
:is(.sol-step-body, .sol-answer) .tick { fill: var(--muted); font-size: 11px; }
:is(.sol-step-body, .sol-answer) .plot-truth { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
:is(.sol-step-body, .sol-answer) .plot-fit, :is(.sol-step-body, .sol-answer) .plot-like { fill: none; stroke: var(--kind); stroke-width: 2.5; }
:is(.sol-step-body, .sol-answer) .plot-prior { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 4; }
:is(.sol-step-body, .sol-answer) .plot-post { fill: none; stroke: var(--kind); stroke-width: 3; }
:is(.sol-step-body, .sol-answer) .pt-train { fill: var(--kind); }
:is(.sol-step-body, .sol-answer) .pt-test { fill: var(--overflow); }
:is(.sol-step-body, .sol-answer) .mark-ml, :is(.sol-step-body, .sol-answer) .mark-map { stroke: var(--kind); stroke-width: 1.5; stroke-dasharray: 3 3; }


/* Hint 띠: 전체가 Hint 쪽 링크 */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 10.205357pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 8.504464pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.803571pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 10.772321pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 10.205357pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 7.370536pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 9.638393pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}

font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">X\u003c/tspan> (+)\u003c/text>\n\u003c/svg>\u003cfigcaption>두 게이트에 같은 $v_{CM}$을 가하고 전원 $V_{DD}$와 바이어스 $V_b$를 AC 접지로 둔 전압 이득 회로예요. 입력 MOS의 $r_o$와 몸체 효과는 생략하고 실제 부하 $R_D$를 남겨요. 출력 X는 단락하지 않아요. 반회로의 $2r_{O3}$는 실제 테일 $r_{O3}$와 구별해요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$i_d=g_m(v_{CM}-v_P)$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{v_P}{2r_{O3}}=i_d$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{v_X}{R_D}+i_d=0$$\u003c/div>\n"}, {"label": "소스 축퇴에서 한쪽 출력 이득", "html": "\n\u003cdiv class=\"equation\">$$\\frac{i_d}{v_{CM}}=\\frac{g_m}{1+2g_mr_{O3}}=\\frac{1}{1/g_m+2r_{O3}}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}=\\frac{v_X}{v_{CM}}=-\\frac{R_D}{1/g_m+2r_{O3}}$$\u003c/div>\n"}, {"label": "평형 오버드라이브로 요구식 증명", "html": "\n\u003cdiv class=\"equation\">$$g_m=\\frac{2(I_{SS}/2)}{V_{ov}}=\\frac{I_{SS}}{V_{ov}}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}=-\\frac{R_D}{V_{ov}/I_{SS}+2/(\\lambda I_{SS})}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}=\\frac{-R_DI_{SS}}{V_{ov}+2/\\lambda}$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>한쪽 출력의 공통 모드 이득\u003c/strong>은 다음과 같아요. 대칭·포화·저주파 소신호, 입력 MOS의 $\\lambda=0$, 몸체 효과 생략 모델이에요.\u003c/p>\u003cdiv class=\"equation\">$$\\boxed{A_{CM}=\\frac{-R_DI_{SS}}{2/\\lambda+(V_{GS}-V_{TH})_{eq.}}}$$\u003c/div>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": null, "content_sha256": "bd9b03a2ca367f1bb07cbe856c76596f3692655c1af23bb4a94d47800ec2aa8d", "depends_on": [], "estimated_minutes": 12, "id": "P10.67", "kind": "장말문제", "learning_goals": ["CM 반회로"], "priority": "core", "reference_solution": "solution", "subpart_count": 1, "subparts": [{"ask_md": "- 공통 모드 이득을 계산하고 다음을 증명\n  $$A_{CM} = \\frac{-R_D I_{SS}}{\\dfrac{2}{\\lambda} + (V_{GS} - V_{TH})_{eq.}} \\qquad (10.224)$$", "label": "main"}], "why": "기출 수치 계산에 앞서 2R_SS 반회로와 원문 지정 CM 식 증명을 연습"}, "review_workload_label": "핵심 · 소문항 1묶음 · 예상 12분(추정)", "source_title": "테일 소자 M3만 λ ≠ 0인 MOS 차동쌍(Fig 10.88)의 공통 모드 이득 식 증명"}, {"id": "P10.68", "kind": "장말문제", "number": "10.68", "title": "P2. 전류원 부하의 공통 모드 이득", "section": "10.5 Common-Mode Rejection", "book_page": 565, "difficulty": 0, "sol": false, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>Calculate the common-mode gain of the circuit depicted in Fig. 10.89. Assume $\\lambda &gt; 0$, $g_m r_O \\gg 1$, and use the relationship $A_v = -G_m R_{out}$.\u003c/p>", "conditions": "\u003cul>\u003cli>$\\lambda &gt; 0$\u003c/li>\u003cli>$g_m r_O \\gg 1$\u003c/li>\u003cli>$A_v = -G_m R_{out}$ 관계를 사용\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>회로의 공통 모드 이득\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQQAAADECAIAAAD29chdAAAACXBIWXMAABYlAAAWJQFJUiTwAABL7ElEQVR4nO19h1/UyPv/77/5fmT7LixLERtWrHieXTo2LNjbeerZy1kQEBCxd7H3dnc2ir2LvWNvoAhs8nsnk8xOsgsiRVbM84oxJNlkMvO8nzLzzDP/j9dII41E+n/1XQCNNPIW0sCgkUYSaWDQSCOJGgwYnBVvGnmkSmrMyXEcuamsrEy41SlUIz1Jj8l5p7OsHopfB9RgwKBR9ahCCcKyPu/ie5dwUd3QAEgDg0aeifJ9aWkpOeBEIpfIAasfGgBpYNCoQgKvs4yOQ5btCRKIHdUwSAODRp6J+gnl5WpzCFeIidTALCUNDBp5JqoTcnLyIiKisD18+FjGAP/5c0lMTFx0dOzhw4frs5S1ShoYNKqQnALxeXlnjUazwWDKz7vAc3yZ6EGkpWX4+OhDQ1uVlpa7q46flDQw/CL0fb3MrP3z/PkLIMFs8j144KizHNf4Tx+/BAeHACHbt++sg6LWGzUoMNDuDpXnp6Rfc/ChwlEXWmMyAJxwE3gGD6hIi9nPZLRt2rgNSAAelqUuN+gtXbp0LSsjfoXiUR6Pf4oepwYDBqc49FOVXnANDAqClcO7OknL3G/DlfZhnaEZMtKzAIYP74sDA0KMBqtgNXlCQhkgIrM+7YR1f5cXUgMBgyjMpFYkNa5RFUlZXUIdlpeX0r/Bt9gGDRwK7p8zewHn5JcsTtHrzDjDc9JV9mbmsZz7SdoN5Z3UoMBABRLn1k4aeSRSYagop1OqPREJtBqlGvxr2izYRZMmTvn44bPDP9hm9X9w/wmAQTiedjHRCifmE+tY/xTN0UDAwCvGR8nfPFoLe/Um3f2LbXyFH84x0pqNQWKNmeUZK+EzDB40bNHCFKBi+l+z6WOPH/83NTUtOTkV+2XL0tesWVdSIimWmzcLUlKWLV2akpaWQfbv338kOPFOajhg4EXxs2/fgZjo/pERsVGRcXGxg6OjBrht8eLmfr5hb/EePzwmeiA5//ffi5RsqlAOBw8cBQbC2nUKcDQJCmzy7u2n8jLBkwZFREQZjWZ4FLgBphQwg6e o5\u003c/tspan>\u003c/text>\n\u003c/svg>\u003cfigcaption>$G_m$ 측정: 출력 단락이므로 $r_{o3}$ 양단 전압도 0이라 그 가지는 생략했어요. $M_1$의 $r_{o1}$은 유지했어요. 입력의 +/−는 $v_{gs1}=v_{CM}-v_s$를 나타내요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$v_s=2r_{o5}i_o$$\u003c/div>\n\u003cdiv class=\"equation\">$$i_o=g_{m1}(v_{CM}-v_s)-\\frac{v_s}{r_{o1}}$$\u003c/div>\n"}, {"label": "출력 단락 트랜스컨덕턴스", "html": "\n\u003cdiv class=\"equation\">$$G_m=\\frac{i_o}{v_{CM}}=\\frac{1}{1/g_{m1}+2r_{o5}+2r_{o5}/(g_{m1}r_{o1})}\\approx\\frac1{2r_{o5}}$$\u003c/div>\n\u003cp>$g_{m1}r_{o1}\\gg1$, $2g_{m1}r_{o5}\\gg1$에서 $2r_{o5}$가 분모를 지배해요.\u003c/p>\n"}, {"label": "입력 영점과 출력 시험원 및 저항 판단", "html": "\n\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 640 330\" role=\"img\" aria-label=\"왼쪽 게이트 입력은 접지되고, 종속전류원 gm1(-vs)가 ro1 왼쪽에 놓인다. 소스 아래에 2ro5가 있고 출력에는 ro3가 접지로 연결된다. 가장 오른쪽 출력 끝점 Vt에서 시험전압원을 접지로 연결하며 it는 끝점 왼쪽에서 왼쪽으로 유입한다.\">\n\u003cpath class=\"fig-ink\" d=\"M40 110 H125 M125 93 V127 M40 110 V146 M30 146 H50 M34 151 H46 M38 156 H42 M210 70 H590 M210 70 V123 M210 169 V205 H340 M340 70 V107 M210 205 V222 M210 278 V295 M200 295 H220 M204 300 H216 M208 305 H212 M455 70 V121 M455 184 V295 M445 295 H465 M449 300 H461 M453 305 H457 M590 70 V135 M590 167 V295 M580 295 H600 M584 300 H596 M588 305 H592\"/>\n\u003cpolygon class=\"fig-ink\" points=\"210,123 226,146 210,169 194,146\"/>\n\u003cpath class=\"fig-ink\" d=\"M210 133 V158 M205 152 L210 158 L215 152 M340 107 v10 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v47 M210 222 v5 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v9 M455 121 v5 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v16 M570 89 H520 M528 84 L520 89 L528 94\"/>\n\u003ccircle class=\"fig-ink\" cx=\"590\" cy=\"151\" r=\"16\"/>\u003cpath class=\"fig-ink\" d=\"M584 145 H596 M590 139 V151 M584 158 H596\"/>\n\u003ccircle class=\"fig-dot\" cx=\"210\" cy=\"205\" r=\"4\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\"/>\u003ccircle class=\"fig-dot\" cx=\"340\" cy=\"205\" r=\"4\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"340\" cy=\"70\" r=\"4\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"455\" cy=\"70\" r=\"4\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"590\" cy=\"70\" r=\"4\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text fig-math\" x=\"49\" y=\"92\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">in\u003c/tspan> = 0\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"221\" y=\"191\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">s\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"563\" y=\"49\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">V\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">t\u003c/tspan> (+)\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"535\" y=\"111\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">i\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">t\u003c/tspan>\u003c/text>\n\u003ctext class=\"fig-text fig-math\" x=\"65\" y=\"188\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">m1\u003c/tspan>(−\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">s\u003c/tspan>)\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"353\" y=\"147\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">o1\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"468\" y=\"155\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">o3\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"231\" y=\"259\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">2\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">o5\u003c/tspan>\u003c/text>\n\u003c/svg>\u003cfigcaption>$R_{out}$ 측정: 게이트 입력을 접지하고 오른쪽 시험원 $V_t$를 걸어요. $i_t$는 출력으로 유입하며 $R_{out}=V_t/i_t$예요. 제어원·$r_{o1}$·출력의 좌우 순서를 유지하고 테일 축퇴를 소스 아래에 두었어요.\u003c/figcaption>\u003c/figure>\n\u003cp>$M_1$ 아래쪽은 소스 축퇴로 저항이 커져요. 큰 곱 항이 지배하는 조건에서 다음 근사를 사용해요.\u003c/p>\n\u003cdiv class=\"equation\">$$R_{\\downarrow}\\approx 2g_{m1}r_{o1}r_{o5}$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{out}\\approx r_{o3}\\parallel\\left(2g_{m1}r_{o1}r_{o5}\\right)\\approx r_{o3}$$\u003c/div>\n\u003cp>마지막 근사는 $2g_{m1}r_{o1}r_{o5}\\gg r_{o3}$일 때예요. 곱 항은 $r_{o1},2r_{o5}$보다 커야 해요.\u003c/p>\n"}, {"label": "전류 생성과 출력 저항을 이득으로 연결", "html": "\n\u003cdiv class=\"equation\">$$A_{CM,SE}=-G_mR_{out}\\approx-\\frac{r_{o3}}{2r_{o5}}$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>한 출력 기준 공통 모드 이득\u003c/strong>은 큰 $g_mr_o$, 몸체 효과 무시 및 $2g_{m1}r_{o1}r_{o5}\\gg r_{o3}$에서 다음과 같아요.\u003c/p>\u003cdiv class=\"equation\">$$\\boxed{A_{CM,SE}\\approx-\\frac{r_{o3}}{2r_{o5}}}$$\u003c/div>\u003cp>완전 대칭인 원 그림의 두 단자 차동 출력은 $A_{CM,DM}=(v_{out1}-v_{out2})/v_{CM}=0$이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": null, "content_sha256": "c17eb19a3af6d66284b58de7d9e5f8e81666ae59d0a7d07c59cb7375c62f4df3", "depends_on": [], "estimated_minutes": 15, "id": "P10.68", "kind": "장말문제", "learning_goals": ["CM 반회로"], "priority": "extra", "reference_solution": "solution", "subpart_count": 1, "subparts": [{"ask_md": "- 회로의 공통 모드 이득", "label": "main"}], "why": "기출의 캐스코드 테일 비교 전에 Gm·Rout 지정 방법을 보완"}, "review_workload_label": "추가 연습 · 소문항 1묶음 · 예상 15분(추정)", "source_title": "PMOS 전류원 부하와 테일 M5를 가진 MOS 차동쌍(Fig 10.89)의 공통 모드 이득"}, {"id": "2018-2_중간-Q3", "kind": "기출", "number": "3", "title": "P3. 캐스코드 테일의 DM·CM 이득", "section": "2018-2 중간고사 · 20점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 회로에 대해 주어진 조건을 이용하여 질문에 답하시오.\u003c/p>\u003cp>: $V_{DD} = 1.8\\ \\text{V}$, $I_{D5} = I_{D6} = 1\\ \\text{mA}$, $(W/L)_{1,2} = 200/0.2$, $(W/L)_{3,4} = 400/0.2$, $(W/L)_{5,6} = 400/0.2$, $\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$, $\\lambda_n = \\lambda_p = 0.1\\ \\text{V}^{-1}$. 이 때, $g_m r_o \\gg 1$로 가정한다.\u003c/p>\u003cp>(1) 차동 전 tbW1ujDwIA+rN33nknzTjjjHV/3BEjRnTr54YOHZrWXXfdNGrUqOz/AYDGENgBoMEGDBiQymjHHXdMJ510UqMPAwD6LSXxAECue+65xzMDAA0ksAMAuZZZZhnPDAA00MBG7hwA+H9z2GeYYYa6PhXTTDNNt+efx8+tt9566aijjvLrAYAGMocdAAAASkhJPAAAAJSQwA4AAAAlZA47AJTQp59+mvbee+901VVXZf/fW6y5DgDlZQ47AJTQTjvtlE4++eQ+25811wGgfJTEA0AJ9fUa6NZcB4DyEdgBoIT6eg10a64DQPmYww4AJTRq1Kg0YMCAdOWVV/b6HHZrrgNAOZnDDgAAACWkJB4AAABKSGAHAACAEjKHHQBaeK1266wDQPMyhx0A+sFa7dZZB4DmoyQeAJpULWunW2cdAJqPwA4ATaqWtdOtsw4AzcccdgBo4bXarbMOAM3LHHYAAAAoISXxAAAAUEICOwAAAJSQwA4AAAAlJLADAABACQnsAAAAUEICOwAAAJSQwA4AAAAlJLADAABACQnsAAAAUEICOwAAAJSQwA4AAAAlJLADAABACQnsAAAAUEICOwAAAJSQwA4AAAAlJLADAABAKp//D3onBpIqsV6XAAAAAElFTkSuQmCC", "w_mm": 54.3, "h_mm": 46.1}], "hints": [{"label": "(2) 꼬리를 둘로 쪼갠 CM 반회로", "html": "\u003cul>\u003cli>CM 입력에서는 두 쪽이 똑같이 움직여 가운데를 가로지르는 전류가 없으므로 회로를 반으로 자를 수 있다\u003c/li>\u003cli>두 쪽이 꼬리 전류원 하나를 나눠 쓰므로, 반쪽 소스에는 꼬리 출력 저항의 두 배가 달린다. 꼬리가 $M_5$–$M_6$ 캐스코드라 이 저항은 매우 크다\u003c/li>\u003c/ul>"}], "solution": {"steps": [{"label": "(1) DM 반회로와 첫 식", "html": "\n\u003cp>DM 자극은 $v_{in1}=v_{id}/2$, $v_{in2}=-v_{id}/2$예요. P는 가상 접지이므로 왼쪽은 부하가 $r_{o1}\\parallel r_{o3}$인 공통 소스(common-source, CS) 단이에요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\frac{v_{o1}}{v_{id}/2}=-g_{m1}(r_{o1}\\parallel r_{o3})$$\u003c/div>\n"}, {"label": "(1) 동작 전류와 소신호 파라미터", "html": "\n\u003cp>대칭인 평형 상태에서 입력쌍과 PMOS 부하의 전류는 각각 테일 전류의 절반이에요. 먼저 $100\\,\\mu\\mathrm{A/V^2}=0.1\\,\\mathrm{mA/V^2}$로 바꾸어요.\u003c/p>\n\u003cdiv class=\"equation\">$$I_{D1}=I_{D2}=I_{D3}=I_{D4}=\\frac{1\\,\\mathrm{mA}}2=0.5\\,\\mathrm{mA}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_{m1}=g_{m2}=\\sqrt{2(0.1\\,\\mathrm{mA/V^2})(200/0.2)(0.5\\,\\mathrm{mA})}=10\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r_{o1}=r_{o2}=r_{o3}=r_{o4}=\\frac1{(0.1\\,\\mathrm{V^{-1}})(0.5\\,\\mathrm{mA})}=20\\,\\mathrm{k\\Omega}$$\u003c/div>\n"}, {"label": "(1) 두 반회로를 차동 출력으로 합치기", "html": "\n\u003cdiv class=\"equation\">$$r_{o1}\\parallel r_{o3}=20\\,\\mathrm{k\\Omega}\\parallel20\\,\\mathrm{k\\Omega}=10\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{o1}=-g_{m1}(r_{o1}\\parallel r_{o3})\\frac{v_{id}}2$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{o2}=+g_{m1}(r_{o1}\\parallel r_{o3})\\frac{v_{id}}2$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{DM}=\\frac{v_{o1}-v_{o2}}{v_{id}}=-g_{m1}(r_{o1}\\parallel r_{o3})=-(10\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})=-100$$\u003c/div>\n"}, {"label": "(2) CM 반회로의 실제 연결", "html": "\n\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 660 370\" role=\"img\" aria-label=\"CM 반회로. 왼쪽 입력 vCM, 제어원 왼쪽, ro1 오른쪽, 부하 ro3와 출력 맨 오른쪽. 공통 소스 P 아래 2RSS가 접지에 연결된다.\">\n\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M55 145 H145 M235 85 H570 M235 85 V125 M235 175 V235 H380 M380 125 V85 M380 175 V235 M235 235 V265 M235 305 V330 M220 330 H250 M225 336 H245 M231 342 H239 M485 85 V125 M485 175 V210 M470 210 H500 M475 216 H495 M481 222 H489\"/>\n\u003ccircle class=\"fig-ink\" fill=\"none\" cx=\"235\" cy=\"150\" r=\"25\"/>\n\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M235 134 V165 M229 157 L235 165 L241 157\"/>\n\u003crect class=\"fig-ink\" fill=\"none\" x=\"370\" y=\"125\" width=\"20\" height=\"50\"/>\n\u003crect class=\"fig-ink\" fill=\"none\" x=\"475\" y=\"125\" width=\"20\" height=\"50\"/>\n\u003crect class=\"fig-ink\" fill=\"none\" x=\"225\" y=\"265\" width=\"20\" height=\"40\"/>\n\u003ctext class=\"fig-text\" x=\"86\" y=\"131\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">+\u003c/text>\u003ctext class=\"fig-text\" x=\"86\" y=\"170\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">−\u003c/text>\n\u003ctext class=\"fig-text fig-math\" x=\"110\" y=\"174\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">gs1\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"160\" y=\"199\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">m1\u003c/tspan>\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">gs1\u003c/tspan>\u003c/text>\n\u003ctext class=\"fig-text fig-math\" x=\"399\" y=\"155\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">o1\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"511\" y=\"155\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">o3\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"266\" y=\"292\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">2\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">SS\u003c/tspan>\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"55\" cy=\"145\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"vin\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text fig-math\" x=\"38\" y=\"117\" fill=\"#2563eb\" stroke=\"none\" data-node=\"vin\" data-node-color=\"blue\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">CM\u003c/tspan>\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"235\" cy=\"235\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"p\" data-node-color=\"red\"/>\n\u003ctext class=\"fig-text fig-math\" x=\"174\" y=\"245\" fill=\"#dc2626\" stroke=\"none\" data-node=\"p\" data-node-color=\"red\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">P\u003c/tspan>\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"380\" cy=\"235\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"p\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"235\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"380\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"485\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"570\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text fig-math\" x=\"535\" y=\"61\" fill=\"#2563eb\" stroke=\"none\" data-node=\"out\" data-node-color=\"blue\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">o1\u003c/tspan> (+)\u003c/text>\n\u003c/svg>\u003cfigcaption>CM 전압 이득을 구하는 왼쪽 반회로예요. 출력은 외부 무부하이고 $r_{o3}$는 내부 부하예요. 입력 $v_{CM}$은 $M_1$의 게이트 제어 전압을 정하며, $v_{gs1}=v_{CM}-v_P$예요. $r_{o1}$을 포함한 CS 블록에 알려진 축퇴 이득의 큰 $g_mr_o$ 근사를 적용해요. DM에서는 같은 그림의 P를 접지로 바꾸어요.\u003c/figcaption>\u003c/figure>\n\u003cp>캐스코드 테일은 $g_{m5}r_{o5}r_{o6}\\gg r_{o5},r_{o6}$에서 알려진 주항 블록으로 써요.\u003c/p>\n\u003cdiv class=\"equation\">$$R_{SS}\\approx g_{m5}r_{o5}r_{o6}$$\u003c/div>\n\u003cp>CM 반회로는 소스 아래 $2R_{SS}$를 둔 축퇴 CS 단이에요. 큰 $g_{m1}r_{o1}$, $2g_{m1}R_{SS}\\gg1$ 및 $r_{o3}/(2R_{SS})\\ll g_{m1}r_{o1}$의 주항 이득을 바로 적용해요. 이는 유한 $r_{o1}$ 모델의 주항 근사예요.\u003c/p>\n\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{r_{o3}}{2R_{SS}}$$\u003c/div>\n"}, {"label": "(2) 캐스코드 테일의 주항 저항", "html": "\n\u003cdiv class=\"equation\">$$g_{m5}=g_{m6}=\\sqrt{2(0.1\\,\\mathrm{mA/V^2})(400/0.2)(1\\,\\mathrm{mA})}=20\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r_{o5}=r_{o6}=\\frac1{(0.1\\,\\mathrm{V^{-1}})(1\\,\\mathrm{mA})}=10\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_{m5}r_{o6}=(20\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})=200\\gg1$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{SS}\\approx(20\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})(10\\,\\mathrm{k\\Omega})=2000\\,\\mathrm{k\\Omega}=2\\,\\mathrm{M\\Omega}$$\u003c/div>\n"}, {"label": "(2) CM 축퇴 이득에 대입", "html": "\n\u003cdiv class=\"equation\">$$\\frac1{g_{m1}}=\\frac1{10\\,\\mathrm{mS}}=0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$2R_{SS}\\approx4000\\,\\mathrm{k\\Omega}\\gg0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{20\\,\\mathrm{k\\Omega}}{4000\\,\\mathrm{k\\Omega}}=-5\\times10^{-3}$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>\u003cstrong>$A_{DM}=-100\\,\\mathrm{V/V}$\u003c/strong>예요. 왼쪽−오른쪽 출력과 왼쪽−오른쪽 입력을 사용한 대칭 소신호 이득이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>\u003cstrong>$A_{CM}\\approx-5\\times10^{-3}\\,\\mathrm{V/V}$\u003c/strong>예요. $g_mr_o\\gg1$의 주항, 캐스코드 테일 $R_{SS}\\approx2\\,\\mathrm{M\\Omega}$, 완전 대칭인 포화 소신호 동작 조건이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "9f9ed42323f321069d8e231750f36bb5dd6d8efbf35f3f84905c5b77841a1b8d", "depends_on": [], "estimated_minutes": 18, "id": "2018-2_중간-Q3", "kind": "기출", "learning_goals": ["CM 반회로", "테일 구조 비교"], "priority": "core", "reference_solution": "solution", "subpart_count": 2, "subparts": [{"ask_md": "차동 전압 이득", "label": "1", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "능동 부하의 소신호 등가회로", "소신호 전압 이득"]}, {"ask_md": "Common-mode 이득 $A_{CM} = \\Delta V_{out,CM}/\\Delta V_{in,CM}$", "label": "2", "required_concepts": ["차동 증폭기", "캐스코드", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "출력 저항", "소스·이미터 축퇴", "공통 모드 해석", "능동 부하의 소신호 등가회로", "소신호 전압 이득"]}], "why": "캐스코드 테일과 PMOS 부하를 가진 실제 기출에서 DM과 CM 이득을 비교"}, "review_workload_label": "핵심 · 소문항 2묶음 · 예상 18분(추정)", "source_title": "pmos 전류원 부하와 캐스코드 테일을 가진 MOS 차동 증폭기의 차동 이득과 A_CM"}, {"id": "2018-2_중간-Q4", "kind": "기출", "number": "4", "title": "P4. 공통 모드 제거와 부하 불일치", "section": "2018-2 중간고사 · 20점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 회로에 대해 주어진 조건을 이용하여 질문에 답하시오.\u003c/p>\u003cp>: $V_{DD} = 1.8\\ \\text{V}$, $I_{D3} = 1\\ \\text{mA}$, $(W/L)_{1,2} = 200/0.2$, $(W/L)_3 = 400/0.2$, $R_D = 1\\ \\text{k}\\Omega$, $\\Delta R_D = 0.02R_D = 20\\ \\Omega$, $\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\lambda_n = 0.1\\ \\text{V}^{-1}$, $r_o \\gg R_D$이고 $g_m r_o \\gg 1$로 가정한다.\u003c/p>\u003cp>(1) Differential pair에서 \"common-mode (CM) rejection\" 특성의 의미를 설명하고, 실제 회로에서 CM rejection 특성이 제한되는 이유 2가지를 설명하시오.\u003c/p>\u003cp>(2) Common-mode input to differential-mode output 이득($A_{CM-DM} = \\Delta V_{out}/\\Delta V_{in,CM}$)을 구하시오.\u003c/p>", "conditions": "\u003cul>\u003cli>$ aria-label=\"공통 모드 반회로: 입력은 왼쪽, 제어 전류원과 병렬 출력저항, 부하와 출력은 오른쪽, 소스 아래 두 배 꼬리 저항\">\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M55 140 H145 M145 123 V157 M270 75 H690 M270 75 V110 M270 170 V220 H420 M270 220 V250 M270 300 V320 M253 320 H287 M259 327 H281 M265 334 H275 M570 75 V110 M570 170 V190 M553 190 H587 M559 197 H581 M565 204 H575\"/>\u003cpolygon class=\"fig-ink\" fill=\"none\" points=\"270,110 290,140 270,170 250,140\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M270 122 V156 M262 146 L270 157 L278 146\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"560\" y=\"110\" width=\"20\" height=\"60\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"260\" y=\"250\" width=\"20\" height=\"50\"/>\u003ctext x=\"75\" y=\"116\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p4-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">CM\u003c/tspan>\u003c/text>\u003ccircle cx=\"55\" cy=\"140\" r=\"4\" data-node=\"p4-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"188\" y=\"197\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m\u003c/tspan>\u003c/text>\u003ctext x=\"228\" y=\"197\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"591\" y=\"145\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">D\u003c/tspan>\u003c/text>\u003ctext x=\"300\" y=\"283\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">2R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">SS\u003c/tspan>\u003c/text>\u003ccircle cx=\"270\" cy=\"220\" r=\"4\" data-node=\"p4-s\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ctext x=\"213\" y=\"240\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p4-s\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">P\u003c/tspan>\u003c/text>\u003ccircle cx=\"570\" cy=\"75\" r=\"4\" data-node=\"p4-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"690\" cy=\"75\" r=\"4\" data-node=\"p4-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"690\" y=\"52\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p4-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\" text-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003c/svg>\u003cfigcaption>두 입력에 같은 $v_{CM}$을 가해요. 전원과 고정 바이어스는 AC 접지이고 출력은 단락하지 않아요. $v_{gs}=v_{CM}-v_P$이며 입력쌍의 $r_o$를 생략한 수업 모델이에요. 반쪽 소스 아래의 $2R_{SS}$는 공유 꼬리를 나눈 값이에요.\u003c/figcaption>\u003c/figure>\u003cp>저항 부하 $R_D$ 또는 $R_D+\\Delta R_D$만 바꾸며 같은 입력쌍 전류 변환율을 사용해요. 각 출력은 전류가 증가하면 내려가요.\u003c/p>\u003cdiv class=\"equation\">$$i=g_m(v_{CM}-2R_{SS}i)$$\u003c/div>\u003cdiv class=\"equation\">$$\\frac{i}{v_{CM}}=\\frac{1}{1/g_m+2R_{SS}}\\approx\\frac1{2R_{SS}}$$\u003c/div>"}, {"label": "(2) 테일 전류를 나누고 소신호 값을 계산", "html": "\u003cdiv class=\"equation\">$$100\\,\\mu\\mathrm{A/V^2}=0.1\\,\\mathrm{mA/V^2}$$\u003c/div>\u003cdiv class=\"equation\">$$I_{D1}=I_{D2}=0.5\\,\\mathrm{mA}$$\u003c/div>\u003cdiv class=\"equation\">$$g_m=\\sqrt{2(0.1)(200/0.2)(0.5)}=10\\,\\mathrm{mS}$$\u003c/div>\u003cdiv class=\"equation\">$$R_{SS}=\\frac1{(0.1)(1\\,\\mathrm{mA})}=10\\,\\mathrm{k\\Omega}$$\u003c/div>"}, {"label": "(2) 같은 가지 전류에 서로 다른 부하를 곱하기", "html": "\u003cdiv class=\"equation\">$$v_{o1}=-R_Di$$\u003c/div>\u003cdiv class=\"equation\">$$v_{o2}=-(R_D+\\Delta R_D)i$$\u003c/div>\u003cdiv class=\"equation\">$$v_{od}=\\Delta R_Di$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac{\\Delta R_D}{2R_{SS}}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac{0.02\\,\\mathrm{k\\Omega}}{20\\,\\mathrm{k\\Omega}}=+10^{-3}$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>두 입력에 함께 실린 변화를 차동 출력에서 억제해요. 유한한 테일 출력저항과 좌우 소자·부하 불일치가 실제 제거 성능을 제한해요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>$A_{CM-DM}\\approx+10^{-3}\\,\\mathrm{V/V}$예요. 왼쪽−오른쪽 출력, 입력쌍 $r_o$ 생략 및 큰 축퇴 주항 조건이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "86b2ad2f662f38e65426e672b3bc94aade119df0fc2f9b056fc36460a6a0282e", "depends_on": [], "estimated_minutes": 12, "id": "2018-2_중간-Q4", "kind": "기출", "learning_goals": ["CM 제거 서술", "CM→DM 변환"], "priority": "core", "reference_solution": "solution", "subpart_count": 2, "subparts": [{"ask_md": "Differential pair에서 \"common-mode (CM) rejection\" 특성의 의미를 설명. 그리고 실제 회로에서 CM rejection 특성이 제한되는 이유 2가지를 설명", "label": "1", "required_concepts": ["차동 증폭기", "공통 모드 해석", "유한 출력 저항(ro)", "소자·부하 불일치와 CM-DM 변환"]}, {"ask_md": "Common-mode input to differential-mode output 이득 $A_{CM-DM} = \\Delta V_{out}/\\Delta V_{in,CM}$", "label": "2", "required_concepts": ["차동 증폭기", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "소스·이미터 축퇴", "공통 모드 해석", "소자·부하 불일치와 CM-DM 변환", "소신호 전압 이득"]}], "why": "CM 제거의 두 가지 한계를 서술하고 부하 불일치 누출을 수치화하는 기출"}, "review_workload_label": "핵심 · 소문항 2묶음 · 예상 12분(추정)", "source_title": "부하 저항 불일치 ΔR_D가 있는 MOS 차동 증폭기의 CM 제거 서술형과 A_CM-DM"}, {"id": "2023-1_중간-Q4", "kind": "기출", "number": "4", "title": "P5. MOS 차동쌍의 입력 범위와 CMRR", "section": "2023-1 중간고사 · 30점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 차동 증폭기에 대해 주어진 조건을 이용하여 질문에 답하시오.\u003c/p>\u003cp>: $V_{DD} = 1.8\\ \\text{V}$, $I_{D3} = 1\\ \\text{mA}$, $R_D = 1\\ \\text{k}\\Omega$, $\\Delta R_D = 20\\ \\Omega$, $(W/L)_{1,2} = 200/0.2$, $(W/L)_3 = 400/0.2$, $V_{TH,n} = 0.4\\ \\text{V}$, $\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\lambda_n = 0.1\\ \\text{V}^{-1}$. 단, $g_m r_o \\gg 1$로 가정한다.\u003c/p>\u003cp>(1) 입력 common-mode level($V_{CM,in}$)의 최대값과 최소값을 각각 구하시오.\u003c/p>\u003cp>(2) Common-mode 이득($A_{CM}$)과 common-mode to differential-mode 변환 이득($A_{CM-DM}$)을 각각 구하시오.\u003c/p>\u003cp>(3) Common-mode rejection ratio(CMRR)를 구하시오.\u003c/p>", "conditions": "\u003cul>\u003cli>$V_{DD} = 1.8\\ \\text{V}$, $I_{D3} = 1\\ \\text{mA}$\u003c/li>\u003cli>$R_D = 1\\ \\text{k}\\Omega$, $\\Delta R_D = 20\\ \\Omega$\u003c/li>\u003cli>$(W/L)_{1,2} = 200/0.2$, $(W/L)_3 = 400/0.2$\u003c/li>\u003cli>$V_{TH,n} = 0.4\\ \\text{V}$, $\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\lambda_n = 0.1\\ \\text{V}^{-1}$\u003c/li>\u003cli>$g_m r_o \\gg 1$로 가정\u003c/li>\u003cli>바이어스 전압 $V_{b1}$ 값은 주어지지 않음\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>(1) 입력 common-mode level $V_{CM,in}$의 최대값과 최소값\u003c/li>\u003cli>(2) Common-mode 이득 $A_{CM}$과 common-mode to differential-mode 변환 이득 $A_{CM-DM}$\u003c/li>\u003cli>(3) Common-mode rejection ratio (CMRR)\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA98AAALuCAYAAAC3oqUMAAAACXBIWXMAAEJwAABCcAFu8l9tAACNvklEQVR4nO3dB5QU1da38TPknLMiSUAEFRUUAwZABbMoKgaMV0SCmAhmBcmKAoqK+aKYcwYEFAUDooJkCSpBchLJ/a1/vd94Z3qqquPp+PzWmqXT1V1V03RX1a6zz945gUAgYAAAAAAAgDWF7K0aAAAAAAAQfAMAAAAAkACMfAMAAAAAYBnBNwAAAAAAlhF8AwAAAABgGcE3AAAAAACWEXwDAAAAAGBZEdsbAAAAAFLJli1bzLZt2zyXV6pUyZQqVSqu21y/fr3ZuXOn5/KaNWuawoULx3WbAFILwTcAAACyynPPPWduvfVWz+WDBg0y/fv3j2vgXb9+fc+Av1mzZubnn3+O2/YApCbSzgEAAJBVDj/8cN/l8+bNi+v2Bg4c6DvSPnToUFOoEJflQKbLCQQCgWTvBAAAAJAo69atM9WqVfNcftRRR5lZs2bFZVsrVqwwjRo1Mrt373Zdfsopp5gpU6bEZVsAUhu32AAAAJBVqlataqpXr+65fMGCBSZe41P33nuvZ+Cdk5Njhg8fHpftAEh9BN8AAADIOocddpjnsh07djgj1rGaO3euGT9+vOfySy65xLRo0SLm7QBIDwTfAAAAyDqJmPetom379+93XVasWDGnsBuA7EHwDQAAgKzjN/Idj+D766+/Nh9++KHn8ptuusnUq1cvpm0ASC8E3wAAAMg6tke++/Xr57msfPny5u67745p/QD xt-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003c/svg>\u003cfigcaption>두 입력에 같은 $v_{CM}$을 가해요. 전원과 고정 바이어스는 AC 접지이고 출력은 단락하지 않아요. $v_{gs}=v_{CM}-v_P$이며 입력 소자의 $r_o$도 드레인–소스 사이에 남겨요. 반쪽 소스 아래의 $2R_{SS}$는 공유 꼬리를 나눈 값이에요.\u003c/figcaption>\u003c/figure>\u003cp>대칭 CM에서는 반쪽 소스 아래 $2R_{SS}$예요. $r_o$를 포함한 CS 축퇴 이득에 큰 $g_mr_o$·큰 $2g_mR_{SS}$를 적용하면 CM 주항은 다음과 같아요.\u003c/p>\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{R_D}{2R_{SS}}$$\u003c/div>"}, {"label": "(3) 반회로의 큰 축퇴 주항", "html": "\u003cp>$\\Delta R_D=0$이고 $2g_mR_{SS}=100\\gg1$, $g_mr_o=100\\gg1$이에요. 각 출력의 주항을 써요.\u003c/p>\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{10\\,\\mathrm{k\\Omega}}{100\\,\\mathrm{k\\Omega}}=-0.1$$\u003c/div>"}, {"label": "(4) 부하 불일치의 전체 연결", "html": "\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 900 540\" role=\"img\" aria-label=\"유한 출력저항과 서로 다른 부하를 가진 두 입력 가지. 두 소스는 P에 공통 접속하고 RSS를 거쳐 접지. 두 제어원은 각 ro 왼쪽, 출력은 맨 오른쪽\">\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 60 H810 M280 60 V100 M280 160 V195 H455 M455 60 V100 M455 160 V195 M655 60 V100 M655 160 V200 M638 200 H672 M644 207 H666 M650 214 H660 M280 195 H200\"/>\u003cpolygon class=\"fig-ink\" fill=\"none\" points=\"280,100 300,130 280,160 260,130\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 112 V146 M272 136 L280 147 L288 136\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"445\" y=\"100\" width=\"20\" height=\"60\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"645\" y=\"100\" width=\"20\" height=\"60\"/>\u003ctext x=\"302\" y=\"160\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m\u003c/tspan>\u003c/text>\u003ctext x=\"335\" y=\"160\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"477\" y=\"138\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003ctext x=\"677\" y=\"138\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">D\u003c/tspan>\u003c/text>\u003ccircle cx=\"455\" cy=\"60\" r=\"4\" data-node=\"p6-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"655\" cy=\"60\" r=\"4\" data-node=\"p6-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"810\" cy=\"60\" r=\"4\" data-node=\"p6-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"810\" y=\"38\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p6-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\" text-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o1\u003c/tspan>\u003c/text>\u003ccircle cx=\"280\" cy=\"195\" r=\"4\" data-node=\"p6-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ccircle cx=\"455\" cy=\"195\" r=\"4\" data-node=\"p6-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 285 H810 M280 285 V325 M280 385 V420 H455 M455 285 V325 M455 385 V420 M655 285 V325 M655 385 V425 M638 425 H672 M644 432 H666 M650 439 H660 M280 420 H200\"/>\u003cpolygon class=\"fig-ink\" fill=\"none\" points=\"280,325 300,355 280,385 260,355\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 337 V371 M272 361 L280 372 L288 361\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"445\" y=\"325\" width=\"20\" height=\"60\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"645\" y=\"325\" width=\"20\" height=\"60\"/>\u003ctext x=\"302\" y=\"385\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m\u003c/tspan>\u003c/text>\u003ctext x=\"335\" y=\"385\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"477\" y=\"363\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003ctext x=\"677\" y=\"363\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">D\u003c/tspan>\u003c/text>\u003ctext x=\"716\" y=\"363\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">+ ΔR\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">D\u003c/tspan>\u003c/text>\u003ccircle cx=\"455\" cy=\"285\" r=\"4\" data-node=\"p6-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"655\" cy=\"285\" r=\"4\" data-node=\"p6-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"810\" cy=\"285\" r=\"4\" data-node=\"p6-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"810\" y=\"263\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p6-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\" text-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o2\u003c/tspan>\u003c/text>\u003ccircle cx=\"280\" cy=\"420\" r=\"4\" data-node=\"p6-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ccircle cx=\"455\" cy=\"420\" r=\"4\" data-node=\"p6-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M200 195 V450 M200 490 V510 M183 510 H217 M189 517 H211 M195 524 H205\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"190\" y=\"450\" width=\"20\" height=\"40\"/>\u003ctext x=\"55\" y=\"110\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p6-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">CM\u003c/tspan>\u003c/text>\u003ccircle cx=\"55\" cy=\"130\" r=\"4\" data-node=\"p6-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"55\" y=\"163\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"55\" y=\"190\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">= v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">CM\u003c/tspan>\u003c/text>\u003ctext x=\"55\" y=\"217\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">− v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">P\u003c/tspan>\u003c/text>\u003ccircle cx=\"200\" cy=\"420\" r=\"4\" data-node=\"p6-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ctext x=\"137\" y=\"407\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p6-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">P\u003c/tspan>\u003c/text>\u003ctext x=\"225\" y=\"480\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">SS\u003c/tspan>\u003c/text>\u003c/svg>\u003cfigcaption>불일치가 있을 때 유지하는 전체 소신호 연결이에요. 두 제어 전압은 모두 $v_{CM}-v_P$이지만 드레인 전압은 달라 $r_o$ 전류와 순 드레인 전류가 서로 다를 수 있어요. 두 가지가 공유하는 것은 실제 $R_{SS}$이고, 이 그림에 $2R_{SS}$를 두 번 넣지 않아요. 출력 전압은 두 오른쪽 노드에서 읽어요.\u003c/figcaption>\u003c/figure>"}, {"label": "(4) 100 Ω 불일치에 주항을 대입", "html": "\u003cdiv class=\"equation\">$$\\Delta R_D=100\\,\\Omega=0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac{0.1}{(100)(1+10/100)}=\\frac1{1100}\\approx9.09\\times10^{-4}$$\u003c/div>"}, {"label": "(5) 같은 모델의 이득 비에서 역산", "html": "\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{g_mR_D/(1+R_D/r_o)}{|\\Delta R_D|/[2R_{SS}(1+R_D/r_o)]}$$\u003c/div>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{2g_mR_{SS}R_D}{|\\Delta R_D|}$$\u003c/div>\u003cdiv class=\"equation\">$$|\\Delta R_D|\\approx\\frac{(1\\,\\mathrm{mS})(100\\,\\mathrm{k\\Omega})(10\\,\\mathrm{k\\Omega})}{30000}$$\u003c/div>\u003cdiv class=\"equation\">$$|\\Delta R_D|\\approx\\frac1{30}\\,\\mathrm{k\\Omega}=\\frac{100}{3}\\,\\Omega\\approx33.33\\,\\Omega$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>\u003cb>X\u003c/b>, 차동 입력 경계의 크기가 $1/\\sqrt2$배, 약 $0.28\\to0.2$ V예요. 입력쌍 크기 변경·테일 전류 고정·제곱법칙 조건이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>$A_{DM}\\approx-9.09$예요. 대칭 DM·유한 입력 $r_o=100$ kΩ를 유지해요.\u003c/p>\u003cp>\u003cstrong>(3)\u003c/strong>\u003c/p>\u003cp>각 출력 $A_{CM}\\approx-0.1$예요. 큰 $g_mr_o$·큰 축퇴 주항이며 대칭 차동 출력 CM 전달은 0이에요.\u003c/p>\u003cp>\u003cstrong>(4)\u003c/strong>\u003c/p>\u003cp>좌−우 $A_{CM-DM}\\approx+9.09\\times10^{-4}$예요. 입력 $r_o$ 유지·작은 불일치·큰 곱 주항이에요.\u003c/p>\u003cp>\u003cstrong>(5)\u003c/strong>\u003c/p>\u003cp>주항 설계의 허용 저항 차이 크기는 $|\\Delta R_D|\\approx33.33\\,\\Omega$예요. 작은 불일치·대칭 기준 DM·동일 유한 $r_o$ 모델이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "152f402ec13dd66f52e373589135a82a808f8543adc2ff903375545dac494f90", "depends_on": [], "estimated_minutes": 25, "id": "2015-1_중간-Q4", "kind": "기출", "learning_goals": ["CMRR 역설계"], "priority": "extra", "reference_solution": "solution", "subpart_count": 5, "subparts": [{"ask_md": "(W/L)를 두 배로 하면 차동 입력 범위가 늘어나는지 O / X로 답함", "label": "1", "required_concepts": ["차동 증폭기", "공통 모드·차동 입력 범위", "MOS 차동쌍의 전류 조향과 입력 범위"]}, {"ask_md": "$\\Delta R_D = 0$일 때 차동 이득 $A_{DM}$", "label": "2", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "유한 출력 저항(ro)", "소신호 전압 이득"]}, {"ask_md": "$\\Delta R_D = 0$일 때 common-mode 이득 $A_{CM}$", "label": "3", "required_concepts": ["차동 증폭기", "공통 모드 해석", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "유한 출력 저항(ro)", "꼬리 전류원의 유한 출력 저항", "소신호 전압 이득"]}, {"ask_md": "$\\Delta R_D = 100\\ \\Omega$일 때 common-mode to differential 이득 $A_{CM-DM}$", "label": "4", "required_concepts": ["차동 증폭기", "공통 모드 해석", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "유한 출력 저항(ro)", "꼬리 전류원의 유한 출력 저항", "소자·부하 불일치와 CM-DM 변환", "소신호 전압 이득"]}, {"ask_md": "CMRR이 30000이 되는 $\\Delta R_D$", "label": "5", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "공통 모드 해석", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "유한 출력 저항(ro)", "꼬리 전류원의 유한 출력 저항", "소자·부하 불일치와 CM-DM 변환", "소신호 전압 이득", "CMRR"]}], "why": "CMRR 목표에서 허용 부하 오차를 역산하고 입력쌍 폭의 영향을 구분하는 기출"}, "review_workload_label": "추가 연습 · 소문항 5묶음 · 예상 25분(추정)", "source_title": "부하 저항 불일치 ΔR_D가 있는 MOS 차동 증폭기의 입력 범위, A_DM, A_CM, A_CM-DM, CMRR로 정하는 ΔR_D"}, {"id": "2015-2_중간-Q3", "kind": "기출", "number": "3", "title": "P7. 테일 폭 변경과 CMRR", "section": "2015-2 중간고사 · 30점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>With device parameters,\u003c/p>\u003cp>$\\mu_n C_{ox} = 100\\ \\text{uA/V}^2$, $\\mu_p C_{ox} = 50\\ \\text{uA/V}^2$, $\\lambda_n=0.1\\ \\text{V}^{-1}$, $\\lambda_p=0.2\\ \\text{V}^{-1}$, $V_{TH,N}=0.4\\text{V}$, $R_D=10\\text{kohm}$, $V_{b1}=0.6\\text{V}$, $(W/L)_1=(W/L)_2=50$, $(W/L)_3=100$\u003c/p>\u003cp>1) Doubling $(W/L)_3$ increases differential input range ( O / X ) (5pt)\u003c/p>\u003cp>2) Calculate differential gain $A_{DM}$ when $\\Delta R_D=0$ (5pt)\u003c/p>\u003cp>3) Calculate common-mode gain $A_{CM}$ when $\\Delta R_D=0$ (5pt)\u003c/p>\u003cp>4) Calculate common-mode input to differential output gain $A_{CM-DM}$ when $\\Delta R_D hints": [], "solution": {"steps": [{"label": "(1) 공통 바이어스와 소신호 값", "html": "\n\u003cdiv class=\"equation\">$$100\\,\\mu\\mathrm{A/V^2}=0.1\\,\\mathrm{mA/V^2}$$\u003c/div>\n\u003cdiv class=\"equation\">$$I_{SS}=\\frac12(0.1)(100)(0.6-0.4)^2=0.2\\,\\mathrm{mA}$$\u003c/div>\n\u003cdiv class=\"equation\">$$I_{D1}=I_{D2}=I_{SS}/2=0.1\\,\\mathrm{mA}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_{m1}=g_{m2}=\\sqrt{2\\mu_nC_{ox}(W/L)_1I_{D1}}=1\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r_{o3}=\\frac1{\\lambda_n I_{SS}}=50\\,\\mathrm{k\\Omega}$$\u003c/div>\n"}, {"label": "(1) 고정 바이어스에서 전류와 범위 배율", "html": "\n\u003cp>$V_{b1}$ 고정, 제곱법칙 DC 근사에서 $(W/L)_3$ 두 배 → $I_{SS}$ 두 배예요.\u003c/p>\n\u003cdiv class=\"equation\">$$|v_{id}|_{\\rm cutoff}=\\sqrt{\\frac{2I_{SS}}{\\mu_nC_{ox}(W/L)_1}}=\\sqrt{0.08}\\,\\mathrm V\\approx0.28\\,\\mathrm V$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{|v'_{id}|_{\\rm cutoff}}{|v_{id}|_{\\rm cutoff}}=\\sqrt2$$\u003c/div>\n\u003cp>두 배 후 경계는 $0.4\\,\\mathrm V$이므로 \u003cb>O\u003c/b>예요. 전후 모두 포화·테일 전류원 동작이 유지되어야 해요.\u003c/p>\n"}, {"label": "(2) DM 가상 접지와 이득", "html": "\u003cp>$\\Delta R_D=0$, 입력쌍 $r_o$ 무시인 수업 모델이에요.\u003c/p>\u003cdiv class=\"equation\">$$A_{DM}=-g_{m1}R_D=-(1\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})=-10$$\u003c/div>"}, {"label": "(3) CM 반회로의 축퇴 이득", "html": "\u003cp>$\\Delta R_D=0$, $r_{o1},r_{o2}$ 무시·$r_{o3}$ 유지예요. 각 출력은 같은 이득으로 움직여요.\u003c/p>\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{R_D}{2r_{o3}}=-\\frac{10}{100}=-0.1$$\u003c/div>"}, {"label": "(4) 부하 차이가 만드는 양의 누출", "html": "\n\u003cdiv class=\"equation\">$$\\Delta R_D=0.01R_D=0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{od}=(-R_D\\Delta i_D)-[-(R_D+\\Delta R_D)\\Delta i_D]=\\Delta R_D\\Delta i_D$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac{\\Delta R_D}{2r_{o3}}=\\frac{0.1}{100}=+0.001$$\u003c/div>"}, {"label": "(5) 동일 차동 출력의 이득 비", "html": "\u003cp>1% 불일치에서, 분자는 수업의 대칭 기준 $A_{DM}=-10$을 사용해요.\u003c/p>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{10}{0.001}=10000$$\u003c/div>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}_{dB}\\approx20\\log_{10}(10000)=80\\,\\mathrm{dB}$$\u003c/div>"}, {"label": "(6) 전류 증가와 테일 저항 감소를 함께 반영", "html": "\n\u003cdiv class=\"equation\">$$I'_{SS}=0.4\\,\\mathrm{mA}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g'_{m1}=\\sqrt2\\,\\mathrm{mS}\\approx1.41\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r'_{o3}=25\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A'_{DM}=-10\\sqrt2\\approx-14.14$$\u003c/div>\n\u003cdiv class=\"equation\">$$A'_{CM-DM}\\approx\\frac{0.1}{50}=0.002$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}'\\approx\\frac{10\\sqrt2}{0.002}=5000\\sqrt2\\approx7071.07$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}'_{dB}\\approx76.99\\,\\mathrm{dB}$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>O: 경계 약 $\\pm0.28\\to\\pm0.4\\,\\mathrm V$, $\\sqrt2$배\u003c/b> ($V_{b1}$ 고정·포화·테일 동작).\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$A_{DM}=-10$\u003c/b> (대칭·입력 $r_o$ 무시).\u003c/p>\u003cp>\u003cstrong>(3)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$A_{CM}\\approx-0.1$\u003c/b> (각 출력·대칭·입력 $r_o$ 무시·테일 유지).\u003c/p>\u003cp>\u003cstrong>(4)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$A_{CM-DM}\\approx+0.001$\u003c/b> (1%·좌−우·입력 $r_o$ 무시).\u003c/p>\u003cp>\u003cstrong>(5)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>CMRR $\\approx10000$ / $80\\,\\mathrm{dB}$\u003c/b> (1%·대칭 기준 $A_{DM}$).\u003c/p>\u003cp>\u003cstrong>(6)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$\\mathrm{CMRR}'\\approx7071.07$ / $76.99\\,\\mathrm{dB}$\u003c/b> ($V_{b1}$ 고정·테일 폭 2배·1%·수업 모델).\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "ab
