<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="강조색 가로선인 나오는 곳 높이 아래에 입구 높이를 나타내는 가로선 두 개가 있고, 위를 향한 점선 화살표가 강조색 선에서 멈춘다. 강조색 선 바로 위는 경고색 점선 테두리로 둘러싼 구역이라 그 위로는 올릴 수 없음을 나타낸다."><style>
