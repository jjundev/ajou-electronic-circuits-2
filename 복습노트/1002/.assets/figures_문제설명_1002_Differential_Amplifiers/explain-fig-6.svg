<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="바이폴라 캐스코드 반회로. 입력 v_i가 Q₁의 r_π1에 걸려 v_π1 = v_i예요. 중간 노드 v_x와 접지 사이에 Q₁의 g_m v_π1(아래 방향)과 r_O, Q₃의 r_π3이 있고 r_π3 양단 v_π3는 접지(베이스) 쪽이 +, v_x 쪽이 −라 v_π3 = −v_x예요. 출력 v_o와 v_x 사이에 Q₃의 g_m v_π3(v_o에서 v_x로)과 r_O가 있어요. 이상 전류원 부하는 개방이에요."><style>
