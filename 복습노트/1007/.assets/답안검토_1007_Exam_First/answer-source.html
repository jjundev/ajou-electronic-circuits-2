u003c/li>\u003cli>$M_1$은 게이트가 DC 바이어스라 소신호로는 $r_{O1}$만 남고, 그 위에 $R_E$가 직렬로 쌓인다\u003c/li>\u003c/ul>"}], "solution": {"steps": [{"label": "(1) 테일과 입력쌍의 전류·오버드라이브", "html": "\u003cdiv class=\"equation\">$$I_{SS}=I_{D1}=100\\,\\mu\\mathrm A=0.1\\,\\mathrm{mA}$$\u003c/div>\u003cdiv class=\"equation\">$$I_D=I_{D2}=I_{D3}=0.05\\,\\mathrm{mA}$$\u003c/div>\u003cdiv class=\"equation\">$$\\mu_nC_{ox}=0.1\\,\\mathrm{mA/V^2}$$\u003c/div>\u003cdiv class=\"equation\">$$V_{OV1}=\\sqrt{\\frac{2(0.1)}{(0.1)(50)}}=0.2\\,\\mathrm V$$\u003c/div>\u003cdiv class=\"equation\">$$V_{OV2}=V_{OV3}=\\sqrt{\\frac{2(0.05)}{(0.1)(25)}}=0.2\\,\\mathrm V$$\u003c/div>\u003cdiv class=\"equation\">$$g_m=\\frac{2(0.05\\,\\mathrm{mA})}{0.2\\,\\mathrm V}=0.5\\,\\mathrm{mS}$$\u003c/div>\u003cdiv class=\"equation\">$$r_o=r_{o2}=r_{o3}=200\\,\\mathrm{k\\Omega}$$\u003c/div>"}, {"label": "(1) 아래 소자와 위 입력쌍의 포화 경계", "html": "\u003cdiv class=\"equation\">$$V_{CM,min}=V_{OV1}+I_{SS}R_E+V_{TH}+V_{OV2}$$\u003c/div>\u003cdiv class=\"equation\">$$V_{CM,min}=0.2+(0.1\\,\\mathrm{mA})(10\\,\\mathrm{k\\Omega})+0.4+0.2=1.8\\,\\mathrm V$$\u003c/div>\u003cdiv class=\"equation\">$$V_D=3-(0.05\\,\\mathrm{mA})(10\\,\\mathrm{k\\Omega})=2.5\\,\\mathrm V$$\u003c/div>\u003cdiv class=\"equation\">$$V_{CM,max}=V_D+V_{TH}=2.9\\,\\mathrm V$$\u003c/div>"}, {"label": "(2) 한쪽 꺼짐 경계", "html": "\u003cdiv class=\"equation\">$$|v_{id}|_{cutoff}=\\sqrt{\\frac{2I_{SS}}{\\mu_nC_{ox}(W/L)_{2,3}}}$$\u003c/div>\u003cdiv class=\"equation\">$$|v_{id}|_{cutoff}=\\sqrt{\\frac{2(0.1)}{(0.1)(25)}}\\,\\mathrm V=\\sqrt{0.08}\\,\\mathrm V\\approx0.28\\,\\mathrm V$$\u003c/div>"}, {"label": "(3) DM 병렬 부하", "html": "\u003cdiv class=\"equation\">$$R_C\\parallel r_o=10\\parallel200\\,\\mathrm{k\\Omega}=\\frac{200}{21}\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{DM}=-g_m(R_C\\parallel r_o)=-\\frac{100}{21}\\approx-4.76$$\u003c/div>"}, {"label": "(4) 드레인 직렬 저항과 CM 반회로", "html": "\u003cdiv class=\"equation\">$$r_{o1}=\\frac1{(0.1)(0.1\\,\\mathrm{mA})}=100\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$R_{SS}=R_E+r_{o1}=110\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 760 350\" role=\"img\" aria-label=\"공통 모드 반회로: 입력은 왼쪽, 제어 전류원과 병렬 출력저항, 부하와 출력은 오른쪽, 소스 아래 두 배 꼬리 저항\">\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M55 140 H145 M145 123 V157 M270 75 H690 M270 75 V110 M270 170 V220 H420 M270 220 V250 M270 300 V320 M253 320 H287 M259 327 H281 M265 334 H275 M570 75 V110 M570 170 V190 M553 190 H587 M559 197 H581 M565 204 H575\"/>\u003cpolygon class=\"fig-ink\" fill=\"none\" points=\"270,110 290,140 270,170 250,140\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M270 122 V156 M262 146 L270 157 L278 146\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"560\" y=\"110\" width=\"20\" height=\"60\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"260\" y=\"250\" width=\"20\" height=\"50\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M420 75 V110 M420 170 V220\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"410\" y=\"110\" width=\"20\" height=\"60\"/>\u003ctext x=\"439\" y=\"145\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003ccircle cx=\"420\" cy=\"75\" r=\"4\" data-node=\"p8-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"420\" cy=\"220\" r=\"4\" data-node=\"p8-s\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ctext x=\"75\" y=\"116\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">CM\u003c/tspan>\u003c/text>\u003ccircle cx=\"55\" cy=\"140\" r=\"4\" data-node=\"p8-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"188\" y=\"197\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m\u003c/tspan>\u003c/text>\u003ctext x=\"228\" y=\"197\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"591\" y=\"145\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">C\u003c/tspan>\u003c/text>\u003ctext x=\"300\" y=\"283\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">2R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">SS\u003c/tspan>\u003c/text>\u003ccircle cx=\"270\" cy=\"220\" r=\"4\" data-node=\"p8-s\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ctext x=\"213\" y=\"240\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-s\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">P\u003c/tspan>\u003c/text>\u003ccircle cx=\"570\" cy=\"75\" r=\"4\" data-node=\"p8-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"690\" cy=\"75\" r=\"4\" data-node=\"p8-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"690\" y=\"52\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-o\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\" text-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003c/svg>\u003cfigcaption>두 입력에 같은 $v_{CM}$을 가해요. 전원과 고정 바이어스는 AC 접지이고 출력은 단락하지 않아요. $v_{gs}=v_{CM}-v_P$이며 입력 소자의 $r_o$도 드레인–소스 사이에 남겨요. 반쪽 소스 아래의 $2R_{SS}$는 공유 꼬리를 나눈 값이에요.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"equation\">$$A_{CM,SE}\\approx-\\frac{R_C}{2R_{SS}}$$\u003c/div>"}, {"label": "(4) 각 출력과 차동 출력을 구별", "html": "\u003cdiv class=\"equation\">$$2R_{SS}=220\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM,SE}\\approx-\\frac{10}{220}=-\\frac1{22}\\approx-4.55\\times10^{-2}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM,DM}=\\frac{v_{o1}-v_{o2}}{v_{CM}}=0$$\u003c/div>"}, {"label": "(5) 부하 불일치의 전체 연결", "html": "\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 900 540\" role=\"img\" aria-label=\"유한 출력저항과 서로 다른 부하를 가진 두 입력 가지. 두 소스는 P에 공통 접속하고 RSS를 거쳐 접지. 두 제어원은 각 ro 왼쪽, 출력은 맨 오른쪽\">\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 60 H810 M280 60 V100 M280 160 V195 H455 M455 60 V100 M455 160 V195 M655 60 V100 M655 160 V200 M638 200 H672 M644 207 H666 M650 214 H660 M280 195 H200\"/>\u003cpolygon class=\"fig-ink\" fill=\"none\" points=\"280,100 300,130 280,160 260,130\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 112 V146 M272 136 L280 147 L288 136\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"445\" y=\"100\" width=\"20\" height=\"60\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"645\" y=\"100\" width=\"20\" height=\"60\"/>\u003ctext x=\"302\" y=\"160\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m\u003c/tspan>\u003c/text>\u003ctext x=\"335\" y=\"160\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"477\" y=\"138\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003ctext x=\"677\" y=\"138\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">C\u003c/tspan>\u003c/text>\u003ccircle cx=\"455\" cy=\"60\" r=\"4\" data-node=\"p8-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"655\" cy=\"60\" r=\"4\" data-node=\"p8-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"810\" cy=\"60\" r=\"4\" data-node=\"p8-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"810\" y=\"38\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-o1\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\" text-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o1\u003c/tspan>\u003c/text>\u003ccircle cx=\"280\" cy=\"195\" r=\"4\" data-node=\"p8-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ccircle cx=\"455\" cy=\"195\" r=\"4\" data-node=\"p8-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 285 H810 M280 285 V325 M280 385 V420 H455 M455 285 V325 M455 385 V420 M655 285 V325 M655 385 V425 M638 425 H672 M644 432 H666 M650 439 H660 M280 420 H200\"/>\u003cpolygon class=\"fig-ink\" fill=\"none\" points=\"280,325 300,355 280,385 260,355\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M280 337 V371 M272 361 L280 372 L288 361\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"445\" y=\"325\" width=\"20\" height=\"60\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"645\" y=\"325\" width=\"20\" height=\"60\"/>\u003ctext x=\"302\" y=\"385\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m\u003c/tspan>\u003c/text>\u003ctext x=\"335\" y=\"385\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"477\" y=\"363\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\u003ctext x=\"677\" y=\"363\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">C\u003c/tspan>\u003c/text>\u003ctext x=\"716\" y=\"363\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">+ ΔR\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">C\u003c/tspan>\u003c/text>\u003ccircle cx=\"455\" cy=\"285\" r=\"4\" data-node=\"p8-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"655\" cy=\"285\" r=\"4\" data-node=\"p8-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ccircle cx=\"810\" cy=\"285\" r=\"4\" data-node=\"p8-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"810\" y=\"263\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-o2\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\" text-anchor=\"end\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o2\u003c/tspan>\u003c/text>\u003ccircle cx=\"280\" cy=\"420\" r=\"4\" data-node=\"p8-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ccircle cx=\"455\" cy=\"420\" r=\"4\" data-node=\"p8-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M200 195 V450 M200 490 V510 M183 510 H217 M189 517 H211 M195 524 H205\"/>\u003crect class=\"fig-ink\" fill=\"none\" x=\"190\" y=\"450\" width=\"20\" height=\"40\"/>\u003ctext x=\"55\" y=\"110\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">CM\u003c/tspan>\u003c/text>\u003ccircle cx=\"55\" cy=\"130\" r=\"4\" data-node=\"p8-g\" data-node-color=\"blue\" fill=\"#2563eb\" stroke=\"none\"/>\u003ctext x=\"55\" y=\"163\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext x=\"55\" y=\"190\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">= v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">CM\u003c/tspan>\u003c/text>\u003ctext x=\"55\" y=\"217\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">− v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">P\u003c/tspan>\u003c/text>\u003ccircle cx=\"200\" cy=\"420\" r=\"4\" data-node=\"p8-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\"/>\u003ctext x=\"137\" y=\"407\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\" data-node=\"p8-p\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">P\u003c/tspan>\u003c/text>\u003ctext x=\"225\" y=\"480\" class=\"fig-text fig-math\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">SS\u003c/tspan>\u003c/text>\u003c/svg>\u003cfigcaption>불일치가 있을 때 유지하는 전체 소신호 연결이에요. 두 제어 전압은 모두 $v_{CM}-v_P$이지만 드레인 전압은 달라 $r_o$ 전류와 순 드레인 전류가 서로 다를 수 있어요. 두 가지가 공유하는 것은 실제 $R_{SS}$이고, 이 그림에 $2R_{SS}$를 두 번 넣지 않아요. 출력 전압은 두 오른쪽 노드에서 읽어요.\u003c/figcaption>\u003c/figure>"}, {"label": "(5) 유한 입력 출력저항을 남긴 누출 주항", "html": "\u003cdiv class=\"equation\">$$\\Delta R_C=10\\,\\Omega=0.01\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac{0.01}{(220)(1+10/200)}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac1{23100}\\approx+4.33\\times10^{-5}$$\u003c/div>"}, {"label": "(6) 동일 모델의 신호 대 누출 비", "html": "\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{g_mR_C/(1+R_C/r_o)}{|\\Delta R_C|/[2R_{SS}(1+R_C/r_o)]}$$\u003c/div>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{2g_mR_{SS}R_C}{|\\Delta R_C|}$$\u003c/div>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{(0.5)(220)(10)}{0.01}=110000$$\u003c/div>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}_{dB}\\approx20\\log_{10}(110000)\\approx100.83\\,\\mathrm{dB}$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>대칭 DC 기준 $1.8\\,\\mathrm V\\le V_{CM}\\le2.9\\,\\mathrm V$예요. 제곱법칙·테일 전류 유지·포화 경계 조건이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>$-\\sqrt{0.08}\\,\\mathrm V\\le v_{id}\\le+\\sqrt{0.08}\\,\\mathrm V$, 즉 약 $\\pm0.28$ V예요. 테일 전류 고정·동작영역 유지에서 한쪽 꺼짐 경계예요.\u003c/p>\u003cp>\u003cstrong>(3)\u003c/strong>\u003c/p>\u003cp>$A_{DM}\\approx-4.76$예요. 대칭 DM이며 $r_{o2}=r_{o3}=200$ kΩ를 병렬 부하로 유지해요.\u003c/p>\u003cp>\u003cstrong>(4)\u003c/strong>\u003c/p>\u003cp>그림의 차동 출력은 $A_{CM,DM}=0$, 각 출력은 $A_{CM,SE}\\approx-4.55\\times10^{-2}$예요. 대칭·큰 곱 주항 조건이에요.\u003c/p>\u003cp>\u003cstrong>(5)\u003c/strong>\u003c/p>\u003cp>$A_{CM-DM}\\approx+4.33\\times10^{-5}$예요. 좌−우 출력·유한 입력 $r_o$·작은 불일치·큰 곱 주항이에요.\u003c/p>\u003cp>\u003cstrong>(6)\u003c/strong>\u003c/p>\u003cp>동일 유한 입력 $r_o$ 모델의 큰 곱·작은 불일치 주항에서 CMRR $\\approx110000$, 약 $100.83$ dB예요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "fadc2968551958dbcaa48799c4fa907e75a11d9b40485e3ecfa064c54c6c680a", "depends_on": [], "estimated_minutes": 30, "id": "2017-1_중간_C030-Q2", "kind": "기출", "learning_goals": ["CM 입력 범위", "테일 구조 비교"], "priority": "extra", "reference_solution": "solution", "subpart_count": 6, "subparts": [{"ask_md": "$V_{in1,2}$ 공통 모드 입력의 입력 범위", "label": "1", "required_concepts": ["DC 바이어스와 동작 영역", "차동 증폭기", "공통 모드·차동 입력 범위"]}, {"ask_md": "차동 입력 $V_{in1} - V_{in2}$의 입력 범위", "label": "2", "required_concepts": ["DC 바이어스와 동작 영역", "차동 증폭기", "공통 모드·차동 입력 범위"]}, {"ask_md": "$\\Delta R_C = 0$일 때 소신호 차동 이득 $A_{DM} = V_{out}/(V_{in1} - V_{in2})$", "label": "3", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "소신호 전압 이득"]}, {"ask_md": "$\\Delta R_C = 0$일 때 공통 모드 이득 $A_{CM}$", "label": "4", "required_concepts": ["차동 증폭기", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "소스·이미터 축퇴", "공통 모드 해석", "소신호 전압 이득"]}, {"ask_md": "$\\Delta R_C = 10\\ \\Omega$일 때 공통 모드 입력에서 차동 출력으로의 이득 $A_{CM-DM}$", "label": "5", "required_concepts": ["차동 증폭기", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "소스·이미터 축퇴", "공통 모드 해석", "소자·부하 불일치와 CM-DM 변환", "소신호 전압 이득"]}, {"ask_md": "CMRR", "label": "6", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "소신호 파라미터(gm)", "유한 출력 저항(ro)", "소스·이미터 축퇴", "공통 모드 해석", "소자·부하 불일치와 CM-DM 변환", "소신호 전압 이득", "CMRR"]}], "why": "소스 축퇴와 달리 테일 위 직렬 저항은 R_E+r_o임을 구별하는 기출"}, "review_workload_label": "추가 연습 · 소문항 6묶음 · 예상 30분(추정)", "source_title": "R_E 축퇴 테일과 부하 저항 불일치 ΔR_C가 있는 MOS 차동 증폭기의 입력 범위, A_DM, A_CM, A_CM-DM, CMRR"}, {"id": "2019-1_중간-Q4", "kind": "기출", "number": "4", "title": "P9. 캐스코드 부하의 DM·CM 이득", "section": "2019-1 중간고사 · 20점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 회로에 대해 주어진 조건을 이용하여 질문에 답하시오.\u003c/p>\u003cp>: $V_{DD} = 1.8\\ \\text{V}$, $I_{D7} = 2\\ \\text{mA}$, $(W/L)_{1,2} = 100/0.2$, $(W/L)_{3,4} = (W/L)_{5,6} = 200/0.2$, $(W/L)_7 = 200/0.2$, $\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$, $\\lambda_n = \\lambda_p = 0.1\\ \\text{V}^{-1}$, $g_m r_o \\gg 1$로 가정한다.\u003c/p>\u003cp>(1) 차동 전압 이득을 구하시오.\u003c/p>\u003cp>(2) Common-mode 이득($A_{CM}$)을 구하시오.\u003c/p>", "conditions": "\u003cul>\u003cli>$V_{DD} = 1.8\\ \\text{V}$, $I_{D7} = 2\\ \\text{mA}$\u003c/li>\u003cli>$(W/L)_{1,2} = 100/0.2$, $(W/L)_{3,4} = (W/L)_{5,6} = 200/0.2$, $(W/L)_7 = 200/0.2$\u003c/li>\u003cli>$\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$\u003c/li>\u003cli>$\\lambda_n = \\lambda_p = 0.1\\ \\text{V}^{-1}$\u003c/li>\u003cli>$g_m r_o \\gg 1$로 가정\u003c/li>\u003cli>바이어스 전압 $V_{b athrm{k\\Omega}\\approx9.9\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{DM}\\approx-g_{m1}(r_{o1}\\parallel R_{up})=-\\frac{10000}{101}\\approx-99.01$$\u003c/div>\u003cp>왼쪽 입력이 올라가면 왼쪽 출력은 내려가므로 왼쪽−오른쪽 차동 이득은 음수예요.\u003c/p>"}, {"label": "(2) 입력 출력저항을 남긴 CM 반회로", "html": "\u003cfigure class=\"figure\">\u003csvg id=\"p9-fig-p9-cm\" viewBox=\"0 0 500 355\" role=\"img\" aria-label=\"왼쪽 입력 전압과 가운데 제어원, 그 오른쪽 드레인 소스 출력저항, 가장 오른쪽 출력과 부하. 소스 아래 축퇴 저항.\">\n \u003cpath class=\"fig-ink\" d=\"M60 130H120 M60 130V185 M60 225V300 M220 65H460 M220 65V102 M220 150V215H330 M220 215V250 M220 290V320 M410 65V110 M410 155V300\"/>\n \u003ccircle class=\"fig-ink\" cx=\"60\" cy=\"205\" r=\"20\"/>\u003cpath class=\"fig-ink\" d=\"M53 197h14 m-7-7v14 m-7 12h14\"/>\n \u003cpolygon class=\"fig-ink\" points=\"220,102 238,126 220,150 202,126\"/>\u003cpath class=\"fig-ink\" d=\"M220 112v27 m-6-7 6 7 6-7\"/>\n \u003cpath class=\"fig-ink\" d=\"M330 65V108 M330 153V215\"/>\u003crect class=\"fig-ink\" x=\"322\" y=\"108\" width=\"16\" height=\"45\"/>\n \u003crect class=\"fig-ink\" x=\"212\" y=\"250\" width=\"16\" height=\"40\"/>\u003crect class=\"fig-ink\" x=\"402\" y=\"110\" width=\"16\" height=\"45\"/>\n \u003cpath class=\"fig-ink\" d=\"M60 300v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M220 320v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M410 300v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\n \u003ccircle class=\"fig-dot\" cx=\"60\" cy=\"130\" r=\"4\" data-node=\"in\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"220\" cy=\"215\" r=\"4\" data-node=\"source\" data-node-color=\"red\"/>\u003ccircle class=\"fig-dot\" cx=\"330\" cy=\"65\" r=\"4\" data-node=\"out\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"410\" cy=\"65\" r=\"4\" data-node=\"out\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"460\" cy=\"65\" r=\"4\" data-node=\"out\" data-node-color=\"blue\"/>\n \u003ctext class=\"fig-text fig-math\" x=\"38\" y=\"108\" data-node-color=\"blue\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">i\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"232\" y=\"233\" data-node-color=\"red\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">s\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"428\" y=\"40\" data-node-color=\"blue\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\n \u003ctext class=\"fig-text fig-math\" x=\"243\" y=\"128\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m1\u003c/tspan>v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"344\" y=\"135\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o1\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"236\" y=\"279\">2r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o7\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"426\" y=\"138\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">up\u003c/tspan>\u003c/text>\n \u003c/svg>\u003cfigcaption>전원과 고정 바이어스는 AC 접지예요. 제어 전압은 $v_{gs}=v_i-v_s$예요. 제어원은 왼쪽, 드레인–소스 $r_o$는 오른쪽, 출력은 맨 오른쪽이에요. 입력 게이트에는 전류가 흐르지 않아요.\u003c/figcaption>\u003c/figure>\u003cp>$g_{m1}R_S=100\\gg1$인 축퇴 CS 블록을 써요. 입력 영점에서 축퇴된 아래쪽 저항은 기존 $r_{o1}$에 $g_{m1}R_S$를 곱한 주항이에요.\u003c/p>\u003cdiv class=\"equation\">$$R_{dn}\\approx g_{m1}r_{o1}(2r_{o7})=1000\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$G_{m,CM}\\approx\\frac1{2r_{o7}}=0.1\\,\\mathrm{mS}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{R_{up}\\parallel R_{dn}}{2r_{o7}}=-\\frac{500}{10}=-50$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_{DM}\\approx-99.01$\u003c/b>, 왼쪽−오른쪽 차동 출력·포화·$g_mr_o\\gg1$ 주항이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_{CM}\\approx-50$\u003c/b>는 한쪽 출력이에요. 같은 두 출력의 차에서 CM 전달은0이에요.\u003c/p>", "paginat  (+)\u003c/text>\n\u003cpath class=\"fig-ink\" d=\"M300 65 H470 M300 65 V108 M300 148 V195 H400 M400 65 V95 l7 4 -14 8 14 8 -14 8 14 8 -7 4 V195 M350 195 V208 M340 208 H360 M344 213 H356 M348 218 H352\" fill=\"none\"/>\n\u003cpolygon class=\"fig-ink\" points=\"300,108 316,128 300,148 284,128\" fill=\"none\"/>\n\u003cpath class=\"fig-ink\" d=\"M300 139 V117 M295 123 L300 117 305 123\" fill=\"none\"/>\n\u003ctext class=\"fig-text fig-math\" x=\"270\" y=\"165\" text-anchor=\"end\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">−\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">m4\u003c/tspan>\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">g\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"413\" y=\"122\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">R\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">L\u003c/tspan>\u003c/text>\n\u003ccircle class=\"fig-dot\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"#dc2626\" cx=\"300\" cy=\"65\" r=\"3.5\"/>\n\u003ccircle class=\"fig-dot\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"#dc2626\" cx=\"400\" cy=\"65\" r=\"3.5\"/>\n\u003ccircle class=\"fig-dot\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"#dc2626\" cx=\"470\" cy=\"65\" r=\"3.5\"/>\n\u003ctext class=\"fig-text fig-math\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\" x=\"404\" y=\"49\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">\u003ctspan font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">v\u003c/tspan>\u003ctspan baseline-shift=\"sub\" font-size=\"78%\" font-family=\"Pretendard\" font-weight=\"600\" font-style=\"normal\">out\u003c/tspan> (+)\u003c/text>\n\u003ccircle cx=\"118\" cy=\"195\" r=\"3\" fill=\"currentColor\" data-ground-branch=\"true\"/>\u003ccircle cx=\"350\" cy=\"195\" r=\"3\" fill=\"currentColor\" data-ground-branch=\"true\"/>\u003c/svg>\u003cfigcaption>$V_{DD}$는 AC 접지예요. $M_3$는 다이오드 등가저항, $M_4$는 $v_g$로 제어되는 공급 전류원으로 바꿨어요. $\\lambda=0$이므로 $r_{o3},r_{o4}$ 가지는 없고, 실제 부하 $R_L$은 남겨요. 두 신호 노드는 게이트의 제어 관계로 연결되며 도선으로 단락되지 않아요.\u003c/figcaption>\u003c/figure>\n\u003cp>$v_g$ 노드에서 아래로 나가는 전류는 전류원의 $i_1$과 저항의 $g_{m3}v_g$예요. 두 전류를 더해 0으로 놓아요.\u003c/p>\n\u003cdiv class=\"equation\">$$i_1+g_{m3}v_g=0$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_g=-\\frac{i_1}{g_{m3}}$$\u003c/div>\n"}, {"label": "같은 과구동 전압에서 전류비와 gm비", "html": "\n\u003cdiv class=\"equation\">$$\\frac{I_{D4}}{I_{D3}}=\\frac{(W/L)_4}{(W/L)_3}=\\frac1N$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{g_{m4}}{g_{m3}}=\\frac{2I_{D4}/V_{OV}}{2I_{D3}/V_{OV}}=\\frac1N$$\u003c/div>\n"}, {"label": "복사 공급 전류와 실제 부하의 출력 KCL", "html": "\n\u003cp>$M_4$가 출력으로 공급하는 소신호 전류를 $i_4$라 두면 다음과 같아요.\u003c/p>\n\u003cdiv class=\"equation\">$$i_4=g_{m4}v_{sg4}=-g_{m4}v_g=\\frac{g_{m4}}{g_{m3}}i_1=\\frac{i_1}{N}$$\u003c/div>\n\u003cp>출력 노드에서 $R_L$로 나가는 전류와 위로부터 들어오는 $i_4$가 같아요. 출력은 단락하지 않고 $R_L$에 걸린 전압을 구해요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\frac{v_{out}}{R_L}-i_4=0$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{out}=\\frac{R_L}{N}i_1$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>아래 방향 입력 전류 $i_1$에 대한 트랜스임피던스는 양수예요.\u003c/strong>\u003c/p>\u003cdiv class=\"equation\">$$\\boxed{\\frac{v_{out}}{i_1}=+\\frac{R_L}{N}\\quad[\\Omega]}$$\u003c/div>\u003cp>두 PMOS의 포화 동작·작은 신호·채널 길이 변조 무시와 실제 부하 $R_L$ 조건에서의 결과예요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": null, "content_sha256": "13cf0683b8816f1e4cbf344f9088ea80cf7606629089b0d61185bf5ae71c1202", "depends_on": [], "estimated_minutes": 8, "id": "P10.71", "kind": "장말문제", "learning_goals": ["거울 비율"], "priority": "extra", "reference_solution": "solution", "subpart_count": 1, "subparts": [{"ask_md": "- 소신호 이득 $v_{out}/i_1$", "label": "main"}], "why": "기출의 1:1 거울에서 생략되는 비대칭 면적비의 전류 전달을 보완"}, "review_workload_label": "추가 연습 · 소문항 1묶음 · 예상 8분(추정)", "source_title": "PMOS 전류 거울(Fig 10.92)의 소신호 이득 v_out/i_1, (W/L)_3 = N(W/L)_4"}, {"id": "P10.72", "kind": "장말문제", "number": "10.72", "title": "P11. 전류 거울의 출력 변화", "section": "10.6 Differential Pair with Active Load", "book_page": 566, "difficulty": 0, "sol": false, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>In the circuit shown in Fig. 10.93, $I_1$ changes from $I_0$ to $I_0 + \\Delta I$ and $I_2$ from $I_0$ to $I_0 - \\Delta I$. Neglecting channel-length modulation, calculate $V_{out}$ before and after the change if\u003c/p>\u003cp>(a) $(W/L)_3 = (W/L)_4$.\u003c/p>\u003cp>(b) $(W/L)_3 = 2(W/L)_4$.\u003c/p>", "conditions": "\u003cul>\u003cli>$I_1$은 $I_0$에서 $I_0 + \\Delta I$로, $I_2$는 $I_0$에서 $I_0 - \\Delta I$로 바뀜\u003c/li>\u003cli>채널 길이 변조 무시\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>변화 전과 후의 $V_{out}$을 다음 각 경우에 계산\u003c/li>\u003cli>(a) $(W/L)_3 = (W/L)_4$\u003c/li>\u003cli>(b) $(W/L)_3 = 2(W/L)_4$\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPgAAACcCAIAAADd1vEQAAAACXBIWXMAABYlAAAWJQFJUiTwAAA62UlEQVR4nO19h18UyfP2++f8ZPOSs5gwnzmTEVDUr3pnIJjTGc9Dsvn0vKCIouKd4fTOLGI+c84SDAhI2pn3memd3p7ZBRFYdtnb+vRnGSZ2eLq6qrq6+v/xburKZDKZmjtjffBfpv/n6Ay4qWOI4yy/hNz4ZskN9C5MBMmNjcKfpiaOnuEllHMc19TUxLtB7wZ6l6ZLJVejo+Lj45Lu3X1EzgDudXUNSUmTY2JiiouL2Zs5ltv/98heQOdEov+6OUpryLqWWkbnzRt3tBqjRm345++znPTotm0/GQyeAQFBVVVVzT1IXktfrvguGQRcjOwCdFqDnESKf91kk2gtAWpcKxhw2dt3ep2XWqU/UHRYADrHV3+q6969h0aj++WX36xbhIoxLLI5W/zI9RiTHYFOK0vxr5u+ilpCPMd7efqBqf+0fReOkbZu2QGUDxgw \\mathrm{후}}=R_L[(I_0+\\Delta I)-(I_0-\\Delta I)]=2\\Delta I R_L$$\u003c/div>\n"}, {"label": "(b) 절반 거울의 전후 출력 계산", "html": "\n\u003cp>$\\lambda=0$, $M_4$ 포화에서 $k=1/2$, $I_4=I_1/2$이고 $V_{out}=R_L(I_4-I_2)$예요.\u003c/p>\n\u003cdiv class=\"equation\">$$V_{out,\\mathrm{전}}=R_L\\left(\\frac{I_0}{2}-I_0\\right)=-\\frac{I_0R_L}{2}$$\u003c/div>\n\u003cdiv class=\"equation\">$$V_{out,\\mathrm{후}}=R_L\\left[\\frac{I_0+\\Delta I}{2}-(I_0-\\Delta I)\\right]=\\frac{(3\\Delta I-I_0)R_L}{2}$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta V_{out}=V_{out,\\mathrm{후}}-V_{out,\\mathrm{전}}=\\frac32\\Delta I R_L$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>(a)\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>전에는 $V_{out}=0$, 후에는 $V_{out}=2\\Delta I R_L$예요.\u003c/strong> 채널 길이 변조 무시, $M_4$ 포화 및 이상 전류원의 동작 가능 범위에서의 결과예요.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>전에는 $V_{out}=-I_0R_L/2$, 후에는 $V_{out}=(3\\Delta I-I_0)R_L/2$예요.\u003c/strong> 변화량은 $\\Delta V_{out}=1.5\\Delta I R_L$예요. 채널 길이 변조 무시, $M_4$ 포화 및 음의 출력을 포함한 전류원 동작 가능 범위를 전제로 해요.\u003c/p>\n", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": null, "content_sha256": "205cfd2870edd5af656eed05aa6859bec3ff52f0ae79e1491dc6a61acb81d7ea", "depends_on": [], "estimated_minutes": 12, "id": "P10.72", "kind": "장말문제", "learning_goals": ["능동 부하 전류 합성", "거울 비율"], "priority": "core", "reference_solution": "solution", "subpart_count": 2, "subparts": [{"ask_md": "$(W/L)_3 = (W/L)_4$", "label": "a"}, {"ask_md": "$(W/L)_3 = 2(W/L)_4$", "label": "b"}], "why": "두 반대 전류 변화가 합쳐지는 KCL과 DC 오프셋을 분리하는 기초 보완"}, "review_workload_label": "핵심 · 소문항 2묶음 · 예상 12분(추정)", "source_title": "PMOS 전류 거울(Fig 10.93)에서 I_1, I_2가 반대로 ΔI 변할 때 V_out 변화"}, {"id": "2013-1_중간-Q4", "kind": "기출", "number": "4", "title": "P12. MOS 차동쌍의 부하별 이득", "section": "2013-1 중간고사 · 20점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 차동증폭단에 대해 다음 조건을 이용하여 질문에 답하시오.\u003c/p>\u003cp>$I_{SS} = 2\\ \\text{mA}$, $(W/L)_{1,2} = 500$, $(W/L)_{3,4} = 1000$, $R_{DD} = 1\\ \\text{k}\\Omega$, $R_{SS} = 200\\ \\Omega$,\u003c/p>\u003cp>$\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$, $\\lambda_n = 0.1\\ \\text{V}^{-1}$, $\\lambda_p = 0.1\\ \\text{V}^{-1}$\u003c/p>\u003cp>(1) 그림(a) 회로의 차동 전압이득($v_{out}/(v_{in1} - v_{in2})$) 식을 구하시오.\u003c/p>\u003cp>(2) 주어진 조건을 이용하여 그림(a) 회로의 차동 전압이득 값을 구하시오.\u003c/p>\u003cp>(3) 주어진 조건을 이용하여 그림(b) 회로의 차동 전압이득 값을 구하시오.\u003c/p>\u003cp>(4) 주어진 조건을 이용하여 그림(c) 회로의 차동 전압이득 값을 구하시오. ($I_{DS1} = I_{DS2} = 1\\ \\text{mA}$)\u003c/p>", "conditions": "\u003cul>\u003cli>$I_{SS} = 2\\ \\text{mA}$\u003c/li>\u003cli>$(W/L)_{1,2} = 500$, $(W/L)_{3,4} = 1000$\u003c/li>\u003cli>$R_{DD} = 1\\ \\text{k}\\Omega$, $R_{SS} = 200\\ \\Omega$\u003c/li>\u003cli>$\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$\u003c/li>\u003cli>$\\lambda_n = 0.1\\ \\text{V}^{-1}$, $\\lambda_p = 0.1\\ \\text{V}^{-1}$\u003c/li>\u003cli>(4) 전용 (회로 (c)): $I_{DS1} = I_{DS2} = 1\\ \\text{mA}$\u003c/li>\u003cli>$V_{DD}$ 값과 (c)의 네 전류원 값은 주어지지 않음\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>(1) 그림 (a) 회로의 차동 전압 이득 $v_{out}/(v_{in1} - v_{in2})$의 식\u003c/li>\u003cli>(2) 주어진 조건으로 그림 (a) 회로의 차동 전압 이득 값\u003c/li>\u003cli>(3) 주어진 조건으로 그림 (b) 회로의 차동 전압 이득 값\u003c/li>\u003cli>(4) 주어진 조건으로 그림 (c) 회로의 차동 전압 이득 값\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAEAkAAAQmCAYAAABM0lErAAAACXBIWXMAAEJwAABCcAFu8l9tAAEAAElEQVR4nOz9B5hVxeE//g+w9CICKmCjgzQXBcsHJcYQK8au0dhiQ01ijVLsDQsq9hq7MSaaGLuxRlHUAKIiIEUBC0UUpC0d/s85v798We65y727d/vr9Tz3ce/MuWeGS3LOMmfmPTXWrVu3LgAAAAAAAAAAAAAAAAAAAAAVXs3y7gAAAAAAAAAAAAAAAAAAAACQGSEBAAAAAAAAAAAAAAAAAAAAUEkICQAAAAAAAAAAAAAAAAAAAIBKQkgAAAAAAAAAAAAAAAAAAAAAVBJCAgAAAAAAAAAAAAAAAAAAAKCSEBIAAAAAAAAAAAAAAAAAAAAAlYSQAAAAAAAAAAAAAAAAAAAAAKgk8sq7AwAAAJSdDz74IKxZsyaxrlatWmH33XfPaXtLliwJn3zySdr6Fi1ahC5duuS0TQAAAA 는다\u003c/li>\u003cli>그래서 저항을 반으로 잘라 한쪽만 남긴 반회로로 볼 수 있다\u003c/li>\u003c/ul>"}], "solution": {"steps": [{"label": "(1) 거울 신호 합성과 오른쪽 출력", "html": "\u003cdiv class=\"equation\">$$i_{sig}\\approx g_{m1}(v_{in1}-v_{in2})$$\u003c/div>\u003cdiv class=\"equation\">$$R_{out,a}\\approx r_{o2}\\parallel r_{o4}$$\u003c/div>\u003cdiv class=\"equation\">$$A_a\\approx+g_{m1}(r_{o2}\\parallel r_{o4})$$\u003c/div>\u003cp>1:1 거울·같은 입력쌍·$g_mr_o\\gg1$ 주도항이에요. 입력이 왼쪽−오른쪽이고 오른쪽 출력이므로 양수예요. 원본 모범답안 손글씨의 음의 부호는 이 정의에 맞춰 정정했어요.\u003c/p>"}, {"label": "(2) 소신호 값 대입", "html": "\u003cdiv class=\"equation\">$$R_{out,a}\\approx10\\parallel10\\,\\mathrm{k\\Omega}=5\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_a\\approx(10\\,\\mathrm{mS})(5\\,\\mathrm{k\\Omega})=50$$\u003c/div>"}, {"label": "(3) 다이오드 부하의 병렬", "html": "\u003cdiv class=\"equation\">$$R_{L,b}=\\frac1{g_{m3}}\\parallel r_{o3}\\parallel r_{o1}=0.1\\parallel10\\parallel10\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_b=-\\frac{g_{m1}}{g_{m3}+1/r_{o3}+1/r_{o1}}=-\\frac{10}{10+0.1+0.1}\\approx-0.98$$\u003c/div>"}, {"label": "(4) DM 반회로와 수치 예외", "html": "\u003cfigure class=\"figure\">\u003csvg id=\"p12-fig-p12-c\" viewBox=\"0 0 500 355\" role=\"img\" aria-label=\"왼쪽 입력 전압과 가운데 제어원, 그 오른쪽 드레인 소스 출력저항, 가장 오른쪽 출력과 부하. 소스 아래 축퇴 저항.\">\n \u003cpath class=\"fig-ink\" d=\"M60 130H120 M60 130V185 M60 225V300 M220 65H460 M220 65V102 M220 150V215H330 M220 215V250 M220 290V320 M410 65V110 M410 155V300\"/>\n \u003ccircle class=\"fig-ink\" cx=\"60\" cy=\"205\" r=\"20\"/>\u003cpath class=\"fig-ink\" d=\"M53 197h14 m-7-7v14 m-7 12h14\"/>\n \u003cpolygon class=\"fig-ink\" points=\"220,102 238,126 220,150 202,126\"/>\u003cpath class=\"fig-ink\" d=\"M220 112v27 m-6-7 6 7 6-7\"/>\n \u003cpath class=\"fig-ink\" d=\"M330 65V108 M330 153V215\"/>\u003crect class=\"fig-ink\" x=\"322\" y=\"108\" width=\"16\" height=\"45\"/>\n \u003crect class=\"fig-ink\" x=\"212\" y=\"250\" width=\"16\" height=\"40\"/>\u003crect class=\"fig-ink\" x=\"402\" y=\"110\" width=\"16\" height=\"45\"/>\n \u003cpath class=\"fig-ink\" d=\"M60 300v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M220 320v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M410 300v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\n \u003ccircle class=\"fig-dot\" cx=\"60\" cy=\"130\" r=\"4\" data-node=\"in\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"220\" cy=\"215\" r=\"4\" data-node=\"source\" data-node-color=\"red\"/>\u003ccircle class=\"fig-dot\" cx=\"330\" cy=\"65\" r=\"4\" data-node=\"out\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"410\" cy=\"65\" r=\"4\" data-node=\"out\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"460\" cy=\"65\" r=\"4\" data-node=\"out\" data-node-color=\"blue\"/>\n \u003ctext class=\"fig-text fig-math\" x=\"38\" y=\"108\" data-node-color=\"blue\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">i\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"232\" y=\"233\" data-node-color=\"red\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">s\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"428\" y=\"40\" data-node-color=\"blue\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o\u003c/tspan>\u003c/text>\n \u003ctext class=\"fig-text fig-math\" x=\"243\" y=\"128\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m1\u003c/tspan>v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">gs\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"344\" y=\"135\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o1\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"236\" y=\"279\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">S\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"426\" y=\"138\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">D\u003c/tspan>\u003c/text>\n \u003c/svg>\u003cfigcaption>전원과 고정 바이어스는 AC 접지예요. 제어 전압은 $v_{gs}=v_i-v_s$예요. 제어원은 왼쪽, 드레인–소스 $r_o$는 오른쪽, 출력은 맨 오른쪽이에요. 입력 게이트에는 전류가 흐르지 않아요.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"equation\">$$R_D=R_{DD}/2=0.5\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$R_S=R_{SS}/2=0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$g_mR_S=(10\\,\\mathrm{mS})(0.1\\,\\mathrm{k\\Omega})=1$$\u003c/div>\u003cp>이 수치는 강한 축퇴가 아니므로 gain 분모의1을 유지해요. $r_o$도 드레인–소스 연결 그대로 남겨요.\u003c/p>"}, {"label": "(4) 전압이득 KCL과 대입", "html": "\u003cdiv class=\"equation\">$$\\frac{v_o}{R_D}+\\frac{v_o-v_s}{r_o}+g_m(v_i-v_s)=0$$\u003c/div>\u003cdiv class=\"equation\">$$v_s=-\\frac{R_S}{R_D}v_o$$\u003c/div>\u003cdiv class=\"equation\">$$A_c=\\frac{v_o}{v_i}=-\\frac{g_mR_Dr_o}{r_o+R_D+R_S+g_mr_oR_S}$$\u003c/div>\u003cdiv class=\"equation\">$$A_c=-\\frac{(10)(0.5)(10)}{10+0.5+0.1+(10)(10)(0.1)}=-\\frac{50}{20.6}\\approx-2.43$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_a\\approx+g_{m1}(r_{o2}\\parallel r_{o4})$\u003c/b>. 1:1 거울·같은 입력쌍·포화·큰 $g_mr_o$ 주항이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_a\\approx+50$\u003c/b>. 같은 주도항 모델이에요.\u003c/p>\u003cp>\u003cstrong>(3)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_b\\approx-0.98$\u003c/b>, $r_o$를 남긴 모델이에요. 큰 $g_mr_o$ 선도항은 $-1$이에요.\u003c/p>\u003cp>\u003cstrong>(4)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_c\\approx-2.43$\u003c/b>. 주어진 $g_mR_S=1$ 때문에1을 유지하고 유한 $r_o$를 남긴 전압이득 모델이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "e372fbfdae52f26814c0937958834d8cc9f5f8cd4e51548295570304a5357d39", "depends_on": [], "estimated_minutes": 25, "id": "2013-1_중간-Q4", "kind": "기출", "learning_goals": ["능동 부하 전류 합성", "부하 구조 비교"], "priority": "core", "reference_solution": "solution", "subpart_count": 4, "subparts": [{"ask_md": "그림 (a) 회로의 차동 전압 이득 $v_{out}/(v_{in1} - v_{in2})$의 식", "label": "1", "required_concepts": ["차동 증폭기", "전류 거울", "능동 부하의 g id=\"p13-fig-p13-load\" viewBox=\"0 0 520 310\" role=\"img\" aria-label=\"컬렉터 시험전압은 맨 오른쪽, 자기 베이스와 컬렉터 사이 저항 R1, 베이스에서 접지까지 r파이3. 제어전류원은 왼쪽, 출력저항은 오른쪽. PNP 이미터는 AC 접지.\">\n\u003cpath class=\"fig-ink\" d=\"M80 90H120 M200 90H470 M80 90V140 M80 195V255 M250 90V130 M250 178V255 M360 90V140 M360 195V255 M470 90V150 M470 190V255\"/>\n\u003crect class=\"fig-ink\" x=\"120\" y=\"82\" width=\"80\" height=\"16\"/>\u003crect class=\"fig-ink\" x=\"72\" y=\"140\" width=\"16\" height=\"55\"/>\u003crect class=\"fig-ink\" x=\"352\" y=\"140\" width=\"16\" height=\"55\"/>\n\u003cpolygon class=\"fig-ink\" points=\"250,130 268,154 250,178 232,154\"/>\u003cpath class=\"fig-ink\" d=\"M250 139v29 m-6-7 6 7 6-7 M432 62H397 l8-6 m-8 6 8 6\"/>\n\u003ccircle class=\"fig-ink\" cx=\"470\" cy=\"170\" r=\"20\"/>\u003cpath class=\"fig-ink\" d=\"M463 163h14 m-7-7v14 m-7 9h14\"/>\n\u003cpath class=\"fig-ink\" d=\"M80 255v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M250 255v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M360 255v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003cpath class=\"fig-ink\" d=\"M470 255v10 m-12 0h24 m-19 6h14 m-10 6h6\"/>\u003ccircle class=\"fig-dot\" cx=\"80\" cy=\"90\" r=\"4\" data-node=\"base\" data-node-color=\"red\"/>\u003ccircle class=\"fig-dot\" cx=\"250\" cy=\"90\" r=\"4\" data-node=\"collector\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"360\" cy=\"90\" r=\"4\" data-node=\"collector\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"470\" cy=\"90\" r=\"4\" data-node=\"collector\" data-node-color=\"blue\"/>\u003ctext class=\"fig-text fig-math\" x=\"140\" y=\"66\">R\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">1\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"94\" y=\"173\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">π3\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"267\" y=\"160\">g\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">m3\u003c/tspan>v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">b\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"374\" y=\"176\">r\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">o3\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"37\" y=\"69\" data-node-color=\"red\">v\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">b\u003c/tspan>\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"448\" y=\"39\" data-node-color=\"blue\">V\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">t\u003c/tspan>(+)\u003c/text>\u003ctext class=\"fig-text fig-math\" x=\"398\" y=\"49\">i\u003ctspan baseline-shift=\"sub\" font-size=\"78%\">t\u003c/tspan>\u003c/text>\u003c/svg>\u003cfigcaption>PNP 이미터는 AC 접지예요. 자기 베이스는 접지가 아니라 $R_1$을 통해 출력과 연결돼요. 오른쪽 시험전압의 유입 전류는 왼쪽을 향해요.\u003c/figcaption>\u003c/figure>"}, {"label": "(1) 분압 귀환과 차동 이득", "html": "\u003cdiv class=\"equation\">$$v_t=i_b(R_1+r_{\\pi3})$$\u003c/div>\u003cdiv class=\"equation\">$$i_t=(1+\\beta)i_b+\\frac{v_t}{r_{o3}}$$\u003c/div>\u003cdiv class=\"equation\">$$R_{fb}\\approx\\frac{R_1+r_{\\pi3}}{\\beta+1}=\\frac{10+2.6}{101}\\,\\mathrm{k\\Omega}\\approx0.12\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$R_{out,h}\\approx r_{o1}\\parallel r_{o3}\\parallel\\frac{R_1+r_{\\pi3}}{\\beta+1}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{v1}\\approx-g_mR_{out,h}\\approx-4.68$$\u003c/div>"}, {"label": "(2) 공급 증가와 흡수 감소의 합", "html": "\u003cdiv class=\"equation\">$$g_m=\\frac{0.1}{0.026}\\,\\mathrm{mS}\\approx3.85\\,\\mathrm{mS}$$\u003c/div>\u003cdiv class=\"equation\">$$r_{o2}=\\frac5{0.1}\\,\\mathrm{k\\Omega}=50\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$r_{o4}=\\frac4{0.1}\\,\\mathrm{k\\Omega}=40\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$R_{out}\\approx r_{o2}\\parallel r_{o4}=\\frac{200}{9}\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$A_{v2}\\approx+g_m(r_{o2}\\parallel r_{o4})\\approx+85.47$$\u003c/div>"}, {"label": "(3) 각 전류원 전류와 큰 축퇴 반회로", "html": "\u003cdiv class=\"equation\">$$R_{E,h}=R_E/2=2.5\\,\\mathrm{k\\Omega}$$\u003c/div>\u003cdiv class=\"equation\">$$g_m=\\frac{0.1}{0.026}\\,\\mathrm{mS}\\approx3.85\\,\\mathrm{mS}$$\u003c/div>\u003cdiv class=\"equation\">$$g_mR_{E,h}\\approx9.62$$\u003c/div>\u003cdiv class=\"equation\">$$A_{v3}\\approx-\\frac{R_C}{R_E/2}=-\\frac1{2.5}=-0.4$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_{v1}\\approx-4.68$\u003c/b>, $V_T=26\\,\\mathrm{mV}$·명목1mA DC·유한 $\\beta=100$의 부하 모델이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_{v2}\\approx+85.47$\u003c/b>, 같은 $V_T$ 가정·큰 $\\beta$ 거울 주항이에요.\u003c/p>\u003cp>\u003cstrong>(3)\u003c/strong>\u003c/p>\u003cp>\u003cb>$A_{v3}\\approx-0.4$\u003c/b>, 각 $I_{EE}=0.1\\,\\mathrm{mA}$·큰 $\\beta$·큰 외부 축퇴 주항이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": "stale", "content_sha256": "90239fa6627e681b5b777f99174803efafbe80f77bb1633b0bf0c1f06e74ce98", "depends_on": [], "estimated_minutes": 25, "id": "2015-1_중간-Q3", "kind": "기출", "learning_goals": ["능동 부하 전류 합성", "BJT 유한 β", "부하 구조 비교"], "priority": "core", "reference_solution": "solution", "subpart_count": 3, "subparts": [{"ask_md": "그림 Q3 회로의 차동 전압 이득", "label": "1", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "유한 β와 rπ", "능동 부하의 소신호 등가회로", "유한 출력 저항(ro)", "출력 저항", "소신호 전압 이득"]}, {"ask_md": "그림 Q3-2 회로의 차동 전압 이득", "label": "2", "required_concepts": ["차동 증폭기", "전류 거울", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "능동 부하의 소신호 등가회로", "유한 출력 저항(ro)", "출력 저항", "소신호 전압 이득"]}, {"ask_md": "그림 Q3-3 회로의 차동 전압 이득", "label": "3", "required_concepts": ["차동 증폭기", "차동 반회로와 가상 접지", "DC 바이어스와 동작 영역", "소신호 파라미터 gm·rO", "소스·이미터 축퇴", "소신호 전압 이득"]}], "why": "자기 베이스-컬렉터 저항 부하와 BJT 거울 부하의 다른 전류 경로를 비교하는 기출"}, "review_workload_label": "핵심 · 소문항 3묶음 · 예상 25분(추정)", "source_title": "베이스–컬렉터 저항 R1·R2를 단 pnp 부하, 전류 거울 부하, 이미터 저항 R_ I_C}$$\u003c/div>\n\u003cp>병렬저항의 역수는 가지별 역수의 합이므로 이득의 역수로 바꾸어요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\frac{1}{|A_v|}\\approx\\frac{1}{g_mr_{O2}}+\\frac{1}{g_mr_{O4}}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_mr_{O2}=\\frac{I_C}{V_T}\\frac{V_{A,n}}{I_C}=\\frac{V_{A,n}}{V_T}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_mr_{O4}=\\frac{I_C}{V_T}\\frac{V_{A,p}}{I_C}=\\frac{V_{A,p}}{V_T}$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{1}{|A_v|}\\approx\\frac{V_T}{V_{A,n}}+\\frac{V_T}{V_{A,p}}$$\u003c/div>\n"}, {"label": "목표 이득에서 PNP Early 전압 역산", "html": "\n\u003cp>주도항 설계식에 목표 크기 100과 $V_{A,n}=5\\,\\mathrm V$를 넣고 PNP 항만 남겨요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\frac{0.026\\,\\mathrm V}{V_{A,p}}=\\frac{1}{100}-\\frac{0.026\\,\\mathrm V}{5\\,\\mathrm V}=4.8\\times10^{-3}$$\u003c/div>\n\u003cdiv class=\"equation\">$$V_{A,p}=\\frac{0.026\\,\\mathrm V}{4.8\\times10^{-3}}=\\frac{65}{12}\\,\\mathrm V\\approx5.42\\,\\mathrm V$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>필요한 PNP Early 전압 크기는 $V_{A,p}=65/12\\,\\mathrm V\\approx5.42\\,\\mathrm V$예요.\u003c/strong> $V_T=26\\,\\mathrm{mV}$, 큰 $\\beta$, $g_mr_O\\gg1$인 주도항 설계에서 $A_v\\approx+100$이에요.\u003c/p>", "paginate": true}, "review_selection": {"adoption_unit": "whole", "classification_status": null, "content_sha256": "a5c64281e3def1f024c4b6d57d443a0ded00396b918a9f05dbbc95a70cfce92f", "depends_on": [], "estimated_minutes": 10, "id": "P10.75", "kind": "장말문제", "learning_goals": ["Early 전압 설계"], "priority": "extra", "reference_solution": "solution", "subpart_count": 1, "subparts": [{"ask_md": "- pnp 트랜지스터에 필요한 Early 전압", "label": "main"}], "why": "기출의 순방향 이득 계산을 보완해 목표 이득에서 pnp Early 전압을 역산"}, "review_workload_label": "추가 연습 · 소문항 1묶음 · 예상 10분(추정)", "source_title": "능동 부하 바이폴라 쌍(Fig 10.96)의 이득 100을 위한 pnp Early 전압"}]}</script>

const REL_RE = /^(?:=|\\(?:approx|Rightarrow|leq?|geq?)(?![a-zA-Z]))/;
const EQ_SPLIT_LEN = 40;

// 중괄호·\left…\right 바깥의 관계 기호에서 나눈다: [lhs, [rel, rhs], …]
function splitRelations(tex) {
  const parts = [];
  let depth = 0, start = 0, rel = null;
  for (let i = 0; i < tex.length; i++) {
    const c = tex[i];
    if (depth === 0) {
      const m = (c === '=' || c === '\\') && REL_RE.exec(tex.slice(i));
      if (m) {
        parts.push(rel ? [rel, tex.slice(start, i).trim()] : tex.slice(start, i).trim());
        rel = m[0]; i += m[0].length - 1; start = i + 1;
        continue;
      }
    }
    if (c === '{') depth++;
    else if (c === '}') depth--;
    else if (c === '\\') {
      const cmd = (/^\\([a-zA-Z]+|.)/.exec(tex.slice(i)) || [, ""])[1];
      if (cmd === 'left') depth++;
      else if (cmd === 'right') depth--;
      i += cmd.length;
    }
  }
  if (!rel) return null;
  parts.push([rel, tex.slice(start).trim()]);
  return parts;
}

function equationTex(tex, parts, prefix) {
  const [lhs, ...rest] = parts;
  if (!lhs) return prefix + tex;
  const lines = rest.map(([rel, rhs], i) => `${i ? '' : prefix + lhs} &amp;${rel} ${rhs}`);
  return `\\begin{aligned}${lines.join(' \\\\ ')}\\end{aligned}`;
}

function breakEquations(html) {
  if (!html) return html;
  const toks = [];
  let last = 0;
  for (const m of html.matchAll(MATH_RE)) {
    toks.push({ text: html.slice(last, m.index) });
    const tex = (m[1] ?? m[2]).trim();
    const parts = tex.length > EQ_SPLIT_LEN ? splitRelations(tex) : null;
    toks.push({ tex, parts, display: !!m[1] || !!parts, prefix: '' });
    last = m.index + m[0].length;
  }
  if (!toks.length) return html;
  toks.push({ text: html.slice(last) });

  // 줄로 나뉜 식 사이에 남는 쉼표는 지우고, 식 사이의 → 는 다음 식 앞으로 옮긴다
  toks.forEach((t, k) => {
    if (t.text == null) return;
    const prev = toks[k - 1], next = toks[k + 1];
    const pd = prev && prev.display, nd = next && next.display;
    if (pd && nd && /^\s*(→|⇒)\s*$/.test(t.text)) { t.text = ''; next.prefix = '\\Rightarrow\\ '; return; }
    if (pd) t.text = t.text.replace(/^\s*[,，]\s*/, '');
    if (nd) t.text = t.text.replace(/\s*[,，]\s*$/, ' ');
    if (pd && nd && !t.text.trim()) t.text = '';
  });

  return toks.map(t => {
    if (t.text != null) return t.text;
    if (!t.display) return `$${t.tex}$`;
    return `$$${t.parts ? equationTex(t.tex, t.parts, t.prefix) : t.prefix + t.tex}$$`;
  }).join('');
}

// display 식이 칸보다 넓으면 그 식만 줄인다 (최소 70%)
function fitDisplayMath(root) {
  for (const d of root.querySelectorAll('.katex-display')) {
    const k = d.firstElementChild;
    if (!k) continue;
    k.style.transform = '';
    const avail = d.clientWidth, need = k.scrollWidth;
    if (need > avail + 1) {
      k.style.transformOrigin = 'left center';
      k.style.transform = `scale(${Math.max(MATH_MIN_SCALE, avail / need)})`;
    }
  }
}

function nextLayout() {
  void book.offsetHeight;          // 레이아웃을 돌려 새 글꼴(KaTeX 등) 로드를 시작시킴
  return document.fonts.ready;
}

/* ---------- 쪽 틀과 헤더 (공용) ---------- */
function makePage(kind, cls) {
  const page = el('section', `page ${cls}`);
  page.dataset.kind = kind;
  const head = el('header', 'page-head');
  const body = el('div', 'page-body');
  page.append(head, body);
  return { page, head, body };
}

function problemHead(p, n, total) {
  const frag = document.createDocumentFragment();
  const lead = el('div', 'head-lead');
  lead.append(txt('span', 'kind-badge', p.kind), txt('span', 'head-num', p.number));
  if (p.difficulty > 0) lead.append(txt('span', 'head-stars', '★'.repeat(p.difficulty)));
  if (p.sol) lead.append(txt('span', 'sol-tag', 'SOL'));
  lead.append(txt('span', 'ans-tag', '답안'));

  const h2 = el('h2', 'page-title');
  h2.append(txt('span', 'sr', `${p.kind} ${p.number} — `), document.createTextNode(p.title));

  const meta = el('div', 'head-meta');
  const info = [p.section, p.book_page != null ? `p.${p.book_page}` : '', `${n} / ${total}`];
  if (p.review_workload_label) meta.append(txt('div', 'head-info review-workload', p.review_workload_label));
  meta.append(txt('span', 'head-info', info.filter(Boolean).join(' · ')));

  frag.append(lead, h2, meta);
  return frag;
}

/* ---------- 문제 쪽 ---------- */
function figureImg(f) {
  const img = el('img', 'fig');
  img.src = f.src;
  img.alt = '';
  img.width = Math.round(f.w_mm * 10);
  img.height = Math.round(f.h_mm * 10);
  img.style.setProperty('--w-cap', `${f.w_mm * FIG_SCALE_CAP}mm`);
  img.style.setProperty('--ratio', f.w_mm / f.h_mm);
  return img;
}

function block(label, html, cls, lang) {
  const b = el('section', 'block');
  const body = el('div', `prose ${cls}`, breakEquations(html));
  if (lang) body.lang = lang;
  b.append(txt('div', 'block-label', label), body);
  return b;
}

function hintStrip(p) {
  const a = el('a', 'hint-strip');
  a.href = `#hint-${p.id}`;
  a.append(txt('div', 'hint-strip-label', 'Hint'));
  const ol = el('ol', 'hint-strip-list');
  p.hints.forEach((h, i) => {
    const li = el('li', 'hint-strip-item');
    li.dataset.n = i + 1;
    if (h.formula) li.append(stripFormula(h.formula));
    else li.append(el('span', 'hint-strip-text', h.label));   // 이름표 속 KaTeX가 grid 칸으로 흩어지지 않게
    ol.append(li);
  });
  a.append(ol);
  return a;
}

// 'formula'(구분자 없는 LaTeX)가 있으면 띠에는 이름표 대신 식을 보인다
function stripFormula(tex) {
  const span = el('span', 'hint-strip-formula');
  if (typeof katex !== 'undefined') katex.render(tex, span, { throwOnError: false });
  else span.textContent = tex;
  return span;
}

function fitStripFormulas(page) {
  for (const f of page.querySelectorAll('.hint-strip-formula')) {
    f.style.transform = '';
    const avail = f.clientWidth, need = f.scrollWidth;
    if (need > avail + 1) f.style.transform = `scale(${Math.max(STRIP_MATH_MIN_SCALE, avail / need)})`;
  }
}

// 가운데 칸: 풀이 단계와 답. solution이 없으면 빈 점 격자
function solutionArea(p) {
  const work = el('div', 'work');
  const s = p.solution;
  if (!s) return work;
  const flow = el('div', 'sol-flow');
  const ol = el('ol', 'sol-steps');
  (s.steps || []).forEach((st, i) => {
    const li = el('li', 'sol-step');
    li.dataset.n = i + 1;
    if (st.label) li.append(el('div', 'sol-step-label', st.label));
    li.append(el('div', 'prose sol-step-body', breakEquations(st.html)));
    ol.append(li);
  });
  flow.append(ol);
  work.append(flow);
  if (s.answer) {
    const a = block('답', s.answer, 'ask-box');
    a.classList.add('sol-answer');
    work.append(a);
  }
  return work;
}

function problemPage(p, n, total) {
  const { page, head, body } = makePage(kindSlug(p.kind), 'page--problem');
  page.id = p.id;
  if (p.solution?.paginate) page.dataset.solutionPagination = '';
  head.append(problemHead(p, n, total));

  const row = el('div', 'page-row');
  const panel = el('div', 'panel');
  if (p.html.original) panel.append(block('문제 원문', p.html.original, 'original', p.original_lang || 'en'));   // 원문은 맨 처음
  panel.append(block('조건', p.html.conditions, 'conditions'), block('구할 것', p.html.ask, 'ask-box'));
  const center = el('div', 'page-center');
  const figs = p.figures || [];
  if (figs.length) {
    const band = el('div', 'fig-band');
    figs.forEach(f => band.append(figureImg(f)));
    center.append(band);
  }
  center.append(solutionArea(p));
  row.append(panel, center);
  if (p.hints && p.hints.length) {
    row.classList.add('has-strip');
    if (p.hints.some(h => h.formula)) row.classList.add('has-formula');
    row.append(hintStrip(p));
  }
  body.append(row);
  return page;
}

// 6.5 쪽 맞춤. 들어가면 멈추고, 끝까지 넘치면 false.
function fitProblemPage(page) {
  const panel = page.querySelector('.panel');
  const fits = () => panel.scrollHeight <= panel.clientHeight + 1;
  const state = { pw: '33%', fs: panel.style.getPropertyValue('--fs') || '1' };
  for (const [prop, val] of FIT_STEPS) {
    if (fits()) break;
    panel.style.setProperty(prop, val);
    state[{ '--pw': 'pw', '--fs': 'fs' }[prop]] = val;
  }
  page.dataset.fit = `pw=${state.pw} fs=${state.fs}`;
  fitDisplayMath(panel);
  fitStripFormulas(page);
  const ok = fits();
  if (!ok) page.dataset.overflow = '';
  return ok;
}

// 풀이 칸 맞춤. 마지막 단계가 칸 아래나 오른쪽(넘친 단)으로 나가면 넘침.
function fitSolution(page) {
  const work = page.querySelector('.work');
  const flow = work.querySelector('.sol-flow');
  const last = flow && flow.querySelector('.sol-step:last-child');
  const final = work.querySelector('.sol-answer');
  const answerFits = () => {
    if (!final) return true;
    const a = final.getBoundingClientRect(), w = work.getBoundingClientRect();
    return a.bottom <= w.bottom + 1 && a.height <= w.height + 1;
  };
  if (!last) return answerFits();
  const fits = () => {
    fitDisplayMath(flow);
    const f = flow.getBoundingClientRect(), l = last.getBoundingClientRect();
    return l.bottom <= f.bottom + 1 && l.right <= f.right + 1 && answerFits();
  };
  const band = page.querySelector('.fig-band');
  const state = { sfs: work.style.getPropertyValue('--sfs') || '1', fig: '0.40', cols: '1' };
  for (const [key, val] of SOL_FIT_STEPS) {
    if (key === 'sfs' && page.hasAttribute('data-solution-pagination')) continue;
    if (fits()) break;
    if (key === 'fig') {
      if (!band) continue;
      band.style.setProperty('--fig-frac', val);
    }
    else if (key === 'cols') flow.classList.add('is-2col');
    else if (key === 'gap') work.style.setProperty('--sol-step-gap', val);
    else work.style.setProperty(`--${key}`, val);
    state[key] = val;
  }
  const ok = fits();
  fitDisplayMath(work.querySelector('.sol-answer') || work);
  page.dataset.fit += ` sfs=${state.sfs} fig=${state.fig} cols=${state.cols}`;
  if (!ok) page.dataset.overflow = '';
  return ok;
}

// Reviewed routes may continue on extra pages. Move the rendered DOM nodes;
// do not truncate equations, change their order, or regenerate their content.
async function paginateSolution(page, p, n, total) {
  if (!p.solution?.paginate || fitSolution(page)) return;
  const steps = [...page.querySelectorAll('.sol-step')];
  const answer = page.querySelector('.sol-answer');
  steps.forEach(node => node.remove());
  if (answer) answer.remove();
  let current = page, continuation = 0;
  const newPage = async () => {
    const next = problemPage({...p, figures: [], hints: [],
      solution: {steps: [], answer: ''}}, n, total);
    next.id = `${p.id}-solution-${++continuation}`;
    next.dataset.solutionFor = p.id;
    next.dataset.solutionPagination = '';
    next.querySelector('.page-title').append(document.createTextNode(' · 풀이 계속'));
    current.after(next);
    current = next;
    renderMath(next);
    await nextLayout();
    fitProblemPage(next);
    return next;
  };
  // Earlier fitting may have switched to two columns. Keep that readable
  // layout, but test each additional step before committing it to this page.
  for (const step of steps) {
    let list = current.querySelector('.sol-steps');
    list.append(step);
    if (!fitSolution(current) && list.children.length > 1) {
      step.remove();
      current.removeAttribute('data-overflow');
      await newPage();
      list = current.querySelector('.sol-steps');
      list.append(step);
      fitSolution(current); // an individually oversized step remains an error
    }
  }
  if (answer) {
    current.querySelector('.work').append(answer);
    const fits = () => {
      const work = current.querySelector('.work');
      const a = answer.getBoundingClientRect(), w = work.getBoundingClientRect();
      return a.bottom <= w.bottom + 1 && a.height <= w.height + 1 && fitSolution(current);
    };
    if (!fits()) {
      answer.remove();
      current.removeAttribute('data-overflow');
      await newPage();
      current.querySelector('.work').append(answer);
      fitDisplayMath(answer);
      if (!fits()) current.dataset.overflow = '';
    }
  }
  // Fitting marks provisional failures. Only the final page geometry decides.
  for (const item of [page, ...book.querySelectorAll('[data-solution-for]')]) {
    if ((item === page || item.dataset.solutionFor === p.id) && fitSolution(item)) {
      const final = item.querySelector('.sol-answer');
      const work = item.querySelector('.work');
      if (!final || (final.getBoundingClientRect().height <= work.getBoundingClientRect().height + 1
          && final.getBoundingClientRect().bottom <= work.getBoundingClientRect().bottom + 1))
        item.removeAttribute('data-overflow');
    }
  }
}

/* ---------- Hint 쪽 ---------- */
function hintItem(h, i) {
  const li = el('li', 'hint-item');
  li.dataset.n = i + 1;
  li.append(el('div', 'hint-item-label', h.label), el('div', 'prose hint-item-body', breakEquations(h.html)));
  return li;
}

function hintPage(title, first) {
  const { page, head, body } = makePage('hint', 'page--hint');
  // 이어지는 Hint 쪽은 책갈피가 겹치지 않게 제목을 h2가 아닌 div로 둔다
  head.append(txt('span', 'kind-badge', 'Hint'), txt(first ? 'h2' : 'div', 'page-title', `Hint — ${title}`));
  const cols = el('div', 'hint-cols');
  body.append(cols);
  book.append(page);
  return cols;
}

function hintEntry(p, withId) {
  const root = el('article', 'hint-entry');
  if (withId) root.id = `hint-${p.id}`;
  const num = txt('a', 'hint-entry-num', `${KIND_SHORT[p.kind] || ''} ${p.number}`.trim());
  num.href = `#${p.id}`;
  const list = el('ol', 'hint-items');
  root.append(num, list);
  return { root, list };
}

// 6.6 항목을 하나씩 넣고, 단이 넘치면 새 Hint 쪽에 같은 문제 칸을 열어 잇는다.
function flowHints(meta, problems, staged) {
  const overflow = [];
  const list = problems.filter(p => p.hints && p.hints.length);
  if (!list.length) return overflow;

  let cols = hintPage(meta.title, true);
  const over = () => cols.scrollWidth > cols.clientWidth + 1;

  for (const p of list) {
    let idPlaced = false;
    let entry = hintEntry(p, true);
    cols.append(entry.root);
    for (const li of staged.get(p.id)) {
      entry.list.append(li);
      fitDisplayMath(li);
      if (!over()) continue;

      li.remove();
      if (entry.list.children.length) idPlaced = true;
      else entry.root.remove();
      cols = hintPage(meta.title, false);
      entry = hintEntry(p, !idPlaced);
      cols.append(entry.root);
      entry.list.append(li);
      fitDisplayMath(li);
      if (over()) {                 // 빈 쪽에도 안 들어가는 항목
        cols.closest('.page').dataset.overflow = '';
        overflow.push(`hint-${p.id}`);
      }
    }
  }
  return overflow;
}

/* ---------- 화면 배율 ---------- */
function applyZoom(z) {
  for (const page of book.querySelectorAll(':scope > .page')) page.style.zoom = z;
}
const screenZoom = () => applyZoom(Math.min(1, (innerWidth - 32) / PAGE_W_PX));

/* ---------- 실행 (6.9) ---------- */
async function main() {
  try {
    const data = await loadData();
    const { meta, problems } = data;
    document.title = meta.title;

    // DOM 생성
    const total = meta.total || problems.length;
    problems.forEach((p, i) => book.append(problemPage(p, i + 1, total)));
    if (window.workbookVideoLayout && meta.typography) {
      for (const page of book.querySelectorAll('.page--problem')) {
        const scales = meta.typography[page.id];
        if (!scales) continue;
        page.querySelector('.panel').style.setProperty('--fs', scales.panel);
        page.querySelector('.work').style.setProperty('--sfs', scales.solution);
      }
    }
    const staging = el('div', 'staging');
    staging.setAttribute('aria-hidden', 'true');
    const staged = new Map();
    for (const p of problems) {
      const items = (p.hints || []).map(hintItem);
      staged.set(p.id, items);
      staging.append(...items);
    }
    document.body.append(staging);

    // 글꼴 + 그림 → KaTeX (수식 글꼴도 다 받은 뒤 잰다)
    await Promise.all([nextLayout(), ...[...document.images].map(img => img.decode().catch(() => {}))]);
    renderMath(book);
    renderMath(staging);
    await nextLayout();

    for (const [i, p] of problems.entries()) {
      await paginateSolution(document.getElementById(p.id), p, i + 1, total);
    }

    const overflow = [];
    for (const page of book.querySelectorAll('.page--problem')) {
      const panelOk = fitProblemPage(page);
      const solOk = fitSolution(page);
      if (!panelOk || !solOk || page.hasAttribute('data-overflow')) overflow.push(page.id);
    }
    overflow.push(...flowHints(meta, problems, staged));
    staging.remove();

    if (window.workbookVideoLayout && meta.typography) {
      for (const page of book.querySelectorAll('.page--problem')) {
        const scales = meta.typography[page.id];
        if (!scales) continue;
        for (const [selector, values] of [['.katex-display > .katex', scales.math], ['.hint-strip-formula', scales.hints]]) {
          [...page.querySelectorAll(selector)].forEach((node, i) => {
            const scale = values?.[i] ?? 1;
            node.style.transformOrigin = 'left center';
            node.style.transform = scale < 1 ? `scale(${scale})` : '';
          });
        }
      }
    }
    document.body.dataset.overflow = overflow.join(',');
    document.documentElement.dataset.ready = 'true';
  } catch (err) {
    console.error(err);
    book.append(txt('p', 'load-error', `문제 데이터를 읽지 못했습니다: ${err.message}`));
    document.body.dataset.overflow = '';
    document.documentElement.dataset.ready = 'error';
    return;
  }

  // 배율은 맞춤과 Hint 쪽 나누기가 끝난 뒤에만
  screenZoom();
  addEventListener('resize', screenZoom);
  addEventListener('beforeprint', () => applyZoom(''));
  addEventListener('afterprint', screenZoom);
}

addEventListener('DOMContentLoaded', main);
</script>
</body>
</html>
