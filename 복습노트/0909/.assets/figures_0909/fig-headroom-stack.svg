<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="같은 높이의 방 두 개예요. 왼쪽 방에는 테두리만 있는 층 상자가 하나 있고 위에 남는 여유가 커요. 오른쪽 방에는 층 상자가 두 개 쌓여 있고 강조색 테두리로 표시한 남는 여유가 더 작아요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
