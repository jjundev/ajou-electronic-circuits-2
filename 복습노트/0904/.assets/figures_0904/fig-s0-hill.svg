<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="오른쪽으로 갈수록 가파르게 올라가는 휜 길 선 위에 색칠된 점이 하나 있고, 그 점을 곧은 강조색 선이 스치고 지나가요. 점 근처에서는 두 선이 거의 겹치고, 오른쪽 끝에서는 두 선 사이가 경고색 세로선만큼 벌어져요."><style>
