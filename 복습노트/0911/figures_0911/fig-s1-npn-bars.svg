<svg xmlns="http://www.w3.org/2000/svg" width="560" height="225" viewBox="0 0 560 225" role="img" aria-label="테두리 막대 세 개. 하나만 있을 때는 1배로 아주 낮고, 새는 길 없이 하나를 올리면 약 25배로 가장 높아요. 강조색 테두리 막대인 새는 길 있게 올리기는 약 12배로, 가운데 막대의 절반쯤이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="560" height="225" rx="10" fill="#ffffff"/>
      <line class="fig-ink" x1="30" y1="190" x2="530" y2="190"/>
      <rect class="fig-ink" x="70" y="184" width="70" height="6"/>
      <rect class="fig-ink" x="245" y="40" width="70" height="150"/>
      <rect class="fig-accent" x="420" y="118" width="70" height="72"/>
      <text class="fig-text" x="105" y="176" text-anchor="middle">1배</text>
      <text class="fig-text" x="280" y="32" text-anchor="middle">약 25배</text>
      <text class="fig-text" x="455" y="110" text-anchor="middle">약 12배</text>
      <text class="fig-muted" x="105" y="212" text-anchor="middle">하나만</text>
      <text class="fig-muted" x="280" y="212" text-anchor="middle">새는 길 없이 올리기</text>
      <text class="fig-muted" x="455" y="212" text-anchor="middle">새는 길 있게 올리기</text>
    </svg>
