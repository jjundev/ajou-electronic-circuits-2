<svg xmlns="http://www.w3.org/2000/svg" width="420" height="262" viewBox="0 0 420 262" role="img" aria-label="왼쪽 테두리 원 전압원 1 V의 위쪽 단자에서 나온 선이 오른쪽으로 가며 I out 화살표를 지나고, 오른쪽 세로 저항 R L = 1 kΩ을 거쳐 아래 선으로 돌아와요. 아래 선 가운데를 끊은 자리에 강조선의 작은 저항 r이 직렬로 들어가 있고, r의 오른쪽 끝은 플러스, 왼쪽 끝은 마이너스예요. r의 두 끝에서 내려온 선이 화살표가 그려진 테두리 원 볼트미터에 연결돼요. r 양 끝의 분기점은 색칠된 점이에요"><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
