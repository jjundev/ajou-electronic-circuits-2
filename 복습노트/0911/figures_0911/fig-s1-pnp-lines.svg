<svg xmlns="http://www.w3.org/2000/svg" width="560" height="245" viewBox="0 0 560 245" role="img" aria-label="왼쪽 그래프에 모양이 다른 선 세 개(실선, 긴 점선, 짧은 점선)가 모두 아래 왼쪽에서 출발해 서로 다르게 휘어져 올라가요. 선들이 지나가는 작은 부분을 강조색 테두리 네모로 둘러 오른쪽에 크게 확대하면, 확대한 강조색 테두리 네모 안에서는 선이 곧게 보여요."><style>
