<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="테두리 상자 두 개가 위아래로 쌓여 있어요. 아래 상자는 흐름의 양을 정하고, 위 상자는 같은 흐름을 그대로 넘겨요. 위 상자 꼭대기에 강조색 굵은 선이 문처럼 막고 있어요."><style>
