</style><rect x="0" y="0" width="520" height="220" rx="10" fill="#ffffff"/><text class="fig-text" x="260" y="24" text-anchor="middle" font-size="15">AC 접지의 기준: 소신호 전압 변화가 0인가?</text><rect class="fig-accent" x="15" y="45" width="235" height="132" rx="6"/><text class="fig-text" x="132" y="70" text-anchor="middle" font-size="14">이상적 고정 전압원</text><text class="fig-text" x="132" y="102" text-anchor="middle" font-size="14">DC 1 V</text><text class="fig-text" x="132" y="130" text-anchor="middle" font-size="14">전압 변화 0 V</text><text class="fig-text" x="132" y="159" text-anchor="middle" font-size="14">AC 접지로 둬요</text><rect class="fig-danger" x="270" y="45" width="235" height="132" rx="6"/><text class="fig-text" x="387" y="70" text-anchor="middle" font-size="14">신호가 얹힌 노드</text><text class="fig-text" x="387" y="102" text-anchor="middle" font-size="14">DC 1 V + 작은 신호</text><text class="fig-text" x="387" y="130" text-anchor="middle" font-size="14">전압 변화 1 mV</text><text class="fig-text" x="387" y="159" text-anchor="middle" font-size="14">AC 접지가 아니에요</text><text class="fig-muted" x="260" y="205" text-anchor="middle" font-size="14">전류원 부하 MOS의 출력저항 rO는 남을 수 있어요</text></svg>
