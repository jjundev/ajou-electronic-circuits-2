<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CG 단 V-V 귀환 +Δv 인과와 분배기 로딩</title>
  <!-- 생성 파일: .assets/자료_인터렉티브_02_CG_VV_귀환_인과와_로딩/lab.js을 고친 뒤 ec2-interactive/scripts/build.cjs로 다시 만드세요. -->
  <script>document.documentElement.classList.add('js');try{const t=localStorage.getItem('od-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="if(window.__EC2_LAB__&&window.__EC2_LAB__.renderMath)window.__EC2_LAB__.renderMath();"></script>
  <style>
    /* ---------- 토큰 (ec2-review-pack 규약) ---------- */
    :root {
      color-scheme: light;
      --scroll: #c9d0db; --scroll-hover: #9aa3b2;
      --bg: #ffffff; --surface: #f7f8fa; --ink: #111111; --ink-2: #6b7280; --line: #d9dee7;
      --accent: #1677ff; --accent-ink: #1b64da; --btn-bg: #1b64da; --on-btn: #ffffff;
      --warn: #b54708; --prof: #6941c6; --supp: #067647; --danger: #d92d20;
      --font: 'Pretendard', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --fs-body: 16px; --fs-sub: 15px; --fs-small: 14px; --fs-label: 13px; --fs-fig: 12px;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
      --radius: 8px; --tap: 44px;
      --dur: 220ms; --dur-exit: 150ms; --ease-out: cubic-bezier(.2, .8, .2, 1);
      --scrim: rgba(0, 0, 0, .4);
      --pl: clamp(260px, 21vw, 320px);
      --pr: clamp(320px, 26vw, 420px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --scroll: #3f414b; --scroll-hover: #5b5e6a;
        --bg: #17171c; --surface: #212128; --ink: #f2f4f6; --ink-2: #a3abb8; --line: #34353d;
        --accent: #3182f6; --accent-ink: #6ea4ff; --btn-bg: #1b64da; --on-btn: #ffffff;
        --warn: #f5a15c; --prof: #b69cff; --supp: #5fd39a; --danger: #ff6b61;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --scroll: #3f414b; --scroll-hover: #5b5e6a;
      --bg: #17171c; --surface: #212128; --ink: #f2f4f6; --ink-2: #a3abb8; --line: #34353d;
      --accent: #3182f6; --accent-ink: #6ea4ff; --btn-bg: #1b64da; --on-btn: #ffffff;
      --warn: #f5a15c; --prof: #b69cff; --supp: #5fd39a; --danger: #ff6b61;
    }

    /* ---------- 기본 ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    body {
      height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: var(--font); font-size: var(--fs-body); line-height: 1.6;
      word-break: keep-all; overflow-wrap: anywhere;
    }
    button, input, select { font-family: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    [hidden] { display: none !important; }
    .num { font-variant-numeric: tabular-nums; }

    #ec2-lab-root.lab-app {
      height: 100%; width: 100%; min-width: 0;
      display: grid; grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden; background: var(--bg); color: var(--ink);
    }

    /* ---------- 상단 바 ---------- */
    .topbar {
      display: flex; align-items: center; gap: var(--s2);
      min-height: 58px; min-width: 0; padding: var(--s2) var(--s3);
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .brand {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      font-size: 17px; font-weight: 700; white-space: nowrap;
    }
    .text-btn {
      flex: none; min-height: var(--tap); min-width: var(--tap);
      padding: 0 var(--s3); border: 0; border-radius: var(--radius);
      background: transparent; color: var(--ink);
      font: 600 var(--fs-small)/1 var(--font); cursor: pointer;
    }
    .panel-toggle { display: inline-flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); }
    .panel-toggle svg, .theme-toggle svg {
      flex: none; width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .panel-toggle .strip { fill: transparent; stroke: none; transition: fill 150ms ease-out; }
    .panel-toggle[aria-expanded="true"] { color: var(--accent-ink); }
    .panel-toggle[aria-expanded="true"] .strip { fill: currentColor; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .theme-toggle .i-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .i-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .i-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .i-sun { display: block; }
      :root:not([data-theme="light"]) .theme-toggle .i-moon { display: none; }
    }

    .seg {
      flex: 0 1 auto; display: flex; gap: 2px; padding: 2px; min-width: 0;
      border: 1px solid var(--line); border-radius: var(--radius);
      max-width: 100%; overflow-x: auto;
    }
    .seg button {
      min-height: 44px; min-width: 44px; padding: 0 var(--s3); border: 0; border-radius: 6px;
      background: transparent; color: var(--ink-2);
      font-size: var(--fs-small); font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .seg button[aria-pressed="true"] { background: var(--btn-bg); color: var(--on-btn); }

    /* ---------- 3단 레이아웃 ---------- */
    .layout {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      min-height: 0; min-width: 0;
    }
    .panel {
      position: relative; display: flex; flex-direction: column;
      min-height: 0; min-width: 0; overflow: hidden;
      background: var(--bg); color: var(--ink);
    }
    .panel-left { grid-column: 1; border-right: 1px solid var(--line); }
    .panel-right { grid-column: 3; border-left: 1px solid var(--line); }
    .panel-inner {
      flex: 1 1 auto; min-height: 0; min-width: 0;
      overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      padding: var(--s4) var(--s4) var(--s6);
      overflow-wrap: anywhere;
    }
    .panel-inner::-webkit-scrollbar, .stage::-webkit-scrollbar { width: 8px; }
    .panel-inner::-webkit-scrollbar-track, .stage::-webkit-scrollbar-track { background: transparent; }
    .panel-inner::-webkit-scrollbar-thumb, .stage::-webkit-scrollbar-thumb {
      background: var(--scroll); border-radius: 8px; border: 2px solid var(--bg);
    }
    .panel-inner::-webkit-scrollbar-thumb:hover, .stage::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
    @supports (scrollbar-color: auto) {
      .panel-inner, .stage { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
    }
    .panel-head { display: flex; align-items: center; gap: var(--s2); min-height: var(--tap); margin-bottom: var(--s2); }
    .panel-head h2 { flex: 1 1 0; min-width: 0; margin: 0; font-size: 20px; line-height: 1.4; }
    .scrim { display: none; }

    @media (min-width: 1024px) {
      .panel-head { display: none; }
      .panel-left { width: var(--pl); }
      .panel-right { width: var(--pr); }
      .panel:not(.is-open) { width: 0; border-width: 0; visibility: hidden; }
      .panel.is-open { visibility: visible; }
      .panel-left .panel-inner { width: var(--pl); }
      .panel-right .panel-inner { width: var(--pr); }
    }
    @media (max-width: 1023.98px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .stage { grid-column: 1; }
      .panel {
        position: fixed; top: 0; bottom: 0; z-index: 40; visibility: hidden;
        transition: transform var(--dur-exit) ease-in, visibility 0s linear var(--dur-exit);
      }
      .panel-left { left: 0; width: min(304px, 88vw); max-width: 88vw; transform: translateX(-100%); }
      .panel-right { right: 0; width: min(360px, 88vw); max-width: 88vw; transform: translateX(100%); }
      .panel.is-open { visibility: visible; transform: none; transition: transform var(--dur) var(--ease-out); }
      .panel-inner { padding-top: calc(var(--s3) + env(safe-area-inset-top)); padding-bottom: calc(var(--s6) + env(safe-area-inset-bottom)); }
      .scrim {
        display: block; position: fixed; inset: 0; z-index: 35;
        background: var(--scrim); opacity: 0; visibility: hidden;
        transition: opacity var(--dur-exit) ease-in, visibility 0s linear var(--dur-exit);
      }
      .scrim.is-on { opacity: 1; visibility: visible; transition: opacity var(--dur) var(--ease-out); }
    }
    @media (max-width: 640px) { .brand { display: none; } .topbar { justify-content: space-between; } }
    @media (max-width: 480px) {
      .panel-toggle span { display: none; }
      .panel-toggle { padding: 0 var(--s1); }
      .seg button { padding: 0 var(--s2); font-size: 13px; }
    }
    @media (hover: hover) {
      .text-btn:hover, .btn:hover, .predict-btn:hover { background: var(--surface); }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel, .panel.is-open, .scrim, .scrim.is-on, .panel-toggle .strip { transition: none; }
    }

    /* ---------- 좌/우 패널 섹션 ---------- */
    .sec { margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--line); min-width: 0; }
    .panel-inner > .sec:first-child, .panel-head + .sec { margin-top: 0; padding-top: 0; border-top: 0; }
    .sec-title { display: block; margin: 0 0 var(--s3); font-size: 17px; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
    .sub { margin: var(--s2) 0 0; font-size: var(--fs-small); color: var(--ink-2); }

    .opt, .preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
    .btn {
      display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: var(--tap);
      padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--bg); color: var(--ink);
      font-size: var(--fs-small); font-weight: 600; line-height: 1.35; text-align: left; cursor: pointer;
    }
    .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--surface); }
    .btn .box { flex: none; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; }
    .btn[aria-pressed="true"] .box { background: currentColor; }

    .slider-list, .steps, .port-controls, .elem-controls { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
    .slider-row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .slider-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); font-size: var(--fs-small); }
    .slider-head label { font-weight: 600; }
    .slider-val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-ink); }
    .slider-row input[type=range] { width: 100%; min-height: 36px; margin: 0; accent-color: var(--accent); cursor: pointer; }

    .causal-bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); margin-bottom: var(--s2); }
    .causal-bar .btn { justify-content: center; text-align: center; padding: 0 var(--s2); }
    .step-num {
      flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 2px solid currentColor; font-size: 12px; font-weight: 700;
    }
    .step-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .step-txt b { font-size: 14px; font-weight: 700; }
    .step-txt span { font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .detail { margin-top: var(--s3); padding: var(--s3); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-small); line-height: 1.6; }

    .port-group { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
    .port-group-label { font-size: var(--fs-label); font-weight: 700; color: var(--ink-2); }
    .port-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
    .port-choices .btn { justify-content: center; text-align: center; }

    /* ---------- 우측 설명 패널 ---------- */
    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); min-width: 0; }
    .tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tile { padding: var(--s3); border-radius: var(--radius); background: var(--surface); min-width: 0; overflow-wrap: anywhere; }
    .tile b { display: block; font-size: 18px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
    .tile span { display: block; font-size: var(--fs-label); line-height: 1.4; color: var(--ink-2); }

    .diagnosis {
      padding: var(--s3) var(--s4); border-radius: var(--radius); background: var(--surface);
      border-left: 3px solid var(--accent); font-size: var(--fs-small); line-height: 1.6;
      min-width: 0; overflow-wrap: anywhere;
    }
    .diagnosis.is-ok { border-left-color: var(--supp); }
    .diagnosis.is-warn { border-left-color: var(--warn); }
    .diagnosis.is-bad { border-left-color: var(--danger); }
    .diagnosis b { display: block; margin-bottom: 2px; font-weight: 700; }

    .formula-box {
      padding: var(--s3); border-radius: var(--radius); background: var(--surface);
      font-size: var(--fs-sub); min-width: 0; overflow-wrap: anywhere;
    }
    .formula-box .eq-item + .eq-item { margin-top: var(--s2); padding-top: var(--s2); border-top: 1px solid var(--line); }
    .formula-box .eq-name { display: block; font-size: var(--fs-label); font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
    .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; margin: var(--s1) 0; }
    .panel-inner table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: var(--fs-small); }
    .panel-inner th, .panel-inner td { border-bottom: 1px solid var(--line); padding: var(--s2); text-align: left; overflow-wrap: anywhere; }

    .sec.warn { border-top: 0; padding: var(--s4); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-small); line-height: 1.65; }
    .sec.warn .sec-title { color: var(--warn); font-size: 16px; margin-bottom: var(--s2); }
    .mistake { margin-top: var(--s3); min-width: 0; overflow-wrap: anywhere; }
    .mistake:first-of-type { margin-top: 0; }
    .mistake b { display: block; font-weight: 700; }
    .mistake span { color: var(--ink-2); }

    /* ---------- 중앙 스테이지 & 예측 카드 & 플롯 ---------- */
    .stage {
      grid-column: 2; position: relative; min-width: 0; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: var(--s3); padding: var(--s3);
      background: var(--bg);
    }
    .predict-slot, .plot-slot { flex: none; }
    .predict-slot:empty, .plot-slot:empty { display: none; }
    .panel-right .predict-slot { margin-block-end: var(--s4); }
    .predict-card {
      flex: none; width: 100%; max-width: 760px; margin: 0 auto; min-width: 0;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s2);
    }
    .predict-prompt { margin: 0; font-size: var(--fs-sub); font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
    .predict-skip { flex: none; min-height: var(--tap); padding: 0 var(--s2); border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: var(--fs-label); font-weight: 600; cursor: pointer; }
    .predict-opts, .predict-actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
    .predict-btn {
      min-height: var(--tap); padding: var(--s2) var(--s3); border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--bg); color: var(--ink);
      font-size: var(--fs-small); font-weight: 600; cursor: pointer; max-width: 100%; overflow-wrap: anywhere;
    }
    .predict-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); }
    .predict-open, .predict-verify { color: var(--accent-ink); }
    .predict-verify:disabled { color: var(--ink-2); opacity: .65; cursor: default; }
    .predict-feedback {
      font-size: var(--fs-small); line-height: 1.55; padding: var(--s2) var(--s3);
      border-radius: 6px; background: var(--bg); border-left: 3px solid var(--supp);
      overflow-wrap: anywhere;
    }
    .predict-feedback.is-wrong { border-left-color: var(--warn); }
    .predict-feedback p, .predict-readings { margin: var(--s1) 0 0; }
    .predict-readings { padding-inline-start: 1.2em; font-variant-numeric: tabular-nums; }

    .lab-stage-wrap {
      position: relative; flex: 1 0 auto; min-width: 0; min-height: 220px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .lab-stage {
      width: 100%; max-width: 760px; min-width: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .lab-stage svg {
      width: 100%; height: auto; max-height: 540px; display: block; color: var(--ink); overflow: visible;
    }

    .port-popover {
      position: absolute; z-index: 25; min-width: 148px; max-width: calc(100% - 16px);
      padding: var(--s2); border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--bg); box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      display: flex; flex-direction: column; gap: var(--s1);
    }
    .port-popover-title { font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 2px var(--s2); }
    .port-popover button {
      min-height: var(--tap); padding: 0 var(--s3); border: 1px solid var(--line);
      border-radius: 6px; background: var(--surface); font-size: var(--fs-small);
      font-weight: 600; text-align: left; cursor: pointer;
    }
    .port-popover button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--bg); }

    .plot-wrap {
      flex: none; width: 100%; max-width: 760px; margin: 0 auto; min-width: 0;
      padding: var(--s3); border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--line);
      display: flex; flex-direction: column; gap: var(--s2);
    }
    .plot-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2); font-size: var(--fs-label); }
    .plot-legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); color: var(--ink-2); }
    .plot-sw { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
    .plot-sw.exact { background: var(--accent); }
    .plot-sw.approx { border-top: 2px dashed var(--ink); height: 0; }
    .err-badge {
      display: inline-flex; align-items: center; padding: 2px var(--s2);
      border-radius: 6px; font-size: 12px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--line); color: var(--supp);
    }
    .err-badge.is-bad { border-color: var(--danger); color: var(--danger); }
    .plot-wrap svg { width: 100%; height: auto; display: block; color: var(--ink); }
    .plot-axis { stroke: var(--line); stroke-width: 1.5; }
    .plot-guide { stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 3 3; }

    /* ---------- SVG 규약 (ec2-review-pack 일치) + 동적 상태 ---------- */
    .fig-ink { stroke: currentColor; fill: none; stroke-width: 2; }
    .fig-accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
    .fig-danger { stroke: var(--danger); fill: none; stroke-width: 2.5; }
    .fig-dot { fill: var(--accent); }
    .fig-text { fill: currentColor; font-size: 13px; font-family: inherit; }
    svg text, svg text[class], svg text tspan, .fig-math, .fig-math tspan {
      font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal;
    }
    svg tspan[baseline-shift="sub"], svg tspan[baseline-shift="super"] { font-size: 78%; }
    svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: var(--accent, #2563eb); }
    svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: var(--danger, #dc2626); }
    .fig-muted { fill: var(--ink-2); font-size: var(--fs-fig); font-family: inherit; }

    svg .is-hot:is(line, path, polyline, rect, circle, polygon),
    svg .is-hot :is(line, path, polyline, rect, circle, polygon):not(.lab-badge-bg):not(.port-chip-bg):not(.fig-dot) { stroke: var(--accent); stroke-width: 3; }
    svg .is-hot:is(text, tspan),
    svg .is-hot :is(text, tspan):not(.lab-badge-text):not(.port-chip) { fill: var(--accent-ink); }

        addA(i2, icp, -el.gm, 0);

    const raw = spec && spec.toggles;
    if (!raw) return toggles;
    const lists = Array.isArray(raw) ? [raw] : Object.values(raw);
    for (const list of lists) {
      for (const item of list || []) {
        const t = normalizeToggleEntry(item);
        if (!(t.key in toggles)) toggles[t.key] = t.def;
      }
    }
    return toggles;
  }

  function collectInitialPorts(spec, firstModeKey) {
    const ports = {};
    const addPorts = (list) => {
      for (const p of list || []) {
        const id = String(p.id);
        if (!(id in ports)) {
          const opts = normalizePortOptions(p.options);
          ports[id] = p.def !== undefined ? String(p.def) : (opts[0] ? opts[0].id : '');
        }
      }
    };
    for (const m of getModes(spec)) addPorts(m.ports);
    addPorts(spec && spec.ports);
    if (firstModeKey) {
      for (const p of getPortsForMode(spec, firstModeKey)) ports[p.id] = p.def;
    }
    return ports;
  }

  function createInitialState(spec) {
    const firstMode = getModes(spec)[0];
    const mode = firstMode ? firstMode.key : '';
    const params = {};
    for (const p of Array.isArray(spec && spec.params) ? spec.params : []) {
      params[p.key] = p.def !== undefined ? p.def : p.min;
    }
    const disabledElems = Array.isArray(spec && spec.initialDisabledElems)
      ? spec.initialDisabledElems.map(String)
      : [];
    return {
      mode,
      step: -1,
      params,
      disabledElems,
      ports: collectInitialPorts(spec, mode),
      causalStep: 0,
      predictChoice: null,
      predictDismissed: false,
      predictExpanded: false,
      predictVerified: false,
      toggles: collectInitialToggles(spec),
      theme: 'light',
      drawer: null,
      leftOpen: true,
      rightOpen: true,
      focusNode: null,
    };
  }

  function cloneState(state) {
    const out = {
      mode: state.mode,
      step: state.step,
      params: Object.assign({}, state.params),
      disabledElems: Array.isArray(state.disabledElems) ? state.disabledElems.slice() : [],
      ports: Object.assign({}, state.ports),
      causalStep: state.causalStep || 0,
      predictChoice: state.predictChoice ?? null,
      predictDismissed: Boolean(state.predictDismissed),
      predictExpanded: Boolean(state.predictExpanded),
      predictVerified: Boolean(state.predictVerified),
      toggles: Object.assign({}, state.toggles),
      theme: state.theme === 'dark' ? 'dark' : 'light',
      drawer: state.drawer || null,
      leftOpen: state.leftOpen !== false,
      rightOpen: state.rightOpen !== false,
      focusNode: state.focusNode ?? null,
    };
    if (state.narrow !== undefined) out.narrow = Boolean(state.narrow);
    return out;
  }

  function applyModeSwitch(spec, next, modeKey) {
    const target = getModes(spec).find((m) => m.key === modeKey);
    if (!target) return false;
    next.mode = target.key;
    next.step = -1;
    next.causalStep = 0;
    next.focusNode = null;
    next.predictChoice = null;
    next.predictVerified = false;
    if (Array.isArray(target.ports)) {
      for (const p of getPortsForMode(spec, target.key)) next.ports[p.id] = p.def;
    }
    return true;
  }

  function applyPatch(spec, next, patch) {
    if (patch.params && typeof patch.params === 'object') {
      for (const [k, v] of Object.entries(patch.params)) {
        const clamped = clampParam(spec, k, v);
        if (clamped !== null) next.params[k] = clamped;
      }
    }
    if (patch.ports && typeof patch.ports === 'object') {
      for (const [k, v] of Object.entries(patch.ports)) next.ports[k] = String(v);
    }
    if (Array.isArray(patch.disabledElems)) next.disabledElems = patch.disabledElems.map(String);
    if (patch.causalStep !== undefined) next.causalStep = patch.causalStep;
  }

  function reduceState(spec, state, action) {
    if (!action || typeof action !== 'object') return state;
    const next = cloneState(state);

    switch (action.type) {
      case 'SET_MODE': {
        if (action.mode === state.mode) return state;
        return applyModeSwitch(spec, next, action.mode) ? next : state;
      }

      case 'PICK_STEP': {
        const idx = action.index !== undefined ? action.index : action.step;
        if (idx === -1) {
          next.step = -1;
          return next;
        }
        const s = (Array.isArray(spec && spec.steps) ? spec.steps : [])[idx];
        if (!s) return state;
        if (s.mode && s.mode !== next.mode) applyModeSwitch(spec, next, s.mode);
        applyPatch(spec, next, s);
        next.step = idx;
        return next;
      }

      case 'SET_PARAM': {
        const clamped = clampParam(spec, action.key, action.value);
        if (clamped === null) return state;
        next.params[action.key] = clamped;
        next.step = -1;
        return next;
      }

      case 'APPLY_PRESET': {
        const id = String(action.id ?? action.key ?? '');
        const preset = action.preset || getPresetsForMode(spec, next.mode).find((p) => p.id === id)
          || (Array.isArray(spec && spec.presets) ? spec.presets.find((p) => String(p.id ?? p.key) === id) : null);
        if (!preset) return state;
        if (preset.mode && preset.mode !== next.mode) applyModeSwitch(spec, next, preset.mode);
        applyPatch(spec, next, preset);
        next.step = -1;
        return next;
      }

      case 'TOGGLE_ELEM': {
        const id = String(action.id);
        const idx = next.disabledElems.indexOf(id);
        if (idx >= 0) next.disabledElems.splice(idx, 1);
        else next.disabledElems.push(id);
        return next;
      }

      case 'SET_PORT': {
        const portId = String(action.portId ?? action.id ?? action.port ?? '');
        if (!portId) return state;
        next.ports[portId] = String(action.value);
        return next;
      }

      case 'PULSE_CAUSAL': {
        if (action.reset === true || action.step === 0 || action.causalStep === 0) {
          next.causalStep = 0;
          return next;
        }
        const explicit = action.step !== undefined ? action.step : action.causalStep;
        if (explicit !== undefined) {
          next.causalStep = explicit;
          return next;
        }
        const ids = getCausalStepsForMode(spec, next.mode).map((s) => s.id);
        if (ids.length === 0) return state;
        const delta = action.delta !== undefined ? action.delta : 1;
        const idx = ids.indexOf(next.causalStep);
        if (delta < 0) next.causalStep = idx <= 0 ? 0 : ids[idx - 1];
        else next.causalStep = idx < 0 ? ids[0] : (idx + 1 < ids.length ? ids[idx + 1] : 0);
        return next;
      }

      case 'ANSWER_PREDICT': {
        const prediction = spec.predict;
        const choice = action.choice ?? action.optionId ?? action.id;
        if (!matchesMode(prediction, state.mode) || state.predictDismissed ||
            !prediction.options.some((option) => (typeof option === 'object' ? option.id : option) === choice)) return state;
        next.predictChoice = choice;
        next.predictExpanded = true;
        next.predictVerified = false;
        return next;
      }

      case 'VERIFY_PREDICT': {
        const prediction = spec.predict;
        if (!matchesMode(prediction, state.mode) || state.predictDismissed ||
            state.predictChoice === null || state.predictVerified) return state;
        if (prediction.check) {
          applyPatch(spec, next, prediction.check.before || {});
          applyPatch(spec, next, prediction.check.after);
          next.step = -1;
        }
        next.predictVerified = true;
        return next;
      }

      case 'OPEN_PREDICT': {
        next.predictExpanded = true;
        next.predictDismissed = false;
        return next;
      }

      case 'DISMISS_PREDICT': {
        next.predictChoice = null;
        next.predictDismissed = true;
        next.predictExpanded = false;
        next.predictVerified = false;
        return next;
      }

      case 'TOGGLE_OPT': {
        next.toggles[action.key] = !next.toggles[action.key];
        return next;
      }

      case 'SET_THEME': {
        if (action.theme !== 'light' && action.theme !== 'dark') return state;
        next.theme = action.theme;
        return next;
      }

      case 'TOGGLE_PANEL': {
        const side = action.side;
        if (side !== 'left' && side !== 'right') return state;
        if (action.narrow) next.drawer = next.drawer === side ? null : side;
        else if (side === 'left') next.leftOpen = !next.leftOpen;
        else next.rightOpen = !next.rightOpen;
        return next;
      }

      case 'CLOSE_DRAWER': {
        next.drawer = null;
        return next;
      }

      case 'FOCUS_NODE': {
        const nid = action.nodeId ? String(action.nodeId) : null;
        next.focusNode = next.focusNode === nid ? null : nid;
        return next;
      }

      default:
        return state;
    }
  }

  function buildProbeStates(spec) {
    const states = [];
    const base = createInitialState(spec);
    states.push({ label: '초기 상태', state: base });

    if (spec && spec.predict && Array.isArray(spec.predict.options) && spec.predict.options.length > 0) {
      const mode = getModes(spec).find((m) => matchesMode(spec.predict, m.key));
      if (mode) {
        const start = reduceState(spec, base, { type: 'SET_MODE', mode: mode.key });
        const opt = spec.predict.options[0];
        const choice = typeof opt === 'object' ? opt.id : opt;
        const chosen = reduceState(spec, start, { type: 'ANSWER_PREDICT', choice });
        states.push({ label: '예측 카드 응답', state: chosen });
        states.push({ label: '예측 결과 확인', state: reduceState(spec, chosen, { type: 'VERIFY_PREDICT' }) });
      }
    }

    for (const m of getModes(spec)) {
      let modeState = reduceState(spec, base, { type: 'SET_MODE', mode: m.key });
      modeState = reduceState(spec, modeState, { type: 'DISMISS_PREDICT' });
      const mLabel = m.label || m.key;
      states.push({ label: `모드: ${mLabel}`, state: modeState });

      const cSteps = getCausalStepsForMode(spec, m.key);
      if (cSteps.length > 0) {
        states.push({
          label: `${mLabel}: 인과 마지막 박자`,
          state: reduceState(spec, modeState, { type: 'PULSE_CAUSAL', step: cSteps[cSteps.length - 1].id }),
        });
      }

      const portDefs = getPortsForMode(spec, m.key);
      if (portDefs.length > 0) {
        let correctState = modeState;
        const answers = {};
        for (const p of portDefs) {
          const ans = p.answer !== undefined ? p.answer : (p.options[0] ? p.options[0].id : p.def);
          answers[p.id] = ans;
          correctState = reduceState(spec, correctState, { type: 'SET_PORT', portId: p.id, value: ans });
        }
        states.push({ label: `${mLabel}: 정답 조립`, state: correctState });

        const badTarget = portDefs.find((p) => p.options.some((o) => o.id !== answers[p.id]));
        if (badTarget) {
          const badOpt = badTarget.badOption && badTarget.options.some((o) => o.id === badTarget.badOption)
            ? badTarget.badOption
            : badTarget.options.find((o) => o.id !== answers[badTarget.id]).id;
          states.push({
            label: `${mLabel}: 대표 오조립`,
            state: reduceState(spec, correctState, { type: 'SET_PORT', portId: badTarget.id, value: badOpt }),
          });
        }
      }

      for (const elItem of getElemsForMode(spec, m.key)) {
        states.push({
          label: `${mLabel}: ${elItem.label} OFF`,
          state: reduceState(spec, modeState, { type: 'TOGGLE_ELEM', id: elItem.id }),
        });
      }

      for (const preset of getPresetsForMode(spec, m.key)) {
        states.push({
          label: `${mLabel}: 프리셋 ${preset.label}`,
          state: reduceState(spec, modeState, { type: 'APPLY_PRESET', id: preset.id }),
        });
      }
    }

    const allSteps = Array.isArray(spec && spec.steps) ? spec.steps : [];
    for (let i = 0; i < allSteps.length; i++) {
      let st = reduceState(spec, base, { type: 'PICK_STEP', index: i });
      st = reduceState(spec, st, { type: 'DISMISS_PREDICT' });
      states.push({
        label: `단계 ${i + 1}: ${allSteps[i].title || allSteps[i].label || ''}`.trim(),
        state: st,
      });
    }

    return states;
  }

  // ---------- DOM & Formatting Helpers ----------

  function el(doc, tag, attrs, text) {
    const node = doc.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'className') node.className = String(v);
        else node.setAttribute(k, v === true ? '' : String(v));
      }
    }
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function svgEl(doc, tag, attrs, text) {
    const node = doc.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v !== undefined && v !== null) node.setAttribute(k, String(v));
      }
    }
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function formatParamValue(p, val) {
    if (typeof p.format === 'function') return String(p.format(val));
    const num = Number(val);
    if (!Number.isFinite(num)) return String(val ?? '');
    let numStr;
    if (Math.abs(num) >= 100 || Number.isInteger(num)) numStr = String(Math.round(num * 100) / 100);
    else if (Math.abs(num) >= 1) numStr = num.toFixed(2).replace(/\.?0+$/, '');
    else numStr = num.toPrecision(3).replace(/\.?0+$/, '');
    return p.unit ? `${numStr} ${p.unit}` : numStr;
  }

  function formatTick(v) {
    if (!Number.isFinite(v)) return '';
    if (v === 0) return '0';
    const abs = Math.abs(v);
    if (abs >= 1000 || abs < 0.01) return v.toExponential(1).replace(/\.0e/, 'e');
    if (abs >= 10) return String(Math.round(v * 10) / 10);
    return String(Math.round(v * 100) / 100);
  }

  function formatNodeBadge(info) {
    if (info === null || info === undefined) return '';
    if (typeof info === 'string') return info;
    if (typeof info === 'number') return Number.isFinite(info) ? formatTick(info) : '';
    let base = '';
    if (info.badge !== undefined) base = String(info.badge);
    else if (info.text !== undefined) base = String(info.text);
    else if (info.v !== undefined || info.val !== undefined) {
      const raw = info.v !== undefined ? info.v : info.val;
      const numStr = typeof raw === 'number' && Number.isFinite(raw) ? formatTick(raw) : String(raw);
      base = info.unit ? `${numStr} ${info.unit}` : numStr;
    }
    if (!base) return '';
    if (info.dir === 'up' && !base.includes('↑')) return `${base} ↑`;
    if (info.dir === 'down' && !base.includes('↓')) return `${base} ↓`;
    if ((info.dir === '↑' || info.dir === '↓') && !base.includes(info.dir)) return `${base} ${info.dir}`;
    return base;
  }

  function ensureShell(doc, rootEl, spec) {
    rootEl.classList.add('lab-app');
    if (!rootEl.getAttribute('data-drawer')) rootEl.setAttribute('data-drawer', 'none');

    let topbar = rootEl.querySelector('.topbar');

    if (!topbar || !layout) {

        s.appendChild(svgEl(doc, 'rect', { x: '3', y: '4', width: '18', height: '16', rx: '3' }));
        s.appendChild(svgEl(doc, 'path', { d: leftSide ? 'M9 4v16' : 'M15 4v16' }));

      const leftBtn = el(doc, 'button', {

      });

      const themeBtn = el(doc, 'button', {

      });
      const moon = svgEl(doc, 'svg', { class: 'i-moon', viewBox: '0 0 24 24', 'aria-hidden': 'true' });
      moon.appendChild(svgEl(doc, 'path', { d: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' }));
      const sun = svgEl(doc, 'svg', { class: 'i-sun', viewBox: '0 0 24 24', 'aria-hidden': 'true' });
      sun.appendChild(svgEl(doc, 'circle', { cx: '12', cy: '12', r: '4' }));
      sun.appendChild(svgEl(doc, 'path', { d: 'M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' }));
      themeBtn.appendChild(moon);

      const rightBtn = el(doc, 'button', {

      });

      topbar.appendChild(themeBtn);
