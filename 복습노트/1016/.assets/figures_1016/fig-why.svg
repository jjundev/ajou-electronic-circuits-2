</style><rect x="0" y="0" width="650" height="135" rx="10" fill="#ffffff"/><rect class="fig-ink" x="10" y="30" width="180" height="65" rx="8"/><text class="fig-text" x="28" y="57">빠른 신호도 증폭할까?</text><text class="fig-muted" x="28" y="80">저주파 이득만으론 부족해요</text><path class="fig-accent" d="M195 62H225m-8-5 8 5-8 5"/><rect class="fig-ink" x="230" y="30" width="180" height="65" rx="8"/><text class="fig-text" x="247" y="57">내부 커패시턴스 확인</text><text class="fig-muted" x="247" y="80">떠 있으면 밀러 변환</text><path class="fig-accent" d="M415 62H445m-8-5 8 5-8 5"/><rect class="fig-ink" x="450" y="30" width="185" height="65" rx="8"/><text class="fig-text" x="466" y="57">주파수 응답과 대역폭</text><text class="fig-muted" x="466" y="80">쓸 수 있는 신호 범위</text></svg>
