<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="왼쪽은 NPN 캐스코드 전류원. 위의 Q1 컬렉터가 출력이고, 강조색 화살표가 위에서 출력을 들여다보는 R_out이에요. Q1 이미터와 Q2 컬렉터는 색칠된 점인 노드 X에서 만나고, Q2 이미터는 접지예요. 베이스에는 V_B1, V_B2가 걸려요. 오른쪽은 소신호 등가회로. 출력과 X 사이에 r_O1과 아래쪽 화살표가 든 마름모 전류원 g_m1 v_be1이 나란히 있고, X와 접지 사이에는 r_O2와 강조색 선으로 그린 r_π1이 나란히 있어요."><style>
