<g text-anchor="middle" font-family="Pretendard, sans-serif" font-weight="600">
<text class="fig-text" x="170" y="26" font-size="14">문제: 바로 옆 간섭 신호를 줄여요</text>
<text class="fig-muted" x="170" y="46" font-size="12">1 MHz 옆 신호를 약 40 dB 줄여야 해요</text>
<text class="fig-text" x="170" y="110" font-size="14">한계: 1차 필터는 너무 완만해요</text>
<text class="fig-muted" x="170" y="130" font-size="12">주파수가 10배 멀어져야 20 dB 줄어요</text>
<text class="fig-text" x="170" y="194" font-size="14">해법: 극점을 늘린 2차 필터</text>
<text class="fig-muted" x="170" y="214" font-size="12">복소 극점으로 더 날카롭게 걸러요</text>
<text class="fig-text" x="170" y="278" font-size="14">대가: 전력 소모와 피킹</text>
<text class="fig-muted" x="170" y="298" font-size="12">능동은 전력을, 큰 Q는 안정성을 내줘요</text>
