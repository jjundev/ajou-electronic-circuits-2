<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="대표 설정 3: 로그 눈금 가로 막대 세 개예요. 테두리만 있는 막대는 트랜지스터 하나의 r O = 50.0 kΩ, 빨간 테두리 막대는 단순 합 r O1 + r O2 = 100 kΩ, 색칠된 막대는 캐스코드 R out = 12.6 MΩ이고, 세로 점선은 근사식 g m1 r O1 r O2 = 12.5 MΩ 위치예요. 1 V 변할 때 전류 변화는 20.0 μA에서 79.4 nA로 줄어요."><style>
