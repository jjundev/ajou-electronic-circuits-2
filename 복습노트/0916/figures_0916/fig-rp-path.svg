<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170" viewBox="0 0 320 170" role="img" aria-label="왼쪽에서 들어온 선이 가운데 색칠된 점에서 나뉜다. 오른쪽으로 가는 선은 가늘고, 아래로 가는 가는 점선 옆에 새 샛길을 뜻하는 비스듬한 선이 하나 더 있다."><style>
