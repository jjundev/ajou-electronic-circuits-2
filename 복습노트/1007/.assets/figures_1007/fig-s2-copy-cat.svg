<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="출력 노드에 넣는 전류는 0.5에서 0.6밀리암페어, 빼는 전류는 0.5에서 0.4밀리암페어가 되어 0.2밀리암페어가 남음"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="520" height="220" rx="10" fill="#ffffff"/><text class="fig-text" x="260" y="24" text-anchor="middle" font-size="15">출력에 넣는 전류 − 출력에서 빼는 전류</text><text class="fig-text" x="125" y="53" text-anchor="middle" font-size="14">균형 상태</text><path class="fig-accent" d="M45,68 v40 m-5,-5 l5,5 5,-5"/><text class="fig-text" x="160" y="86" text-anchor="middle" font-size="14">넣음 0.5 mA</text><circle class="fig-dot" cx="45" cy="120" r="4"/><path class="fig-ink" d="M45,132 v40 m-5,-5 l5,5 5,-5"/><text class="fig-text" x="160" y="155" text-anchor="middle" font-size="14">뺌 0.5 mA</text><text class="fig-text" x="125" y="194" text-anchor="middle" font-size="15">남는 변화 0 mA</text><text class="fig-text" x="385" y="53" text-anchor="middle" font-size="14">차동 입력 뒤</text><path class="fig-accent" d="M305,68 v40 m-5,-5 l5,5 5,-5"/><text class="fig-text" x="420" y="86" text-anchor="middle" font-size="14">넣음 0.6 mA</text><circle class="fig-dot" cx="305" cy="120" r="4"/><path class="fig-ink" d="M305,132 v40 m-5,-5 l5,5 5,-5"/><text class="fig-text" x="420" y="155" text-anchor="middle" font-size="14">뺌 0.4 mA</text><text class="fig-text" x="385" y="194" text-anchor="middle" font-size="15">남는 변화 +0.2 mA</text></svg>
