<svg xmlns="http://www.w3.org/2000/svg" width="460" height="320" viewBox="0 0 460 320" role="img" aria-label="입력 소자 r_o를 남긴 소신호 등가회로: AC 접지된 V_DD에서 R_D를 거쳐 v_o1 노드로 i_1이, R_D+ΔR_D를 거쳐 v_o2 노드로 i_2가 내려가요. v_o1과 노드 P 사이에 아래 방향 제어 전류원 g_m(v_1 − v_P)와 r_o가 병렬로, v_o2와 P 사이에 g_m(v_2 − v_P)와 r_o가 병렬로 있고, P에서 접지로 R_SS = r_O3가 연결돼요."><style>
