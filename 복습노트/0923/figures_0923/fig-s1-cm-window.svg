<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="세로 화살표 옆에 네모 세 개가 쌓인 그림. 위쪽 경고색 테두리 네모는 너무 높음, 가운데 강조색 테두리 네모는 허락된 칸, 아래쪽 경고색 테두리 네모는 너무 낮음"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="420" height="260" rx="10" fill="#ffffff"/>
      <line class="fig-ink" x1="70" y1="245" x2="70" y2="20"/>
      <polyline class="fig-ink" points="65,27 70,20 75,27"/>
      <text class="fig-muted" x="62" y="135" text-anchor="end">입구</text>
      <text class="fig-muted" x="62" y="152" text-anchor="end">높이</text>
      <rect class="fig-danger" x="100" y="20" width="240" height="60" rx="6"/>
      <text class="fig-text" x="220" y="45" text-anchor="middle">너무 높음</text>
      <text class="fig-muted" x="220" y="66" text-anchor="middle">위쪽 두 일꾼이 멈춰요</text>
      <rect class="fig-accent" x="100" y="92" width="240" height="76" rx="6"/>
      <text class="fig-text" x="220" y="135" text-anchor="middle">허락된 칸</text>
      <rect class="fig-danger" x="100" y="180" width="240" height="60" rx="6"/>
      <text class="fig-text" x="220" y="205" text-anchor="middle">너무 낮음</text>
      <text class="fig-muted" x="220" y="226" text-anchor="middle">아래 펌프가 멈춰요</text>
