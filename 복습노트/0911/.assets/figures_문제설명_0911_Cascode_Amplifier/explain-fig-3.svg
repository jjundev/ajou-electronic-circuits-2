<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" role="img" aria-label="출력 노드 v_out과 중간 노드 v_X 사이에 아래 방향 제어 전류원 g_m·v_gs2와 r_O가 병렬로 있고, v_X와 접지 사이에 아래 방향 제어 전류원 g_m·v_gs1과 r_O가 병렬로 있어요. 이상 전류원 I1은 개방되어 v_out에는 M2 가지만 연결돼요. M2 게이트는 AC 접지라 v_gs2 = −v_X, M1 소스는 접지라 v_gs1 = v_in이에요."><style>
