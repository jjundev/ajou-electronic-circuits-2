<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="출력 노드 v_t와 중간 노드 v_x 사이에 M1의 제어 전류원 g_m1·v_gs1(v_t에서 v_x 방향), r_O1, 기생 저항 R_P가 병렬로 있어요. v_x에서 접지로 M2의 r_O2가 있고, 시험 전류원 i_t가 접지에서 v_t로 전류를 넣어요. M1 게이트가 AC 접지라 v_gs1 = −v_x예요."><style>
