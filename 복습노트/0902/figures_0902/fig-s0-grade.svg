<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-label="선으로 그린 가로 막대 하나를 네 칸으로 나눈 그림이에요. 중간고사 35, 기말고사 40, 설계과제 20, 출석 5 칸이 차례로 있고, 설계과제 칸만 강조색 테두리예요. 막대 오른쪽에는 질문하면 더해 주는 점수를 뜻하는 강조색 점선 칸이 따로 있어요."><style>
