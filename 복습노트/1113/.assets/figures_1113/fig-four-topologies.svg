<svg xmlns="http://www.w3.org/2000/svg" width="484" height="250" viewBox="0 0 484 250" role="img" aria-label="두 부분으로 된 그림이에요. 왼쪽은 귀환 루프예요. 빨간 점 입력 X가 테두리 원 합산기의 플러스 입력으로 들어가고, 테두리 상자 A 0을 지나 파란 점 Y에서 갈라져 오른쪽 화살표로 나가요. Y에서 강조선으로 내려간 감지 가지가 테두리 상자 K로 들어가고, K에서 나온 강조선 반송 가지가 X F로 합산기의 마이너스 입력에 아래에서 들어가요. 루프 아래에는 왼쪽에 반송 입력 쪽, 오른쪽에 감지 출력 쪽, 맨 아래에 이름: 감지-반송이라고 적혀 있어요. 오른쪽은 두 줄 두 칸의 표예요. 줄은 감지하는 양 전압과 전류, 칸은 반송하는 양 전압과 전류이고, 각 칸에 전압-전압과 전압 증폭기, 전압-전류와 트랜스임피던스, 전류-전압과 트랜스컨덕턴스, 전류-전류와 전류 증폭기가 적혀 있어요. 전압-전류 칸만 강조색 테두리예요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
