<svg xmlns="http://www.w3.org/2000/svg" width="510" height="315" viewBox="0 0 510 315" role="img" aria-label="능동 부하 BJT 차동쌍 회로. 위쪽에 pnp 트랜지스터 Q3, Q4가 전원 V CC에 이미터를 대고 베이스끼리 이어져 있다. Q3는 베이스가 자기 컬렉터 노드 A에 이어진 다이오드 연결이다. 아래쪽 npn Q1, Q2의 베이스에는 더하기 델타 V와 빼기 델타 V가 들어가고, 이미터는 노드 P에서 만나 테일 전류원 I EE로 내려간다. 강조색 선 화살표가 Q1 쪽 가지의 더하기 델타 I, Q2 쪽 가지의 빼기 델타 I, Q4로 복사된 더하기 델타 I를 가리킨다. 출력 노드에서 V out으로 가는 강조색 선 위 화살표에는 2 델타 I라고 적혀 있다."><style>
