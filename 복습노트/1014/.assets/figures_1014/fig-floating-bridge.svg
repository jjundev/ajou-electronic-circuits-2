<svg xmlns="http://www.w3.org/2000/svg" width="390" height="190" viewBox="0 0 390 190" role="img" aria-label="왼쪽은 테두리로 그린 두 물통 사이에 경고색 선으로 그린 관이 걸려 있고 물음표가 붙어 있다. 오른쪽은 같은 두 물통에 강조색 선으로 그린 관이 바닥 쪽으로 하나씩 달려 있다. 통 안의 물은 색칠된 사각형이다."><style>
