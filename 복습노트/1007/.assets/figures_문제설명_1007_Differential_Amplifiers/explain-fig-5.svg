<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="(b) 캐스코드 테일의 시험 회로: 시험 전류원 i_X가 접지에서 M3 드레인 노드 v_X로 전류를 넣어요. v_X와 M3 소스 노드 S3 사이에 아래 방향 제어 전류원 g_m3 v_gs3과 r_O3가 병렬로 있고, S3에서 접지로 r_O4가 연결돼요. M3 게이트는 AC 접지이고 v_gs3은 게이트가 +, S3가 −예요."><style>
