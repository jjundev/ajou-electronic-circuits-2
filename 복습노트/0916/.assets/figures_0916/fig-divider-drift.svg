<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-label="왼쪽 위 테두리 상자 &#x27;덥고 추운 날씨&#x27;와 왼쪽 아래 테두리 상자 &#x27;줄어드는 배터리&#x27;에서 선 화살표가 가운데 테두리 상자 &#x27;흐름의 양이 흔들려요&#x27;로 모이고, 그 상자에서 다시 오른쪽 강조색 테두리 상자 &#x27;제대로 일하지 못해요&#x27;로 이어지는 그림"><style>
