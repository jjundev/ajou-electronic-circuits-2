@font-face { font-family: Pretendard; font-style: normal; font-weight: 600; src: url(data:font/woff;base64,) format('woff'); }

svg { color: #1b2130; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
svg text, svg text[class], svg text tspan, .fig-math, .fig-math tspan { font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal; }
svg tspan[baseline-shift="sub"], svg tspan[baseline-shift="super"] { font-size: 78%; }
svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2f6fdb; }
svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #d92d20; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style>

  <!-- 입력 노드 RC 루프 -->
  <text class="fig-muted" x="20" y="20" font-size="12">입력 극점 루프 (Node v<tspan baseline-shift="sub">g</tspan>)</text>
  <circle class="fig-dot" data-node-color="blue" cx="80" cy="40" r="4"/>
  <text class="fig-text" x="72" y="32">v<tspan baseline-shift="sub">g</tspan></text>
  <!-- 저항 R_S -->
  <path class="fig-ink" d="M80 40 H50 V60 l-5 3 l10 5 l-10 5 l10 5 l-10 5 l10 5 l-5 3 V105"/>
  <path class="fig-ink" d="M42 105 H58 M45 109 H55 M48 113 H52"/>
  <text class="fig-text" x="18" y="78" font-size="12">R<tspan baseline-shift="sub">S</tspan></text>
  <!-- 커패시터 C_in -->
  <path class="fig-ink" d="M80 40 H120 V65 M120 75 V105"/>
  <path class="fig-accent" d="M110 65 H130 M110 75 H130" stroke-width="2.5"/>
  <path class="fig-ink" d="M112 105 H128 M115 109 H125 M118 113 H122"/>
  <text class="fig-text" x="134" y="74" font-size="11">C<tspan baseline-shift="sub">in</tspan>=(1+g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">D</tspan>)C<tspan baseline-shift="sub">F</tspan></text>
  <text class="fig-muted" x="35" y="128" font-size="11">ω<tspan baseline-shift="sub">in</tspan> ≈ 1 / [R<tspan baseline-shift="sub">S</tspan>C<tspan baseline-shift="sub">in</tspan>]</text>

  <!-- 구분선 -->
  <path class="fig-ink" d="M260 20 V115" stroke-dasharray="3 3"/>

  <!-- 출력 노드 RC 루프 -->
  <text class="fig-muted" x="290" y="20" font-size="12">출력 극점 루프 (Node v<tspan baseline-shift="sub">o</tspan>)</text>
  <circle class="fig-dot" data-node-color="red" cx="350" cy="40" r="4"/>
  <text class="fig-text" x="342" y="32">v<tspan baseline-shift="sub">o</tspan></text>
  <!-- 저항 R_D -->
  <path class="fig-ink" d="M350 40 H320 V60 l-5 3 l10 5 l-10 5 l10 5 l-10 5 l10 5 l-5 3 V105"/>
  <path class="fig-ink" d="M312 105 H328 M315 109 H325 M318 113 H322"/>
  <text class="fig-text" x="288" y="78" font-size="12">R<tspan baseline-shift="sub">D</tspan></text>
  <!-- 커패시터 C_out -->
  <path class="fig-ink" d="M350 40 H390 V65 M390 75 V105"/>
  <path class="fig-accent" d="M380 65 H400 M380 75 H400" stroke-width="2.5"/>
  <path class="fig-ink" d="M382 105 H398 M385 109 H395 M388 113 H392"/>
  <text class="fig-text" x="404" y="74" font-size="11">C<tspan baseline-shift="sub">out</tspan>=(1+1/g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">D</tspan>)C<tspan baseline-shift="sub">F</tspan></text>
  <text class="fig-muted" x="305" y="128" font-size="11">ω<tspan baseline-shift="sub">out</tspan> ≈ 1 / [R<tspan baseline-shift="sub">D</tspan>C<tspan baseline-shift="sub">out</tspan>]</text>

</svg>