<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="세로로 놓인 세 칸이 있어요. 가운데 칸은 색칠되어 있고 딱 좋은 범위라고 적혀 있어요. 위 칸과 아래 칸은 경고색 테두리만 있고, 각각 너무 높을 때와 너무 낮을 때라고 적혀 있어요. 왼쪽의 강조색 선이 손잡이 위치로 가운데 칸을 가리켜요."><style>
