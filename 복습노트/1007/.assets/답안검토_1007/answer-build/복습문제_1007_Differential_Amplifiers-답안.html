<style>
/* ==========================================================================
   답안지 템플릿 (문제 + 풀이 + Hint). 생성기 계약: #workbook-data 자리표시자(한 곳에만 둠),
   html[data-ready], body[data-overflow]. 문제 데이터는 문제집과 같고, 문제마다
   solution {steps: [{label, html}], answer} 를 더한다. 1–3절은 문제집 템플릿과 같다.
   ========================================================================== */

/* 1. 토큰 ------------------------------------------------------------------ */
:root {
  --page-w: 297mm;
  --page-h: 209.8mm;          /* 210mm보다 조금 작게: 빈 쪽이 끼는 것을 막음 */
  --page-pad: 8mm;
  --head-h: 10mm;
  --head-gap: 3mm;

  --font: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Segoe UI", sans-serif;
  --fs-body: 11.339286pt;
  --lh-body: 1.5;

  --ink: #1a1a1a;
  --muted: #888;
  --rule: #ddd;
  --paper: #fff;

  --kind-example: #2F6FB0;    /* 예제 */
  --kind-exercise: #3C8C5A;   /* 연습문제 */
  --kind-problem: #C0622B;    /* 장말문제 */
  --kind-exam: #7A4FA0;       /* 기출 */

  --panel-bg: #F6F6F3;
  --panel-block-gap: 8mm;     /* 조건 ↔ 구할 것 사이 상하 여백 */
  --grid-dot: #C8C8C8;
  --grid-step: 5mm;

  --hint-label: #8a6d20;
  --hint-ink: #5a5140;
  --hint-ink-strong: #6b5a2e;
  --hint-num-bg: #e9e1c9;
  --hint-bg: #FAF8F2;
  --hint-rule: #cfc7b0;
  --hint-badge: #a08a4f;

  --overflow: #D33;
  --screen-bg: #E9E9E6;
  --focus: #2F6FB0;
}
[data-kind="example"]  { --kind: var(--kind-example); }
[data-kind="exercise"] { --kind: var(--kind-exercise); }
[data-kind="problem"]  { --kind: var(--kind-problem); }
[data-kind="exam"]     { --kind: var(--kind-exam); }
[data-kind="hint"]     { --kind: var(--hint-badge); }

/* 2. 쪽 틀 (공용) ------------------------------------------------------------ */
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); }

.page {
  position: relative;
  width: var(--page-w); height: var(--page-h); padding: var(--page-pad);
  overflow: hidden; break-after: page; background: var(--paper);
  display: flex; flex-direction: column;
}
.page:last-child { break-after: auto; }
.page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3mm; container-type: size; }

/* 제작자 표기: 모든 쪽 우측 최하단 여백 */
.page::before {
  content: "made by jjundev"; position: absolute; bottom: 2.5mm; right: var(--page-pad);
  color: var(--muted); font-size: 7.370536pt; line-height: 1; letter-spacing: .02em; pointer-events: none;
}
/* "넘침" 표시와 겹치지 않도록 그 왼쪽으로 비킨다 */
.page[data-overflow]::before { right: calc(var(--page-pad) + 8mm); }

.page[data-overflow]::after {
  content: "넘침"; position: absolute; right: var(--page-pad); bottom: 2.5mm;
  color: var(--overflow); font-size: 7.937500pt; font-weight: 700;
}

a:focus-visible { outline: .5mm solid var(--focus); outline-offset: .5mm; }

/* 책갈피용 숨김 글자: display:none은 PDF 책갈피에서 빠지므로 clip으로 숨긴다 */
.sr {
  position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* 3. 헤더 (공용) ------------------------------------------------------------- */
.page-head {
  position: relative; flex: none; height: var(--head-h); margin-bottom: var(--head-gap);
  display: flex; align-items: center; gap: 3mm;
  border-bottom: .3mm solid var(--rule);
}
.head-lead { flex: none; display: flex; align-items: center; gap: 2mm; white-space: nowrap; }
.kind-badge {
  font-size: 7.937500pt; font-weight: 700; line-height: 1.4; color: var(--paper); background: var(--kind);
  border-radius: 1mm; padding: .5mm 1.6mm;
}
.head-num { font-size: 17.008929pt; font-weight: 800; letter-spacing: -.02em; }
.head-stars { color: var(--kind); font-size: 10.205357pt; letter-spacing: .05em; }
.sol-tag {
  font-size: 7.370536pt; font-weight: 700; line-height: 1.4; color: var(--muted);
  border: .25mm solid var(--muted); border-radius: 1mm; padding: 0 1mm;
}
.ans-tag {
  font-size: 7.370536pt; font-weight: 700; line-height: 1.4; color: var(--kind);
  border: .25mm solid var(--kind); border-radius: 1mm; padding: 0 1mm;
}
.page-title {
  flex: 1 1 auto; min-width: 0; margin: 0;
  font-size: 11.339286pt; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-meta {
  flex: 0 1 auto; min-width: 0; max-width: 45%;
  display: flex; align-items: center; gap: 2mm;
  font-size: 8.504464pt; color: var(--muted); white-space: nowrap;
}
.head-info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* 4. 문제 쪽 본문 ------------------------------------------------------------ */
.fig-band {
  --fig-frac: .40;
  --fig-h: calc(var(--fig-frac) * 100cqh);   /* 본문(.page-body) 높이 기준 */
  flex: none; display: flex; justify-content: center; align-items: flex-start; gap: 3mm;
}
/* 회로도는 모두 가운데 칸 맨 위에. 여러 장이면 폭을 나눠 갖고 비율은 그대로 */
.fig-band > .fig { flex: 0 1 auto; min-width: 0; margin-inline: 0; }
/* 가운데 칸: 위 회로도 + 아래 풀이 공간. 좌(조건)·우(Hint) 패널은 줄 높이 그대로 */
.page-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3mm; }
.page-center > .work { flex: 1; min-height: 0; }
.page-row { --strip-w: 0mm; flex: 1; min-height: 0; display: flex; }
.page-row.has-strip { --strip-w: 24mm; }
.page-row.has-formula { --strip-w: 40mm; }      /* 띠에 식을 직접 보일 때 */

.panel {
  --pw: 33%; --fs: 1;
  /* 풀이 공간 폭 100mm 이상: 패널 ≤ 줄 폭 − 5mm(간격) − 100mm − 띠 폭 */
  flex: none; width: min(var(--pw), calc(100% - 105mm - var(--strip-w))); margin-right: 5mm;
  background: var(--panel-bg); border-radius: 2mm; padding: 4mm; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--panel-block-gap);
  font-size: calc(var(--fs-body) * var(--fs));
}
.panel > * { flex: none; }

/* 그림: 너비 = min(칸 폭, 교재 크기 × 1.5, 최대 높이 × 가로세로비). 비율은 그대로, 잘리지 않음 */
.fig {
  display: block; margin-inline: auto; flex: none;
  width: min(100%, var(--w-cap), calc(var(--fig-h) * var(--ratio)));
  height: auto; aspect-ratio: var(--ratio);
  background: var(--paper); border-radius: 1mm;
}

.block-label {
  font-size: 7.937500pt; font-weight: 700; color: var(--muted); letter-spacing: .08em;
  line-height: 1.3; margin-bottom: 1.2mm;
}
.ask-box {
  background: var(--paper); border-left: .8mm solid var(--kind); border-radius: 0 1mm 1mm 0;
  padding: 2.5mm 3mm; font-size: 1.05em; font-weight: 500;
}

/* 본문 목록: 1단계 회색 원점(내어쓰기 3.5mm), 2단계 '–'(3mm 더) */
.prose { word-break: keep-all; overflow-wrap: anywhere; }
.prose ul { list-style: none; margin: 0; padding: 0; }
.prose li { position: relative; padding-left: 3.5mm; }
.prose li + li { margin-top: .8mm; }
.prose li::before {
  content: ""; position: absolute; left: .8mm; top: calc(.75em - .6mm);
  width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--muted);
}
.prose li li { padding-left: 3mm; }
.prose li ul { margin-top: .4mm; }
.prose li li::before {
  content: "–"; top: 0; left: 0; width: auto; height: auto; border-radius: 0;
  background: none; color: var(--muted);
}
.prose code { font-size: .92em; }
.prose p { margin: 0; }

/* 문제 원문: 맨 위, 조건·구할 것과 구분되게 가는 선 아래 한 단계 작게 (문제지와 같음) */
.original {
  font-size: .95em; line-height: 1.45; color: var(--ink);
  word-break: normal; overflow-wrap: break-word; hyphens: auto;
  padding-bottom: 3mm; border-bottom: .25mm solid var(--rule);
}

.work {
  flex: 1; min-width: 0;
  background-image: radial-gradient(circle, var(--grid-dot) .2mm, transparent .22mm);
  background-size: var(--grid-step) var(--grid-step); background-position: 0 0;
}

/* 풀이 칸 (답안지): 점 격자 위에 번호 단계, 맨 아래 답. 맞춤: 글자 0.9 → 0.8 → 2단 */
.work {
  --sfs: 1;
  --sol-step-gap: 10mm;          /* 풀이 단계 사이 상하 여백 */
  display: flex; flex-direction: column; gap: 3mm; overflow: hidden;
  padding: 1mm 2mm 0 1mm;
  font-size: calc(var(--fs-body) * var(--sfs));
}
.sol-flow { flex: 1; min-height: 0; overflow: hidden; padding-top: 2.5mm; column-gap: 8mm; column-fill: auto; }
.sol-flow.is-2col { column-count: 2; }
.sol-steps { list-style: none; margin: 0; padding: 0; }
.sol-step {
  display: grid; grid-template-columns: 5mm minmax(0, 1fr); column-gap: 2mm;
  break-inside: avoid;
}
.sol-step + .sol-step { margin-top: var(--sol-step-gap); }
.sol-step::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: start;
  width: 5mm; height: 5mm; border-radius: 50%;
  background: var(--kind); color: var(--paper);
  font-size: 7.937500pt; font-weight: 700; line-height: 5mm; text-align: center;
}
.sol-step-label {
  grid-column: 2; grid-row: 1; align-self: center;
  font-size: .9em; font-weight: 700; line-height: 1.3;
}
.sol-step-body { grid-column: 2; margin-top: 2.5mm; }
.sol-step-body:first-child { grid-row: 1; margin-top: 0; }
.sol-step-body .katex-display { overflow-x: clip; }
.sol-answer { flex: none; }

/* 검토된 핵심 풀이의 그림: 원래 설명 HTML과 같은 SVG 클래스 계약. */
:is(.sol-step-body, .sol-answer) figure { margin: 2mm 0; break-inside: avoid; }
:is(.sol-step-body, .sol-answer) img, :is(.sol-step-body, .sol-answer) svg:not(.katex svg) {
  display: block; max-width: 100%; max-height: 45mm; height: auto; color: var(--ink);
}
:is(.sol-step-body, .sol-answer) svg:not(.katex svg) { width: 90mm; }
:is(.sol-step-body, .sol-answer) .fig-ink { stroke: currentColor; fill: none; stroke-width: 2; }
:is(.sol-step-body, .sol-answer) .fig-accent { stroke: var(--kind); fill: none; stroke-width: 2.5; }
:is(.sol-step-body, .sol-answer) .fig-danger { stroke: var(--overflow); fill: none; stroke-width: 2.5; }
:is(.sol-step-body, .sol-answer) .fig-dot { fill: var(--kind); }
:is(.sol-step-body, .sol-answer) .fig-text { fill: currentColor; font-size: 13px; font-family: inherit; }
:is(.sol-step-body, .sol-answer) svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2563eb; }
:is(.sol-step-body, .sol-answer) svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #dc2626; }
:is(.sol-step-body, .sol-answer) .fig-muted { fill: var(--muted); font-size: 12px; font-family: inherit; }
:is(.sol-step-body, .sol-answer) svg marker { fill: currentColor; }
:is(.sol-step-body, .sol-answer) .axis { stroke: var(--muted); stroke-width: 1.5; }
:is(.sol-step-body, .sol-answer) .tick { fill: var(--muted); font-size: 11px; }
:is(.sol-step-body, .sol-answer) .plot-truth { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
:is(.sol-step-body, .sol-answer) .plot-fit, :is(.sol-step-body, .sol-answer) .plot-like { fill: none; stroke: var(--kind); stroke-width: 2.5; }
:is(.sol-step-body, .sol-answer) .plot-prior { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 4; }
:is(.sol-step-body, .sol-answer) .plot-post { fill: none; stroke: var(--kind); stroke-width: 3; }
:is(.sol-step-body, .sol-answer) .pt-train { fill: var(--kind); }
:is(.sol-step-body, .sol-answer) .pt-test { fill: var(--overflow); }
:is(.sol-step-body, .sol-answer) .mark-ml, :is(.sol-step-body, .sol-answer) .mark-map { stroke: var(--kind); stroke-width: 1.5; stroke-dasharray: 3 3; }


/* Hint 띠: 전체가 Hint 쪽 링크 */
.hint-strip {
  display: block; flex: none; width: var(--strip-w); overflow: hidden;
  border-left: .3mm dashed var(--hint-rule); padding-left: 3mm;
  color: inherit; text-decoration: none;
}
.hint-strip-label { font-size: 10.205357pt; font-weight: 700; line-height: 1.3; color: var(--hint-label); margin-bottom: 2mm; }
.hint-strip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.6mm; }
.hint-strip-item {
  display: grid; grid-template-columns: 3.4mm minmax(0, 1fr); column-gap: 1mm; align-items: start;
  font-size: 8.504464pt; line-height: 1.35; color: var(--hint-ink);
  word-break: keep-all; overflow-wrap: anywhere;
}
.hint-strip-item::before {
  content: attr(data-n); width: 3.4mm; height: 3.4mm; margin-top: .1mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 6.803571pt; font-weight: 700; line-height: 3.4mm; text-align: center;
}

.hint-strip-formula { display: block; white-space: nowrap; transform-origin: left center; }

/* 수식 */
.katex { font-size: 1.05em; }
.katex-display { margin: 1mm 0; }
.katex-display.fleqn > .katex { padding-left: 0; }   /* 본문 display 식은 왼쪽 맞춤 */

/* 5. Hint 쪽 ----------------------------------------------------------------- */
.hint-cols { flex: 1; min-height: 0; column-count: 2; column-gap: 10mm; column-fill: auto; overflow: hidden; }
.hint-entry {
  background: var(--hint-bg); border-radius: 2mm; padding: 3.5mm 4mm; margin-bottom: 5mm;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hint-entry-num {
  display: block; margin-bottom: 2mm; break-after: avoid;
  font-size: 10.772321pt; font-weight: 700; line-height: 1.3; color: var(--hint-ink-strong); text-decoration: none;
}
.hint-items { list-style: none; margin: 0; padding: 0; }
.hint-item {
  display: grid; grid-template-columns: 4mm minmax(0, 1fr); column-gap: 1.5mm;
  break-inside: avoid; font-size: 10.205357pt;
}
.hint-item + .hint-item { margin-top: 2.2mm; }
.hint-item::before {
  content: attr(data-n); grid-column: 1; grid-row: 1; align-self: center;
  width: 4mm; height: 4mm; border-radius: 50%;
  background: var(--hint-num-bg); color: var(--hint-ink-strong);
  font-size: 7.370536pt; font-weight: 700; line-height: 4mm; text-align: center;
}
.hint-item-label { grid-column: 2; grid-row: 1; font-size: 9.638393pt; font-weight: 700; color: var(--hint-ink-strong); }
.hint-item-body { grid-column: 2; margin-top: .6mm; }
.hint-item-body li { padding-left: 0; }
.hint-item-body li li { padding-left: 3mm; }
.hint-item-body li::before,
.hint-item-body li li::before { display: none; }

/* 7. 준비용·오류 ------------------------------------------------------------- */
.staging { position: absolute; left: 0; top: 0; width: 135mm; visibility: hidden; pointer-events: none; }
.load-error { margin: 16px auto; max-width: 720px; padding: 16px; background: var(--paper); color: var(--overflow); }

/* 8. 화면 모드 ----------------------------------------------------------------- */
@media screen {
  html { background: var(--screen-bg); scroll-snap-type: y proximity; }
  body { background: var(--screen-bg); padding: 16px 0; }
  .page { margin: 0 auto 16px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); scroll-snap-align: start; }
  .page:last-child { margin-bottom: 0; }
}
@media print {
  .page { zoom: 1 !important; }
}

\u003c/text>\n\u003c/svg>\u003cfigcaption>두 게이트에 같은 $v_{CM}$을 가하고 전원 $V_{DD}$와 바이어스 $V_b$를 AC 접지로 둔 전압 이득 회로예요. 입력 MOS의 $r_o$와 몸체 효과는 생략하고 실제 부하 $R_D$를 남겨요. 출력 X는 단락하지 않아요. 반회로의 $2r_{O3}$는 실제 테일 $r_{O3}$와 구별해요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$i_d=g_m(v_{CM}-v_P)$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{v_P}{2r_{O3}}=i_d$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{v_X}{R_D}+i_d=0$$\u003c/div>\n"}, {"label": "소스 축퇴에서 한쪽 출력 이득", "html": "\n\u003cdiv class=\"equation\">$$\\frac{i_d}{v_{CM}}=\\frac{g_m}{1+2g_mr_{O3}}=\\frac{1}{1/g_m+2r_{O3}}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}=\\frac{v_X}{v_{CM}}=-\\frac{R_D}{1/g_m+2r_{O3}}$$\u003c/div>\n"}, {"label": "평형 오버드라이브로 요구식 증명", "html": "\n\u003cdiv class=\"equation\">$$g_m=\\frac{2(I_{SS}/2)}{V_{ov}}=\\frac{I_{SS}}{V_{ov}}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}=-\\frac{R_D}{V_{ov}/I_{SS}+2/(\\lambda I_{SS})}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}=\\frac{-R_DI_{SS}}{V_{ov}+2/\\lambda}$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>한쪽 출력의 공통 모드 이득\u003c/strong>은 다음과 같아요. 대칭·포화·저주파 소신호, 입력 MOS의 $\\lambda=0$, 몸체 효과 생략 모델이에요.\u003c/p>\u003cdiv class=\"equation\">$$\\boxed{A_{CM}=\\frac{-R_DI_{SS}}{2/\\lambda+(V_{GS}-V_{TH})_{eq.}}}$$\u003c/div>", "paginate": true}}, {"id": "P10.68", "kind": "장말문제", "number": "10.68", "title": "PMOS 전류원 부하와 테일 M5를 가진 MOS 차동쌍(Fig 10.89)의 공통 모드 이득", "section": "10.5 Common-Mode Rejection", "book_page": 565, "difficulty": 0, "sol": false, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>Calculate the common-mode gain of the circuit depicted in Fig. 10.89. Assume $\\lambda &gt; 0$, $g_m r_O \\gg 1$, and use the relationship $A_v = -G_m R_{out}$.\u003c/p>", "conditions": "\u003cul>\u003cli>$\\lambda &gt; 0$\u003c/li>\u003cli>$g_m r_O \\gg 1$\u003c/li>\u003cli>$A_v = -G_m R_{out}$ 관계를 사용\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>회로의 공통 모드 이득\u003c/li>\u003c/ul>"}, "figures": [{"src" OmVFGe5C0WAyvov8P1xYvOfWcZ20AAAAASUVORK5CYII=", "w_mm": 45.9, "h_mm": 34.6}], "hints": [], "solution": {"steps": [{"label": "공통 모드 반회로와 출력 단락 측정", "html": "\n\u003cp>대칭 CM 반회로에서 $R_S=2r_{o5}$로 두고, $G_m$ 측정에는 출력을 실제로 접지에 단락해요. $i_o$는 접지 쪽에서 출력 단자로 들어오는 방향이에요.\u003c/p>\n\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"왼쪽 입력 vCM, 가운데 왼쪽 종속전류원 gm1(vCM-vs)와 오른쪽 ro1이 드레인과 소스 사이 병렬이다. 소스 아래에 2ro5가 있다. 맨 오른쪽 출력은 실제 도선으로 접지에 단락되며 io는 왼쪽으로 유입한다.\">\n\u003cpath class=\"fig-ink\" d=\"M40 104 H125 M125 87 V121 M210 68 H535 V245 M210 68 V112 M210 158 V195 H340 M340 68 V100 M210 195 V210 M210 266 V278 M200 278 H220 M204 283 H216 M208 288 H212 M535 245 v10 M525 255 H545 M529 260 H541 M533 265 H537\"/>\n\u003cpolygon class=\"fig-ink\" points=\"210,112 226,135 210,158 194,135\"/>\n\u003cpath class=\"fig-ink\" d=\"M210 122 V147 M205 141 L210 147 L215 141 M340 100 v10 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v43 M210 210 v5 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v9 M510 88 H463 M471 83 L463 88 L471 93\"/>\n\u003ccircle class=\"fig-dot\" cx=\"40\" cy=\"104\" r=\"4\" fill=\"#2563eb\" data-node=\"vin\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"210\" cy=\"195\" r=\"4\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"340\" cy=\"195\" r=\"4\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"340\" cy=\"68\" r=\"4\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"535\" cy=\"68\" r=\"4\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"28\" y=\"85\" fill=\"#2563eb\" data-node=\"vin\" data-node-color=\"blue\">vCM\u003c/text>\n\u003ctext class=\"fig-text\" x=\"221\" y=\"181\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\">vs\u003c/text>\n\u003ctext class=\"fig-text\" x=\"450\" y=\"48\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\">vout = 0\u003c/text>\n\u003ctext class=\"fig-text\" x=\"466\" y=\"110\">io\u003c/text>\u003ctext class=\"fig-text\" x=\"134\" y=\"86\">+\u003c/text>\u003ctext class=\"fig-text\" x=\"134\" y=\"127\">−\u003c/text>\n\u003ctext class=\"fig-text\" x=\"55\" y=\"173\">gm₁(vCM − vs)\u003c/text>\u003ctext class=\"fig-text\" x=\"355\" y=\"139\">ro₁\u003c/text>\u003ctext class=\"fig-text\" x=\"230\" y=\"245\">2ro₅\u003c/text>\n\u003c/svg>\u003cfigcaption>$G_m$ 측정: 출력 단락이므로 $r_{o3}$ 양단 전압도 0이라 그 가지는 생략했어요. $M_1$의 $r_{o1}$은 유지했어요. 입력의 +/−는 $v_{gs1}=v_{CM}-v_s$를 나타내요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$v_s=2r_{o5}i_o$$\u003c/div>\n\u003cdiv class=\"equation\">$$i_o=g_{m1}(v_{CM}-v_s)-\\frac{v_s}{r_{o1}}$$\u003c/div>\n"}, {"label": "출력 단락 트랜스컨덕턴스", "html": "\n\u003cdiv class=\"equation\">$$G_m=\\frac{i_o}{v_{CM}}=\\frac{1}{1/g_{m1}+2r_{o5}+2r_{o5}/(g_{m1}r_{o1})}\\approx\\frac1{2r_{o5}}$$\u003c/div>\n\u003cp>$g_{m1}r_{o1}\\gg1$, $2g_{m1}r_{o5}\\gg1$에서 $2r_{o5}$가 분모를 지배해요.\u003c/p>\n"}, {"label": "입력 영점과 출력 시험원 및 저항 판단", "html": "\n\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 640 330\" role=\"img\" aria-label=\"왼쪽 게이트 입력은 접지되고, 종속전류원 gm1(-vs)가 ro1 왼쪽에 놓인다. 소스 아래에 2ro5가 있고 출력에는 ro3가 접지로 연결된다. 가장 오른쪽 출력 끝점 Vt에서 시험전압원을 접지로 연결하며 it는 끝점 왼쪽에서 왼쪽으로 유입한다.\">\n\u003cpath class=\"fig-ink\" d=\"M40 110 H125 M125 93 V127 M40 110 V146 M30 146 H50 M34 151 H46 M38 156 H42 M210 70 H590 M210 70 V123 M210 169 V205 H340 M340 70 V107 M210 205 V222 M210 278 V295 M200 295 H220 M204 300 H216 M208 305 H212 M455 70 V121 M455 184 V295 M445 295 H465 M449 300 H461 M453 305 H457 M590 70 V135 M590 167 V295 M580 295 H600 M584 300 H596 M588 305 H592\"/>\n\u003cpolygon class=\"fig-ink\" points=\"210,123 226,146 210,169 194,146\"/>\n\u003cpath class=\"fig-ink\" d=\"M210 133 V158 M205 152 L210 158 L215 152 M340 107 v10 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v47 M210 222 v5 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v9 M455 121 v5 l8 5 l-16 8 l16 8 l-16 8 l16 8 l-8 5 v16 M570 89 H520 M528 84 L520 89 L528 94\"/>\n\u003ccircle class=\"fig-ink\" cx=\"590\" cy=\"151\" r=\"16\"/>\u003cpath class=\"fig-ink\" d=\"M584 145 H596 M590 139 V151 M584 158 H596\"/>\n\u003ccircle class=\"fig-dot\" cx=\"210\" cy=\"205\" r=\"4\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\"/>\u003ccircle class=\"fig-dot\" cx=\"340\" cy=\"205\" r=\"4\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"340\" cy=\"70\" r=\"4\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"455\" cy=\"70\" r=\"4\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\"/>\u003ccircle class=\"fig-dot\" cx=\"590\" cy=\"70\" r=\"4\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"49\" y=\"92\">vin = 0\u003c/text>\u003ctext class=\"fig-text\" x=\"221\" y=\"191\" fill=\"#dc2626\" data-node=\"vs\" data-node-color=\"red\">vs\u003c/text>\u003ctext class=\"fig-text\" x=\"563\" y=\"49\" fill=\"#2563eb\" data-node=\"test\" data-node-color=\"blue\">Vt(+)\u003c/text>\u003ctext class=\"fig-text\" x=\"535\" y=\"111\">it\u003c/text>\n\u003ctext class=\"fig-text\" x=\"65\" y=\"188\">gm₁(−vs)\u003c/text>\u003ctext class=\"fig-text\" x=\"353\" y=\"147\">ro₁\u003c/text>\u003ctext class=\"fig-text\" x=\"468\" y=\"155\">ro₃\u003c/text>\u003ctext class=\"fig-text\" x=\"231\" y=\"259\">2ro₅\u003c/text>\n\u003c/svg>\u003cfigcaption>$R_{out}$ 측정: 게이트 입력을 접지하고 오른쪽 시험원 $V_t$를 걸어요. $i_t$는 출력으로 유입하며 $R_{out}=V_t/i_t$예요. 제어원·$r_{o1}$·출력의 좌우 순서를 유지하고 테일 축퇴를 소스 아래에 두었어요.\u003c/figcaption>\u003c/figure>\n\u003cp>$M_1$ 아래쪽은 소스 축퇴로 저항이 커져요. 큰 곱 항이 지배하는 조건에서 다음 근사를 사용해요.\u003c/p>\n\u003cdiv class=\"equation\">$$R_{\\downarrow}\\approx 2g_{m1}r_{o1}r_{o5}$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{out}\\approx r_{o3}\\parallel\\left(2g_{m1}r_{o1}r_{o5}\\right)\\approx r_{o3}$$\u003c/div>\n\u003cp>마지막 근사는 $2g_{m1}r_{o1}r_{o5}\\gg r_{o3}$일 때예요. 곱 항은 $r_{o1},2r_{o5}$보다 커야 해요.\u003c/p>\n"}, {"label": "전류 생성과 출력 저항을 이득으로 연결", "html": "\n\u003cdiv class=\"equation\">$$A_{CM,SE}=-G_mR_{out}\\approx-\\frac{r_{o3}}{2r_{o5}}$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>한 출력 기준 공통 모드 이득\u003c/strong>은 큰 $g_mr_o$, 몸체 효과 무시 및 $2g_{m1}r_{o1}r_{o5}\\gg r_{o3}$에서 다음과 같아요.\u003c/p>\u003cdiv class=\"equation\">$$\\boxed{A_{CM,SE}\\approx-\\frac{r_{o3}}{2r_{o5}}}$$\u003c/div>\u003cp>완전 대칭인 원 그림의 두 단자 차동 출력은 $A_{CM,DM}=(v_{out1}-v_{out2})/v_{CM}=0$이에요.\u003c/p>", "paginate": true}}, {"id": "2018-2_중간-Q3", "kind": "기출", "number": "3", "title": "pmos 전류원 부하와 캐스코드 테일을 가진 MOS 차동 증폭기의 차동 이득과 A_CM", "section": "2018-2 중간고사 · 20점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>다음 회로에 대해 주어진 조건을 이용하여 질문에 답하시오.\u003c/p>\u003cp>: $V_{DD} = 1.8\\ \\text{V}$, $I_{D5} = I_{D6} = 1\\ \\text{mA}$, $(W/L)_{1,2} = 200/0.2$, $(W/L)_{3,4} = 400/0.2$, $(W/L)_{5,6} = 400/0.2$, $\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$, $\\lambda_n = \\lambda_p = 0.1\\ \\text{V}^{-1}$. 이 때, $g_m r_o \\gg 1$로 가정한다.\u003c/p>\u003cp>(1) 차동 전압 이득을 구하시오.\u003c/p>\u003cp>(2) Common-mode 이득($A_{CM} = \\Delta V_{out,CM}/\\Delta V_{in,CM}$)을 구하시오.\u003c/p>", "conditions": "\u003cul>\u003cli>$V_{DD} = 1.8\\ \\text{V}$\u003c/li>\u003cli>$I_{D5} = I_{D6} = 1\\ \\text{mA}$\u003c/li>\u003cli>$(W/L)_{1,2} = 200/0.2$, $(W/L)_{3,4} = 400/0.2$, $(W/L)_{5,6} = 400/0.2$\u003c/li>\u003cli>$\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$\u003c/li>\u003cli>$\\lambda_n = \\lambda_p = 0.1\\ \\text{V}^{-1}$\u003c/li>\u003cli>$g_m r_o \\gg 1$로 가정\u003c/li>\u003cli>바이어스 전압 $V_{b1}$–$V_{b3}$ 값은 주어지지 않음\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>(1) 차동 전압 이득\u003c/li>\u003cli>(2) Common-mode 이득 $A_{CM} = \\Delta V_{out,CM}/\\Delta V_{in,CM}$\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+wAAANUCAYAAAApQKeQAA 를 나눠 쓰므로, 반쪽 소스에는 꼬리 출력 저항의 두 배가 달린다. 꼬리가 $M_5$–$M_6$ 캐스코드라 이 저항은 매우 크다\u003c/li>\u003c/ul>"}], "solution": {"steps": [{"label": "(1) DM 반회로와 첫 식", "html": "\n\u003cp>DM 자극은 $v_{in1}=v_{id}/2$, $v_{in2}=-v_{id}/2$예요. P는 가상 접지이므로 왼쪽은 부하가 $r_{o1}\\parallel r_{o3}$인 공통 소스(common-source, CS) 단이에요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\frac{v_{o1}}{v_{id}/2}=-g_{m1}(r_{o1}\\parallel r_{o3})$$\u003c/div>\n"}, {"label": "(1) 동작 전류와 소신호 파라미터", "html": "\n\u003cp>대칭인 평형 상태에서 입력쌍과 PMOS 부하의 전류는 각각 테일 전류의 절반이에요. 먼저 $100\\,\\mu\\mathrm{A/V^2}=0.1\\,\\mathrm{mA/V^2}$로 바꾸어요.\u003c/p>\n\u003cdiv class=\"equation\">$$I_{D1}=I_{D2}=I_{D3}=I_{D4}=\\frac{1\\,\\mathrm{mA}}2=0.5\\,\\mathrm{mA}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_{m1}=g_{m2}=\\sqrt{2(0.1\\,\\mathrm{mA/V^2})(200/0.2)(0.5\\,\\mathrm{mA})}=10\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r_{o1}=r_{o2}=r_{o3}=r_{o4}=\\frac1{(0.1\\,\\mathrm{V^{-1}})(0.5\\,\\mathrm{mA})}=20\\,\\mathrm{k\\Omega}$$\u003c/div>\n"}, {"label": "(1) 두 반회로를 차동 출력으로 합치기", "html": "\n\u003cdiv class=\"equation\">$$r_{o1}\\parallel r_{o3}=20\\,\\mathrm{k\\Omega}\\parallel20\\,\\mathrm{k\\Omega}=10\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{o1}=-g_{m1}(r_{o1}\\parallel r_{o3})\\frac{v_{id}}2$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{o2}=+g_{m1}(r_{o1}\\parallel r_{o3})\\frac{v_{id}}2$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{DM}=\\frac{v_{o1}-v_{o2}}{v_{id}}=-g_{m1}(r_{o1}\\parallel r_{o3})=-(10\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})=-100$$\u003c/div>\n"}, {"label": "(2) CM 반회로의 실제 연결", "html": "\n\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 0 660 370\" role=\"img\" aria-label=\"CM 반회로. 왼쪽 입력 vCM, 제어원 왼쪽, ro1 오른쪽, 부하 ro3와 출력 맨 오른쪽. 공통 소스 P 아래 2RSS가 접지에 연결된다.\">\n\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M55 145 H145 M235 85 H570 M235 85 V125 M235 175 V235 H380 M380 125 V85 M380 175 V235 M235 235 V265 M235 305 V330 M220 330 H250 M225 336 H245 M231 342 H239 M485 85 V125 M485 175 V210 M470 210 H500 M475 216 H495 M481 222 H489\"/>\n\u003ccircle class=\"fig-ink\" fill=\"none\" cx=\"235\" cy=\"150\" r=\"25\"/>\n\u003cpath class=\"fig-ink\" fill=\"none\" d=\"M235 134 V165 M229 157 L235 165 L241 157\"/>\n\u003crect class=\"fig-ink\" fill=\"none\" x=\"370\" y=\"125\" width=\"20\" height=\"50\"/>\n\u003crect class=\"fig-ink\" fill=\"none\" x=\"475\" y=\"125\" width=\"20\" height=\"50\"/>\n\u003crect class=\"fig-ink\" fill=\"none\" x=\"225\" y=\"265\" width=\"20\" height=\"40\"/>\n\u003ctext class=\"fig-text\" x=\"86\" y=\"131\">+\u003c/text>\u003ctext class=\"fig-text\" x=\"86\" y=\"170\">−\u003c/text>\n\u003ctext class=\"fig-text\" x=\"110\" y=\"174\">vgs1\u003c/text>\u003ctext class=\"fig-text\" x=\"160\" y=\"199\">gm1 vgs1\u003c/text>\n\u003ctext class=\"fig-text\" x=\"399\" y=\"155\">ro1\u003c/text>\u003ctext class=\"fig-text\" x=\"511\" y=\"155\">ro3\u003c/text>\u003ctext class=\"fig-text\" x=\"266\" y=\"292\">2RSS\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"55\" cy=\"145\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"vin\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"38\" y=\"117\" fill=\"#2563eb\" stroke=\"none\" data-node=\"vin\" data-node-color=\"blue\">vCM\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"235\" cy=\"235\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"p\" data-node-color=\"red\"/>\n\u003ctext class=\"fig-text\" x=\"174\" y=\"245\" fill=\"#dc2626\" stroke=\"none\" data-node=\"p\" data-node-color=\"red\">vP\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"380\" cy=\"235\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"p\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"235\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"380\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"485\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"570\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"535\" y=\"61\" fill=\"#2563eb\" stroke=\"none\" data-node=\"out\" data-node-color=\"blue\">vo1 (+)\u003c/text>\n\u003c/svg>\u003cfigcaption>CM 전압 이득을 구하는 왼쪽 반회로예요. 출력은 외부 무부하이고 $r_{o3}$는 내부 부하예요. 입력 $v_{CM}$은 $M_1$의 게이트 제어 전압을 정하며, $v_{gs1}=v_{CM}-v_P$예요. $r_{o1}$을 포함한 CS 블록에 알려진 축퇴 이득의 큰 $g_mr_o$ 근사를 적용해요. DM에서는 같은 그림의 P를 접지로 바꾸어요.\u003c/figcaption>\u003c/figure>\n\u003cp>캐스코드 테일은 $g_{m5}r_{o5}r_{o6}\\gg r_{o5},r_{o6}$에서 알려진 주항 블록으로 써요.\u003c/p>\n\u003cdiv class=\"equation\">$$R_{SS}\\approx g_{m5}r_{o5}r_{o6}$$\u003c/div>\n\u003cp>CM 반회로의 큰 $g_{m1}r_{o1}$ 축퇴 CS 이득을 적용할 첫 식은 다음과 같아요. 이는 유한 $r_{o1}$ 모델의 주항 근사예요.\u003c/p>\n\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{r_{o3}}{1/g_{m1}+2R_{SS}}$$\u003c/div>\n"}, {"label": "(2) 캐스코드 테일의 주항 저항", "html": "\n\u003cdiv class=\"equation\">$$g_{m5}=g_{m6}=\\sqrt{2(0.1\\,\\mathrm{mA/V^2})(400/0.2)(1\\,\\mathrm{mA})}=20\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r_{o5}=r_{o6}=\\frac1{(0.1\\,\\mathrm{V^{-1}})(1\\,\\mathrm{mA})}=10\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g_{m5}r_{o6}=(20\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})=200\\gg1$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{SS}\\approx(20\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})(10\\,\\mathrm{k\\Omega})=2000\\,\\mathrm{k\\Omega}=2\\,\\mathrm{M\\Omega}$$\u003c/div>\n"}, {"label": "(2) CM 축퇴 이득에 대입", "html": "\n\u003cdiv class=\"equation\">$$\\frac1{g_{m1}}=\\frac1{10\\,\\mathrm{mS}}=0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$2R_{SS}\\approx4000\\,\\mathrm{k\\Omega}\\gg0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM}\\approx-\\frac{20\\,\\mathrm{k\\Omega}}{0.1\\,\\mathrm{k\\Omega}+4000\\,\\mathrm{k\\Omega}}\\approx-5.00\\times10^{-3}$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp>\u003cstrong>$A_{DM}=-100\\,\\mathrm{V/V}$\u003c/strong>예요. 왼쪽−오른쪽 출력과 왼쪽−오른쪽 입력을 사용한 대칭 소신호 이득이에요.\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp>\u003cstrong>$A_{CM}\\approx-5.00\\times10^{-3}\\,\\mathrm{V/V}$\u003c/strong>예요. $g_mr_o\\gg1$의 주항, 캐스코드 테일 $R_{SS}\\approx2\\,\\mathrm{M\\Omega}$, 완전 대칭인 포화 소신호 동작 조건이에요.\u003c/p>", "paginate": true}}, {"id": "E10.27", "kind": "예제", "number": "10.27", "title": "이미터 축퇴 테일 전류원을 가진 바이폴라 쌍의 A_CM−DM", "section": "10.5 공통 모드 제거", "book_page": 546, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [], "html": {"original": "\u003cp>그림 10.48에 보인 회로의 $A_{CM-DM}$을 구하라. $Q_1$과 $Q_2$의 $V_A = \\infty$라고 가정한다.\u003c/p>", "conditions": "\u003cul>\u003cli>$Q_1$과 $Q_2$의 $V_A = \\infty$\u003c/li>\u003cli>$A_{CM-DM}$: 입력 공통 모드 변화가 차동 출력으로 바뀌는 이득 $A_{CM-DM} = \\left|\\Delta V_{out}/\\Delta V_{CM}\\right|$, $\\Delta V_{out}$은 차동 출력 변화\u003c/li>\u003cli>식 (10.191): 부하 미스매치 $\\Delta R_D$, 테일 출력 저항 $R_{SS}$인 MOS 쌍에서 $A_{CM-DM} = \\dfrac{\\Delta R_D}{1/g_m + 2R_{SS}}$\u003c/li>\u003cli>$Q_3$의 $V_A$는 유한 (답에 $r_{O3}$가 들어감)\u003c/li>\u003cli>소자 값은 주어지지 않음 (답은 기호로)\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>회로의 $A_{CM-DM}$\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAATQAAAEkCAIAAAAuNVpTAAAACXBIWXMAABYlAAAWJQFJUiTwAACfCUlEQVR4nOx993cTV9fu9z/c3+793iR0G9uSu1Vs03vvhGbTwfRQQkIJCQQIJHQCmBp6IHQIkBBC7x13dVluVKtXS3fvs2fGco0BO7Z5tdZeWtJoNJo55zxn973/R2UrCVCAAtQA6X/q/Q4CFKAAVUoBcAYoQA2UAuAMUIAaKAXAGaAANVAKgDNAAWqgFABngALUQCkAzgAFqIFSAJx1ThprdaS0IVXzk3q//9olpa3yR65AHiKNwwcfcyxuhdWjtHq0Nq/G7NKb3fCa6/QprW6FzQ2vOqun0OItKHbDleFMOF9l9wLhr+Bqdq/S76+V73Ab9UkBcNYy1WT6q/q2ehgTUP/xnAZOqho/Mp2gAJjBaYBDeHX41BbPtQzV0k07gO6p89T2EiCtrURvK1mxceeKdduP3rgPP9G7ffRDem2kFABnLVNVO7Q/ZdtLqeIV/nFBf0xUEwwDwNQOX7bZhVzU7Dp54/5nETKgE1fuAMNUmpx6h2/P2T+bR8iDohJuKnKRu1pLAMbAWuH1nTaLBkUBcNY 를 인가한다. 제어 전류원 왼쪽, ro3 오른쪽, 이미터 아래 R1과 rpi3가 병렬이다.\">\n\u003cpath class=\"fig-ink\" d=\"M40 130 V210 M30 210 H50 M34 216 H46 M38 222 H42 M110 140 H180 M110 140 V150 M110 190 V210 H270 M270 140 V150 M270 190 V210 M180 55 H475 M180 55 V90 M180 130 V140 H325 M325 55 V80 M325 120 V140 M180 210 V230 M168 230 H192 M173 236 H187 M178 242 H182\"/>\n\u003crect class=\"fig-ink\" x=\"102\" y=\"150\" width=\"16\" height=\"40\"/>\u003crect class=\"fig-ink\" x=\"262\" y=\"150\" width=\"16\" height=\"40\"/>\u003crect class=\"fig-ink\" x=\"317\" y=\"80\" width=\"16\" height=\"40\"/>\n\u003cpolygon class=\"fig-ink\" points=\"180,90 194,110 180,130 166,110\"/>\u003cpath class=\"fig-ink\" d=\"M180 98 V121 M175 115 L180 121 L185 115 M455 42 H400 M407 37 L400 42 L407 47\"/>\n\u003ccircle cx=\"475\" cy=\"55\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"t\" data-node-color=\"blue\"/>\u003ctext x=\"445\" y=\"27\" fill=\"#2563eb\" data-node=\"t\" data-node-color=\"blue\">Vₜ (+)\u003c/text>\n\u003ccircle cx=\"180\" cy=\"140\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"e3\" data-node-color=\"red\"/>\u003ctext x=\"193\" y=\"158\" fill=\"#dc2626\" data-node=\"e3\" data-node-color=\"red\">vₑ₃\u003c/text>\n\u003ccircle cx=\"325\" cy=\"55\" r=\"3\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"t\" data-node-color=\"blue\"/>\u003ccircle cx=\"325\" cy=\"140\" r=\"3\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"e3\" data-node-color=\"red\"/>\n\u003ctext class=\"fig-text\" x=\"416\" y=\"76\">iₜ ←\u003c/text>\u003ctext class=\"fig-text\" x=\"348\" y=\"108\">rO₃\u003c/text>\u003ctext class=\"fig-text\" x=\"199\" y=\"108\">gₘ₃vπ₃ ↓\u003c/text>\u003ctext class=\"fig-text\" x=\"64\" y=\"176\">rπ₃\u003c/text>\u003ctext class=\"fig-text\" x=\"286\" y=\"176\">R₁\u003c/text>\u003ctext class=\"fig-text\" x=\"25\" y=\"112\">b₃ = 0\u003c/text>\n\u003ccircle cx=\"270\" cy=\"140\" r=\"3\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"e3\" data-node-color=\"red\"/>\u003ccircle cx=\"180\" cy=\"210\" r=\"3\" fill=\"currentColor\" data-ground-branch=\"true\"/>\u003c/svg>\u003cfigcaption>$V_b$와 전원은 AC 접지예요. $Q_3$의 베이스 입력을 영점으로 놓고 오른쪽 컬렉터에 시험전압을 가해 $R_{out3}=V_t/i_t$로 읽어요. $v_{\\pi3}=-v_{e3}$이며 $R_1,r_{\\pi3}$는 같은 이미터–접지 사이예요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$R_e^*=R_1\\parallel r_{\\pi3}$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{out3}\\approx[1+g_{m3}R_e^*]r_{O3}$$\u003c/div>\n\u003cp>버린 추가 가산 저항항이 주항보다 작도록 $R_e^*\\ll[1+g_{m3}R_e^*]r_{O3}$일 때 쓰는 근사예요. $g_{m3}R_e^*\\gg1$은 주어지지 않았으므로 대괄호의 1은 유지해요.\u003c/p>\n"}, {"label": "CM 반회로에서 가지 전류", "html": "\n\u003cfigure class=\"figure\">\u003csvg viewBox=\"0 -20 520 320\" role=\"img\" aria-label=\"CM 입력이 왼쪽 베이스에 연결되고 오른쪽 컬렉터에 부하 RCj가 접지로 연결된 반회로. 이미터 아래에는 2Rout3가 있다.\">\n\u003cpath class=\"fig-ink\" d=\"M40 132 H115 M115 110 V155 M215 55 H470 M215 55 V96 M215 144 V190 M215 190 V215 M215 255 V275 M203 275 H227 M208 281 H222 M213 287 H217 M370 55 V35 M370 5 V0 M358 0 H382 M362 -6 H378 M367 -12 H373\"/>\n\u003ccircle class=\"fig-ink\" cx=\"215\" cy=\"120\" r=\"24\"/>\u003cpath class=\"fig-ink\" d=\"M215 106 V134 M210 128 L215 134 L220 128\"/>\n\u003crect class=\"fig-ink\" x=\"362\" y=\"5\" width=\"16\" height=\"30\"/>\u003crect class=\"fig-ink\" x=\"207\" y=\"215\" width=\"16\" height=\"40\"/>\n\u003ccircle cx=\"40\" cy=\"132\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"in\" data-node-color=\"blue\"/>\u003ctext x=\"25\" y=\"108\" fill=\"#2563eb\" data-node=\"in\" data-node-color=\"blue\">ΔvCM\u003c/text>\n\u003ccircle cx=\"215\" cy=\"190\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"p\" data-node-color=\"red\"/>\u003ctext x=\"229\" y=\"192\" fill=\"#dc2626\" data-node=\"p\" data-node-color=\"red\">ΔvP\u003c/text>\n\u003ccircle cx=\"370\" cy=\"55\" r=\"3\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\u003ccircle cx=\"470\" cy=\"55\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\u003ctext x=\"414\" y=\"36\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\">Δvout,j\u003c/text>\n\u003ctext class=\"fig-text\" x=\"247\" y=\"123\">gₘ₁(ΔvCM − ΔvP)\u003c/text>\u003ctext class=\"fig-text\" x=\"237\" y=\"240\">2Rout₃\u003c/text>\u003ctext class=\"fig-text\" x=\"390\" y=\"25\">RC,j\u003c/text>\u003ctext class=\"fig-text\" x=\"170\" y=\"174\">ΔiC ↓\u003c/text>\n\u003c/svg>\u003cfigcaption>출력은 무부하 전압을 읽어요. $V_{CC}$는 AC 접지이며 $R_{C,1}=R_C$, $R_{C,2}=R_C+\\Delta R_C$예요. $V_A=\\infty$라 입력쌍의 $r_O$는 없고, 큰 $\\beta$로 입력쌍 베이스 전류만 생략해요. $Q_3$의 $r_{\\pi3}$는 앞의 테일 블록 안에 남아 있어요.\u003c/figcaption>\u003c/figure>\n\u003cp>양의 $\\Delta i_C$는 컬렉터에서 이미터로 흘러요. 큰 $\\beta$에서 이미터 전류도 이에 가까우므로 이미터 상승분이 제어 전압에서 빠져요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\Delta v_P\\approx2R_{out3}\\Delta i_C$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta i_C=g_{m1}(\\Delta v_{CM}-\\Delta v_P)$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta i_C(1+2g_{m1}R_{out3})\\approx g_{m1}\\Delta v_{CM}$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta i_C\\approx\\frac{\\Delta v_{CM}}{1/g_{m1}+2R_{out3}}$$\u003c/div>\n"}, {"label": "부하 전압과 차동 출력", "html": "\n\u003cp>AC 접지에서 저항을 따라 전압이 떨어져 두 출력은 모두 내려가요. $v_{od}=v_{out1}-v_{out2}$로 정해요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\Delta v_{out1}=-R_C\\Delta i_C$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta v_{out2}=-(R_C+\\Delta R_C)\\Delta i_C$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta v_{od}=-R_C\\Delta i_C+(R_C+\\Delta R_C)\\Delta i_C=\\Delta R_C\\Delta i_C$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM-DM}=\\left|\\frac{\\Delta v_{od}}{\\Delta v_{CM}}\\right|\\approx\\frac{|\\Delta R_C|}{1/g_{m1}+2R_{out3}}$$\u003c/div>\n"}], "answer": "\n\u003cp>\u003cstrong>CM 입력에서 차동 출력으로 새는 이득의 크기\u003c/strong>는 다음과 같아요. 원문처럼 $\\Delta R_C\\ge0$로 읽으면 절댓값을 빼도 돼요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\boxed{A_{CM-DM}\\approx\\frac{|\\Delta R_C|}{\\dfrac1{g_{m1}}+2[1+g_{m3}(R_1\\parallel r_{\\pi3})]r_{O3}}}$$\u003c/div>\n\u003cp>입력쌍의 $V_A=\\infty$와 큰 $\\beta$, 동일한 $g_m$, $R_e^*\\ll[1+g_{m3}R_e^*]r_{O3}$인 소신호 활성 영역 모델이에요. $Q_3$의 $r_{\\pi3}$와 대괄호의 1은 보존했어요.\u003c/p>\n", "paginate": true}}, {"id": "E10.28", "kind": "예제", "number": "10.28", "title": "그림 10.48 회로의 CMRR", "section": "10.5 공통 모드 제거", "book_page": 547, "difficulty": null, "sol": null, "original_lang": "ko", "depends_on": [{"id": "E10.27", "in_file": true}], "html": {"original": "\u003cp>그림 10.48 회로의 CMRR을 계산하라.\u003c/p>", "conditions": "\u003cul>\u003cli>예제 10.27의 가정($Q_1$, $Q_2$의 $V_A = \\infty$) 유지\u003c/li>\u003cli>식 (10.195): $\\text{CMRR} = A_{DM}/A_{CM-DM}$, $A_{DM}$은 차동 이득\u003c/li>\u003cli>예제 10.27의 결과: $A_{CM-DM} = \\dfrac{\\Delta R_C}{\\dfrac{1}{g_{m1}} + 2\\{[1 + g_{m3}(R_1 \\| r_{\\pi 3})] r_{O3} + R_1 \\| r_{\\pi 3}\\}}$\u003c/li>\u003cli>소자 값은 주어지지 않음 (답은 기호로)\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>회로의 CMRR\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAATQAAAEkCAIAAAAuNVpTAAAACXBIWXMAABYlAAAWJQFJUiTwAACfCUlEQVR4nOx993cTV9fu9z/c3+793iR0G9uSu1Vs03vvhGbTwfRQQkIJCQQIJHQCmBp6IHQIkBBC7x13dVluVKtXS3fvs2fGco0BO7Z5tdZeWtJoNJo55zxn973/R2UrCVCAAtQA6X/q/Q4CFKAAVUoBcAYoQA2UAuAMUIAaKAXAGaAANVAKgDNAAWqgFABngALUQCkAzgAFqIFSAJx1ThprdaS0IVXzk3q//9olpa3yR65AHiKNwwcfcyxuhdWjtHq0Nq/G7NKb3fCa6/QprW6FzQ2vOqun0OItKHbDleFMOF9l9wLhr+Bqdq/S76+V73Ab9UkBcNYy1WT6q/q2ehgTUP/xnAZOqho/Mp2gAJjBaYBDeHX41BbPtQzV0k07gO6p89T2EiCtrURvK1mxceeKdduP3rgPP9G7ffRDem2kFABnLVNVO7Q/ZdtLqeIV/nFBf0xUEwwDwNQOX7bZhVzU7Dp54/5nETKgE1fuAMNUmpx6h2/P2T+bR8iDohJuKnKRu1pLAMbAWuH1nTaLBkUBcNYJVTP9NUGv8h1PblTk46m6ARTOB6SpGOcESRWZp9XzUFfYVCxtFi7be/xCLiDQ7tVa3B0GjoCDC1duIGQKJAA1AM4AlegtvmpIYyUqPb++oVJf4KxuDP3P11tKVGY3IBOkDI3LB0KsptgBHLJVuPznX47mmzyAzz2nLn4aLhW36ZpR8DbH7ALVFHiskumoeDUrp7g2OgqAs5aJx2FJpVTDnbtR7OvvR++qmurMHp0dwQzgzLK7c8zOPJu3Q++hLUPifliT+sLszX3jSOw9BMC5ds9h+AoEYJKBEf/MIAQfq9ks6n1AqqEAOOuTlI3fwPOB9I/bVq4V5VLAGIBT4fJqnT5glcMnzGwtli/65seiN65ffvsdRFx5z4Fqk1PLjLpkp1UyG6+SicSE1QA4/9spy8GRYPIpXQp2T0USfAYBI =\"fig-ink\" d=\"M180 113 V137 M174 131 L180 137 L186 131\" fill=\"none\"/>\n\u003ccircle class=\"fig-dot\" cx=\"35\" cy=\"85\" r=\"4\" fill=\"#2563eb\" stroke=\"#2563eb\" data-node=\"in\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"28\" y=\"61\" fill=\"#2563eb\" data-node=\"in\" data-node-color=\"blue\">vπ₁ = vᵢd / 2\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"180\" cy=\"70\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"out1\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"280\" cy=\"70\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"out1\" data-node-color=\"red\"/>\n\u003ccircle class=\"fig-dot\" cx=\"400\" cy=\"70\" r=\"4\" fill=\"#dc2626\" stroke=\"#dc2626\" data-node=\"out1\" data-node-color=\"red\"/>\n\u003ctext class=\"fig-text\" x=\"350\" y=\"48\" fill=\"#dc2626\" data-node=\"out1\" data-node-color=\"red\">vout₁\u003c/text>\n\u003ctext class=\"fig-text\" x=\"105\" y=\"170\">gₘ₁vπ₁\u003c/text>\u003ctext class=\"fig-text\" x=\"303\" y=\"127\">R꜀\u003c/text>\n\u003ctext class=\"fig-text\" x=\"298\" y=\"206\">P: 가상 접지\u003c/text>\n\u003ccircle cx=\"230\" cy=\"205\" r=\"3\" fill=\"currentColor\" data-ground-branch=\"true\"/>\u003c/svg>\u003cfigcaption>왼쪽 DM 반회로예요. $V_{CC}$는 AC 접지, $P$는 가상 접지예요. 큰 $\\beta$로 입력 베이스 전류를 무시하고 $r_{O1}=\\infty$를 적용했어요. 출력 부하는 $R_C$이며 출력은 단락하지 않아요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$\\frac{v_{out1}}{v_{id}/2}\\approx-g_{m1}R_C$$\u003c/div>\n"}, {"label": "차동 이득의 크기", "html": "\n\u003cdiv class=\"equation\">$$v_{od}\\approx-g_{m1}R_C\\frac{v_{id}}2-g_{m1}R_C\\frac{v_{id}}2=-g_{m1}R_Cv_{id}$$\u003c/div>\n\u003cdiv class=\"equation\">$$|A_{DM}|\\approx g_{m1}R_C$$\u003c/div>\n"}, {"label": "테일 근사와 공통 모드 누출", "html": "\n\u003cdiv class=\"equation\">$$R_E^*=R_1\\parallel r_{\\pi3}$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{SS}\\approx[1+g_{m3}R_E^*]r_{O3}\\qquad\\bigl(R_E^*\\ll[1+g_{m3}R_E^*]r_{O3}\\bigr)$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM-DM}\\approx\\frac{|\\Delta R_C|}{1/g_{m1}+2R_{SS}}$$\u003c/div>\n"}, {"label": "정의에 대입하여 정리", "html": "\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{g_{m1}R_C}{|\\Delta R_C|}(1/g_{m1}+2R_{SS})$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{R_C}{|\\Delta R_C|}(1+2g_{m1}R_{SS})$$\u003c/div>\n"}], "answer": "\n\u003cp>\u003cstrong>작은 미스매치·큰 입력쌍 $\\beta$·$Q_1,Q_2$의 $V_A=\\infty$와 위 가산항 생략 조건에서의 CMRR이에요.\u003c/strong>\u003c/p>\n\u003cdiv class=\"equation\">$$\\boxed{\\mathrm{CMRR}\\approx\\frac{R_C}{|\\Delta R_C|}\\left\\{1+2g_{m1}[1+g_{m3}(R_1\\parallel r_{\\pi3})]r_{O3}\\right\\}}$$\u003c/div>\n", "paginate": true}}, {"id": "P10.70", "kind": "장말문제", "number": "10.70", "title": "부하 미스매치 ΔR_D가 있는 Fig 10.91 (a)(b) 두 단의 CMRR 비교", "section": "10.5 Common-Mode Rejection", "book_page": 565, "difficulty": 1, "sol": false, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>Compute the common-mode rejection ratio of the stages illustrated in Fig. 10.91 and compare the results. For simplicity, neglect channel-length modulation in $M_1$ and $M_2$ but not in other transistors.\u003c/p>", "conditions": "\u003cul>\u003cli>간단히 하기 위해 $M_1$, $M_2$의 채널 길이 변조는 무시, 다른 트랜지스터의 채널 길이 변조는 무시하지 않음\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>(a), (b) 각 단의 공통 모드 제거비(CMRR)\u003c/li>\u003cli>두 결과를 비교\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjoAAAEQCAIAAAA29UlaAAAACXBIWXMAABYlAAAWJQFJUiTwAAC1r0lEQVR4nOx9h18UyfP27795vwebl12yAUXMgGIORHPO6YyAOYtEczrDnXqennrmiATTmbOYzpwDaaffZ6Z3e3tmlgUU0V22PvMZhtkJPdVd9VRVV3f/H/GRj3zkIx/56Ken//vRBfCRj3zkIx/5qHrywZWPfOQjH/nIA8gHVz7ykY985CMPIB9c+chHPvKRjzyAfHDlIx/5yEc+8gDywZWP6p5sEilOCoLA7+mBj3zko9qSS/liVFFRQQ+8T8R8cOWjOqaSkofFxecKC4txXFlpF5jy8vKCgoIzZ868fPmSSpoPsXzko68gHqguX74MWbt48RI7A5F6//5jUVERZO3Dhw9eJmI+uPJRHVNe3kqNRqfV6j9+/EzPVFTYtm37w2AwWa3WFy9esCvdWIg+8pGP3BDFoQkTJul0hhYtWsIupMKE07Nnz4UAtmzZ0vssQh9c+aiOac/u/QHmIH8//X9PXlRWiPIDWYqMjIJc5eTkEdH 3ccircle cx=\"70\" cy=\"180\" r=\"23\"/>\n\u003cpath d=\"M250 90H440 M250 90V120 M250 180V220 M250 220V250 M250 290V330 M237 330H263 M241 337H259 M245 344H255\"/>\n\u003cpath d=\"M250 120L275 150L250 180L225 150Z M250 133V165 M244 157L250 165L256 157\"/>\n\u003cpath d=\"M250 250L240 255L260 265L240 275L260 285L250 290\"/>\n\u003cpath d=\"M440 90V80L430 75L450 65L430 55L440 50V30 M427 30H453 M431 23H449 M435 16H445 M440 90H580\"/>\n\u003c/g>\n\u003ccircle class=\"fig-dot\" cx=\"70\" cy=\"135\" r=\"4\" fill=\"#2563eb\" data-node=\"in\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"25\" y=\"116\" fill=\"#2563eb\" data-node=\"in\" data-node-color=\"blue\">vCM\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"250\" cy=\"220\" r=\"4\" fill=\"#dc2626\" data-node=\"P\" data-node-color=\"red\"/>\n\u003ctext class=\"fig-text\" x=\"268\" y=\"226\" fill=\"#dc2626\" data-node=\"P\" data-node-color=\"red\">vP = 2iRSS\u003c/text>\n\u003ccircle class=\"fig-dot\" cx=\"440\" cy=\"90\" r=\"4\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ccircle class=\"fig-dot\" cx=\"580\" cy=\"90\" r=\"4\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\"/>\n\u003ctext class=\"fig-text\" x=\"565\" y=\"69\" fill=\"#2563eb\" data-node=\"out\" data-node-color=\"blue\">vo\u003c/text>\n\u003cg class=\"fig-text\" fill=\"currentColor\">\u003ctext x=\"64\" y=\"174\">+\u003c/text>\u003ctext x=\"64\" y=\"195\">−\u003c/text>\u003ctext x=\"288\" y=\"156\">gm(vCM − vP)\u003c/text>\u003ctext x=\"285\" y=\"183\">i ↓\u003c/text>\u003ctext x=\"274\" y=\"278\">2RSS\u003c/text>\u003ctext x=\"465\" y=\"63\">RL\u003c/text>\u003c/g>\n\u003c/svg>\u003cfigcaption>CM 전압이득 반회로예요. 외부 출력 부하는 없고 $R_L$은 원래의 드레인 부하($R_D$ 또는 $R_D+\\Delta R_D$)예요. $M_1,M_2$의 $r_o$만 원문에 따라 생략했어요. (a) $R_{SS}=r_{o3}$, (b) $R_{SS}\\approx g_{m3}r_{o3}r_{o4}$인 테일 블록을 넣어요. (b)의 곱 항 근사는 $g_{m3}r_{o3}r_{o4}\\gg r_{o3},r_{o4}$일 때 써요.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"equation\">$$i=g_m(v_{CM}-v_P)=g_m(v_{CM}-2iR_{SS})$$\u003c/div>\n"}, {"label": "공통 모드 전류와 차동 누출", "html": "\n\u003cdiv class=\"equation\">$$\\frac{i}{v_{CM}}=\\frac{g_m}{1+2g_mR_{SS}}=\\frac{1}{1/g_m+2R_{SS}}$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{out1}=-iR_D$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{out2}=-i(R_D+\\Delta R_D)$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{od}=v_{out1}-v_{out2}=i\\Delta R_D$$\u003c/div>\n\u003cdiv class=\"equation\">$$|A_{CM-DM}|=\\frac{|\\Delta R_D|}{1/g_m+2R_{SS}}$$\u003c/div>\n"}, {"label": "차동 이득과 일반 CMRR", "html": "\n\u003cdiv class=\"equation\">$$v_{out1}=-g_mR_D\\frac{v_{id}}2$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{out2}=+g_m(R_D+\\Delta R_D)\\frac{v_{id}}2$$\u003c/div>\n\u003cdiv class=\"equation\">$$|A_{DM}|=g_m\\left(R_D+\\frac{\\Delta R_D}{2}\\right)$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}=\\left|\\frac{R_D+\\Delta R_D/2}{\\Delta R_D}\\right|(1+2g_mR_{SS})$$\u003c/div>\n\u003cp>두 부하는 양의 저항이며 $\\Delta R_D\\ne0$이에요. $|\\Delta R_D|\\ll R_D$를 추가할 때만 수업의 작은 미스매치 식으로 줄어요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}\\approx\\frac{R_D}{|\\Delta R_D|}(1+2g_mR_{SS})$$\u003c/div>\n"}, {"label": "두 테일 저항의 대입과 비교", "html": "\n\u003cdiv class=\"equation\">$$R_{SS,a}=r_{o3}$$\u003c/div>\n\u003cdiv class=\"equation\">$$R_{SS,b}\\approx g_{m3}r_{o3}r_{o4}\\qquad(g_{m3}r_{o3}r_{o4}\\gg r_{o3},r_{o4})$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{\\mathrm{CMRR}_b}{\\mathrm{CMRR}_a}\\approx\\frac{1+2g_mg_{m3}r_{o3}r_{o4}}{1+2g_mr_{o3}}$$\u003c/div>\n\u003cp>같은 입력쌍 $g_m$과 부하, 같은 $r_{o3}$로 비교해요. 추가로 $2g_mr_{o3}\\gg1$이면 CMRR의 개선 배율도 약 $g_{m3}r_{o4}$예요. 이 조건 없이 무조건 같은 배율이라고 쓰지는 않아요.\u003c/p>\n"}], "answer": "\n\u003cp>\u003cstrong>(a) 단일 테일\u003c/strong>\u003c/p>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}_a=\\left|\\frac{R_D+\\Delta R_D/2}{\\Delta R_D}\\right|(1+2g_mr_{o3})$$\u003c/div>\n\u003cp>\u003cstrong>(b) 캐스코드 테일\u003c/strong>\u003c/p>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}_b\\approx\\left|\\frac{R_D+\\Delta R_D/2}{\\Delta R_D}\\right|(1+2g_mg_{m3}r_{o3}r_{o4})$$\u003c/div>\n\u003cp>(b)는 $g_{m3}r_{o3}r_{o4}\\gg r_{o3},r_{o4}$인 주항 근사예요. 두 결과 모두 입력쌍 일치, $r_{o1},r_{o2}\\to\\infty$, 포화 소신호 모델이에요. $|\\Delta R_D|\\ll R_D$이면 앞 인자를 $R_D/|\\Delta R_D|$로 근사해요. 같은 $g_m,r_{o3}$와 부하에서 (b)가 CM 누출을 줄여 CMRR을 높이며, $2g_mr_{o3}\\gg1$이면 개선 배율은 약 $g_{m3}r_{o4}$예요.\u003c/p>\n", "paginate": true}}, {"id": "2015-2_중간-Q3", "kind": "기출", "number": "3", "title": "부하 저항 불일치가 있는 MOS 차동쌍의 차동·공통 모드 이득과 CMRR", "section": "2015-2 중간고사 · 30점", "book_page": null, "difficulty": null, "sol": null, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>With device parameters,\u003c/p>\u003cp>$\\mu_n C_{ox} = 100\\ \\text{uA/V}^2$, $\\mu_p C_{ox} = 50\\ \\text{uA/V}^2$, $\\lambda_n=0.1\\ \\text{V}^{-1}$, $\\lambda_p=0.2\\ \\text{V}^{-1}$, $V_{TH,N}=0.4\\text{V}$, $R_D=10\\text{kohm}$, $V_{b1}=0.6\\text{V}$, $(W/L)_1=(W/L)_2=50$, $(W/L)_3=100$\u003c/p>\u003cp>1) Doubling $(W/L)_3$ increases differential input range ( O / X ) (5pt)\u003c/p>\u003cp>2) Calculate differential gain $A_{DM}$ when $\\Delta R_D=0$ (5pt)\u003c/p>\u003cp>3) Calculate common-mode gain $A_{CM}$ when $\\Delta R_D=0$ (5pt)\u003c/p>\u003cp>4) Calculate common-mode input to differential output gain $A_{CM-DM}$ when $\\Delta R_D/R_D=1\\%$ (5pt)\u003c/p>\u003cp>5) Calculate CMRR (5pt)\u003c/p>\u003cp>6) Calculate CMRR if $(W/L)_3$ is doubled. (5pt)\u003c/p>", "conditions": "\u003cul>\u003cli>$\\mu_n C_{ox} = 100\\ \\mu\\text{A/V}^2$, $\\mu_p C_{ox} = 50\\ \\mu\\text{A/V}^2$ (원문 표기는 \"uA/V²\")\u003c/li>\u003cli>$\\lambda_n = 0.1\\ \\text{V}^{-1}$, $\\lambda_p = 0.2\\ \\text{V}^{-1}$\u003c/li>\u003cli>$V_{TH,N} = 0.4\\ \\text{V}$\u003c/li>\u003cli>$R_D = 10\\ \\text{k}\\Omega$\u003c/li>\u003cli>$V_{b1} = 0.6\\ \\text{V}$\u003c/li>\u003cli>$(W/L)_1 = (W/L)_2 = 50$, $(W/L)_3 = 100$\u003c/li>\u003cli>2) 전용: $\\Delta R_D = 0$\u003c/li>\u003cli>3) 전용: $\\Delta R_D = 0$\u003c/li>\u003cli>4) 전용: $\\Delta R_D / R_D = u003c/p>\n\u003cdiv class=\"equation\">$$|v_{id}|_{\\rm cutoff}=\\sqrt{\\frac{2I_{SS}}{\\mu_nC_{ox}(W/L)_1}}=\\sqrt{0.08}\\,\\mathrm V\\approx0.28\\,\\mathrm V$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{|v'_{id}|_{\\rm cutoff}}{|v_{id}|_{\\rm cutoff}}=\\sqrt2$$\u003c/div>\n\u003cp>두 배 후 경계는 $0.4\\,\\mathrm V$이므로 \u003cb>O\u003c/b>예요. 전후 모두 포화·테일 전류원 동작이 유지되어야 해요.\u003c/p>\n"}, {"label": "(2) DM 가상 접지와 이득", "html": "\u003cp>$\\Delta R_D=0$, 입력쌍 $r_o$ 무시인 수업 모델이에요.\u003c/p>\u003cdiv class=\"equation\">$$A_{DM}=-g_{m1}R_D=-(1\\,\\mathrm{mS})(10\\,\\mathrm{k\\Omega})=-10$$\u003c/div>"}, {"label": "(3) CM 반회로의 축퇴 이득", "html": "\u003cp>$\\Delta R_D=0$, $r_{o1},r_{o2}$ 무시·$r_{o3}$ 유지예요. 각 출력은 같은 이득으로 움직여요.\u003c/p>\u003cdiv class=\"equation\">$$A_{CM}=-\\frac{R_D}{1/g_{m1}+2r_{o3}}=-\\frac{10}{1+100}\\approx-9.9\\times10^{-2}$$\u003c/div>"}, {"label": "(4) 부하 차이가 만드는 양의 누출", "html": "\n\u003cdiv class=\"equation\">$$\\Delta R_D=0.01R_D=0.1\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{od}=(-R_D\\Delta i_D)-[-(R_D+\\Delta R_D)\\Delta i_D]=\\Delta R_D\\Delta i_D$$\u003c/div>\n\u003cdiv class=\"equation\">$$A_{CM-DM}=\\frac{\\Delta R_D}{1/g_{m1}+2r_{o3}}=\\frac{0.1}{101}\\approx+9.9\\times10^{-4}$$\u003c/div>"}, {"label": "(5) 동일 차동 출력의 이득 비", "html": "\u003cp>1% 불일치에서, 분자는 수업의 대칭 기준 $A_{DM}=-10$을 사용해요.\u003c/p>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}=\\frac{|A_{DM}|}{|A_{CM-DM}|}=\\frac{10}{0.1/101}=10100$$\u003c/div>\u003cdiv class=\"equation\">$$\\mathrm{CMRR}_{dB}=20\\log_{10}(10100)\\approx80.09\\,\\mathrm{dB}$$\u003c/div>"}, {"label": "(6) 전류 증가와 테일 저항 감소를 함께 반영", "html": "\n\u003cdiv class=\"equation\">$$I'_{SS}=0.4\\,\\mathrm{mA}$$\u003c/div>\n\u003cdiv class=\"equation\">$$g'_{m1}=\\sqrt2\\,\\mathrm{mS}\\approx1.41\\,\\mathrm{mS}$$\u003c/div>\n\u003cdiv class=\"equation\">$$r'_{o3}=25\\,\\mathrm{k\\Omega}$$\u003c/div>\n\u003cdiv class=\"equation\">$$A'_{DM}=-10\\sqrt2\\approx-14.14$$\u003c/div>\n\u003cdiv class=\"equation\">$$A'_{CM-DM}=\\frac{0.1}{1/\\sqrt2+50}\\approx1.97\\times10^{-3}$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}'=100(1+50\\sqrt2)\\approx7171.07$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\mathrm{CMRR}'_{dB}\\approx77.11\\,\\mathrm{dB}$$\u003c/div>"}], "answer": "\u003cp>\u003cstrong>(1)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>O: 경계 약 $\\pm0.28\\to\\pm0.4\\,\\mathrm V$, $\\sqrt2$배\u003c/b> ($V_{b1}$ 고정·포화·테일 동작).\u003c/p>\u003cp>\u003cstrong>(2)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$A_{DM}=-10$\u003c/b> (대칭·입력 $r_o$ 무시).\u003c/p>\u003cp>\u003cstrong>(3)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$A_{CM}\\approx-9.9\\times10^{-2}$\u003c/b> (각 출력·대칭·입력 $r_o$ 무시·테일 유지).\u003c/p>\u003cp>\u003cstrong>(4)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$A_{CM-DM}\\approx+9.9\\times10^{-4}$\u003c/b> (1%·좌−우·입력 $r_o$ 무시).\u003c/p>\u003cp>\u003cstrong>(5)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>CMRR $=10100$ / $80.09\\,\\mathrm{dB}$\u003c/b> (1%·대칭 기준 $A_{DM}$).\u003c/p>\u003cp>\u003cstrong>(6)\u003c/strong>\u003c/p>\u003cp data-answer-final=\"\">\u003cb>$\\mathrm{CMRR}'\\approx7171.07$ / $77.11\\,\\mathrm{dB}$\u003c/b> ($V_{b1}$ 고정·테일 폭 2배·1%·수업 모델).\u003c/p>", "paginate": true}}, {"id": "P10.71", "kind": "장말문제", "number": "10.71", "title": "PMOS 전류 거울(Fig 10.92)의 소신호 이득 v_out/i_1, (W/L)_3 = N(W/L)_4", "section": "10.6 Differential Pair with Active Load", "book_page": 565, "difficulty": 0, "sol": true, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>Determine the small-signal gain $v_{out}/i_1$ in the circuit of Fig. 10.92 if $(W/L)_3 = N(W/L)_4$. Neglect channel-length modulation.\u003c/p>", "conditions": "\u003cul>\u003cli>$(W/L)_3 = N(W/L)_4$\u003c/li>\u003cli>채널 길이 변조 무시\u003c/li>\u003cli>$i_1$은 $I_1$의 소신호 성분으로 보임\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>소신호 이득 $v_{out}/i_1$\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;ba Rₗ\u003c/text>\n\u003ccircle class=\"fig-dot\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"#dc2626\" cx=\"300\" cy=\"65\" r=\"3.5\"/>\n\u003ccircle class=\"fig-dot\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"#dc2626\" cx=\"400\" cy=\"65\" r=\"3.5\"/>\n\u003ccircle class=\"fig-dot\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"#dc2626\" cx=\"470\" cy=\"65\" r=\"3.5\"/>\n\u003ctext class=\"fig-text\" data-node=\"out\" data-node-color=\"red\" fill=\"#dc2626\" stroke=\"none\" x=\"404\" y=\"49\">vₒᵤₜ (+)\u003c/text>\n\u003ccircle cx=\"118\" cy=\"195\" r=\"3\" fill=\"currentColor\" data-ground-branch=\"true\"/>\u003ccircle cx=\"350\" cy=\"195\" r=\"3\" fill=\"currentColor\" data-ground-branch=\"true\"/>\u003c/svg>\u003cfigcaption>$V_{DD}$는 AC 접지예요. $M_3$는 다이오드 등가저항, $M_4$는 $v_g$로 제어되는 공급 전류원으로 바꿨어요. $\\lambda=0$이므로 $r_{o3},r_{o4}$ 가지는 없고, 실제 부하 $R_L$은 남겨요. 두 신호 노드는 게이트의 제어 관계로 연결되며 도선으로 단락되지 않아요.\u003c/figcaption>\u003c/figure>\n\u003cp>$v_g$ 노드에서 아래로 나가는 전류는 전류원의 $i_1$과 저항의 $g_{m3}v_g$예요. 두 전류를 더해 0으로 놓아요.\u003c/p>\n\u003cdiv class=\"equation\">$$i_1+g_{m3}v_g=0$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_g=-\\frac{i_1}{g_{m3}}$$\u003c/div>\n"}, {"label": "같은 과구동 전압에서 전류비와 gm비", "html": "\n\u003cdiv class=\"equation\">$$\\frac{I_{D4}}{I_{D3}}=\\frac{(W/L)_4}{(W/L)_3}=\\frac1N$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\frac{g_{m4}}{g_{m3}}=\\frac{2I_{D4}/V_{OV}}{2I_{D3}/V_{OV}}=\\frac1N$$\u003c/div>\n"}, {"label": "복사 공급 전류와 실제 부하의 출력 KCL", "html": "\n\u003cp>$M_4$가 출력으로 공급하는 소신호 전류를 $i_4$라 두면 다음과 같아요.\u003c/p>\n\u003cdiv class=\"equation\">$$i_4=g_{m4}v_{sg4}=-g_{m4}v_g=\\frac{g_{m4}}{g_{m3}}i_1=\\frac{i_1}{N}$$\u003c/div>\n\u003cp>출력 노드에서 $R_L$로 나가는 전류와 위로부터 들어오는 $i_4$가 같아요. 출력은 단락하지 않고 $R_L$에 걸린 전압을 구해요.\u003c/p>\n\u003cdiv class=\"equation\">$$\\frac{v_{out}}{R_L}-i_4=0$$\u003c/div>\n\u003cdiv class=\"equation\">$$v_{out}=\\frac{R_L}{N}i_1$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>아래 방향 입력 전류 $i_1$에 대한 트랜스임피던스는 양수예요.\u003c/strong>\u003c/p>\u003cdiv class=\"equation\">$$\\boxed{\\frac{v_{out}}{i_1}=+\\frac{R_L}{N}\\quad[\\Omega]}$$\u003c/div>\u003cp>두 PMOS의 포화 동작·작은 신호·채널 길이 변조 무시와 실제 부하 $R_L$ 조건에서의 결과예요.\u003c/p>", "paginate": true}}, {"id": "P10.72", "kind": "장말문제", "number": "10.72", "title": "PMOS 전류 거울(Fig 10.93)에서 I_1, I_2가 반대로 ΔI 변할 때 V_out 변화", "section": "10.6 Differential Pair with Active Load", "book_page": 566, "difficulty": 0, "sol": false, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>In the circuit shown in Fig. 10.93, $I_1$ changes from $I_0$ to $I_0 + \\Delta I$ and $I_2$ from $I_0$ to $I_0 - \\Delta I$. Neglecting channel-length modulation, calculate $V_{out}$ before and after the change if\u003c/p>\u003cp>(a) $(W/L)_3 = (W/L)_4$.\u003c/p>\u003cp>(b) $(W/L)_3 = 2(W/L)_4$.\u003c/p>", "conditions": "\u003cul>\u003cli>$I_1$은 $I_0$에서 $I_0 + \\Delta I$로, $I_2$는 $I_0$에서 $I_0 - \\Delta I$로 바뀜\u003c/li>\u003cli>채널 길이 변조 무시\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>변화 전과 후의 $V_{out}$을 다음 각 경우에 계산\u003c/li>\u003cli>(a) $(W/L)_3 = (W/L)_4$\u003c/li>\u003cli>(b) $(W/L)_3 = 2(W/L)_4$\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPgAAACcCAIAAADd1vEQAAAACXBIWXMAABYlAAAWJQFJUiTwAAA62UlEQVR4nO19h18UyfP2++f8ZPOSs5gwnzmTEVDUr3pnIJjTGc9Dsvn0vKCIouKd4fTOLGI+c84SDAhI2pn3memd3p7ZBRFYdtnb+vRnGSZ2eLq6qrq6+v/xburKZDKZmjtjffBfpv/n6Ay4qWOI4yy/hNz4ZskN9C5MBMmNjcKfpiaOnuEllHMc19TUxLtB7wZ6l6ZLJVejo+Lj45Lu3X1EzgDudXUNSUmTY2JiiouL2Zs5ltv/98heQOdEov+6OUpryLqWWkbnzRt3tBqjRm345++znPTotm0/GQyeAQFBVVVVzT1IXktfrvguGQRcjOwCdFqDnESKf91kk2gtAWpcKxhw2dt3ep2XWqU/UHRYADrHV3+q6969h0aj++WX36xbhIoxLLI5W/zI9RiTHYFOK0vxr5u+ilpCPMd7efqBqf+0fReOkbZu2QGUDxgwiAju1o/SHkWag20jeqmxsfEL3+2CZEfRRXHgptYQkMfJB8CW7ub4EcPHQHT5cX1WUyNfW9MQ1r03/v3rr5MsVyF6Ki9vFAno5s7QgpnSNci+QKdNRWvWTS3Tl8Etu5ufOmUGkL1k8Qoc5+dtgRgTG5NA5fX6+kZS65LxUfZmxkRjPqbSueuxp05SRl1Sv+lwsh4GOck+2MwD/Mrv1+q0nv+b9m1NdX2AfwiO7997TMQYCnEWtPRtrGnSm $V_{out,\\mathrm{전}}=R_L\\left(\\frac{I_0}{2}-I_0\\right)=-\\frac{I_0R_L}{2}$$\u003c/div>\n\u003cdiv class=\"equation\">$$V_{out,\\mathrm{후}}=R_L\\left[\\frac{I_0+\\Delta I}{2}-(I_0-\\Delta I)\\right]=\\frac{(3\\Delta I-I_0)R_L}{2}$$\u003c/div>\n\u003cdiv class=\"equation\">$$\\Delta V_{out}=V_{out,\\mathrm{후}}-V_{out,\\mathrm{전}}=\\frac32\\Delta I R_L$$\u003c/div>\n"}], "answer": "\u003cp>\u003cstrong>(a)\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>전에는 $V_{out}=0$, 후에는 $V_{out}=2\\Delta I R_L$예요.\u003c/strong> 채널 길이 변조 무시, $M_4$ 포화 및 이상 전류원의 동작 가능 범위에서의 결과예요.\u003c/p>\n\u003cp>\u003cstrong>(b)\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>전에는 $V_{out}=-I_0R_L/2$, 후에는 $V_{out}=(3\\Delta I-I_0)R_L/2$예요.\u003c/strong> 변화량은 $\\Delta V_{out}=1.5\\Delta I R_L$예요. 채널 길이 변조 무시, $M_4$ 포화 및 음의 출력을 포함한 전류원 동작 가능 범위를 전제로 해요.\u003c/p>\n", "paginate": true}}, {"id": "P10.75", "kind": "장말문제", "number": "10.75", "title": "능동 부하 바이폴라 쌍(Fig 10.96)의 이득 100을 위한 pnp Early 전압", "section": "10.6 Differential Pair with Active Load", "book_page": 566, "difficulty": 0, "sol": false, "original_lang": "en", "depends_on": [], "html": {"original": "\u003cp>We wish to design the stage shown in Fig. 10.96 for a voltage gain of 100. If $V_{A,n} = 5\\ \\text{V}$, what is the required Early voltage for the pnp transistors?\u003c/p>", "conditions": "\u003cul>\u003cli>목표 전압 이득 100\u003c/li>\u003cli>$V_{A,n} = 5\\ \\text{V}$\u003c/li>\u003c/ul>", "ask": "\u003cul>\u003cli>pnp 트랜지스터에 필요한 Early 전압\u003c/li>\u003c/ul>"}, "figures": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAADUCAIAAADvHypIAAAACXBIWXMAABYlAAAWJQFJUiTwAABB/ElEQVR4nO1dh1sU19f+/TmfbN9l6UUFuzTBriDFgl1jiTE2mi0aK2CLvbfEWLHEWGk27MYYexcVFaXszvfO3J27d2aX6gLLMu9zn2GYmZ1y73nvOeeWc//HKVBQb1RXV1utVrJDD1osFnKQ3bZ2/K+lX0BBq4RVACdlCFBVVdVCb+RiKMRQUC+ABRYLv1NVZaFHKCorKzkHkrRqKMRQUC98+vSlsLC4oKCotPQDx/Dk1q07Fy8W3Lt3j1wGNWKxWFrwPV0FhRgK6oUnj1+oVXqN2rB/359VlbaDr1+/9fHx02r1+/f/QY4QVngANxRiKKgXQAaD3qzXea//bTMHI0qwo7Ky5qnV2piYWNhXlAuK862gDcFq4T
