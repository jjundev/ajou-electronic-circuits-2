<svg xmlns="http://www.w3.org/2000/svg" width="580" height="346" viewBox="0 0 580 346" role="img" aria-label="왼쪽 (a)는 전체 회로. 위쪽 V DD 가로선에 PMOS M3, M4의 소스가 붙고, 두 PMOS는 게이트가 자기 드레인에 묶인 다이오드 연결이다. 그 아래 NMOS M1, M2의 드레인이 이어지고 두 드레인 노드(색칠된 점)에서 안쪽으로 뻗은 선 끝의 테두리만 있는 원 두 개 사이가 출력 V out이다. 게이트에는 입력 V in1, V in2가 들어간다. 두 소스는 강조색 선으로 묶여 색칠된 점 노드 P에서 만나고, 그 아래 테두리만 있는 원 모양 테일 전류원 I SS를 거쳐 접지로 간다. 오른쪽 (b)는 반회로. 위쪽 강조색 가로선은 AC 접지가 된 V DD이고, 그 아래 다이오드 연결 M3, 출력 v out1 노드, 입력 v in1을 받는 M1이 세로로 놓이며, M1의 소스는 강조색 접지 기호(AC 접지가 된 노드 P)에 닿는다."><style>
