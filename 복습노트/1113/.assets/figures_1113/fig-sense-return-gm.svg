<svg xmlns="http://www.w3.org/2000/svg" width="530" height="345" viewBox="0 0 530 345" role="img" aria-label="출력을 단락한 피드포워드 회로 그림이에요. 위쪽 전원선 V DD 아래에 PMOS M3과 M4가 있고, 왼쪽 M3은 드레인과 게이트가 이어진 다이오드 연결이에요. NMOS M1의 게이트에 왼쪽 파란 점 v in, M2의 게이트에 오른쪽 파란 점 v F가 독립 입력으로 연결돼요. 두 소스가 만나는 빨간 점 v P 아래에 테두리 원 전류원 I SS와 접지가 있어요. 오른쪽 열의 M4 쪽에 아래로 향하는 화살표 i 1, M2 쪽에 아래로 향하는 화살표 i 2가 있고, 빨간 점 출력 노드에서 오른쪽으로 향하는 화살표 i out이 맨 오른쪽 빨간 점 v out 등호 0에 닿아요. 그 점에서 강조색 선으로 그린 단락선이 아래 접지까지 이어져요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
