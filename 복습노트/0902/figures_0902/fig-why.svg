<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="왼쪽 테두리 네모 작은 신호에서 길이 두 갈래로 나뉘어요. 위 길은 붉은 테두리 네모 두 개로, 그냥 선으로 이으면 신호가 그대로 작아요. 아래 길은 강조색 테두리 네모 두 개로, 수도꼭지 부품을 거치면 신호가 크게 커져서 읽을 수 있어요."><style>
