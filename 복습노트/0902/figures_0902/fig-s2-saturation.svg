<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="원점에서 올라가다가 평평해지는 곡선 세 개예요. 문을 활짝 연 강조색 곡선이 가장 높은 곳에서 평평해지고, 반쯤 연 선, 조금 연 선으로 갈수록 더 낮은 곳에서 평평해져요. 가장 높은 곡선의 평평한 부분 위에 색칠된 점이 하나 있어요."><style>
