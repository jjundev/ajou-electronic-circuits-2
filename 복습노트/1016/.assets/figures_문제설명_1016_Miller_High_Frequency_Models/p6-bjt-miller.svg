@font-face { font-family: Pretendard; font-style: normal; font-weight: 600; src: url(data:font/woff;base64,) format('woff'); }

svg { color: #1b2130; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
svg text, svg text[class], svg text tspan, .fig-math, .fig-math tspan { font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal; }
svg tspan[baseline-shift="sub"], svg tspan[baseline-shift="super"] { font-size: 78%; }
svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2f6fdb; }
svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #d92d20; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style>

  <!-- 좌측: 변환 전 -->
  <text class="fig-muted" x="20" y="24" font-size="12">변환 전 (BJT CE 증폭기 + C<tspan baseline-shift="sub">F</tspan>)</text>
  <path class="fig-ink" d="M20 70 H60"/>
  <circle class="fig-dot" data-node-color="blue" cx="60" cy="70" r="4"/>
  <text class="fig-text" x="52" y="60">v<tspan baseline-shift="sub">b</tspan></text>
  <path class="fig-ink" d="M60 70 V85 l-4 3 l8 4 l-8 4 l8 4 l-8 4 l8 4 l-4 3 V125"/>
  <path class="fig-ink" d="M52 125 H68 M55 129 H65 M58 133 H62"/>
  <text class="fig-text" x="38" y="105" font-size="11">r<tspan baseline-shift="sub">π</tspan></text>
  <polygon class="fig-ink" points="75,45 145,70 75,95"/>
  <text class="fig-text" x="80" y="74" font-size="11">A = -g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">C</tspan></text>
  <path class="fig-ink" d="M145 70 H185"/>
  <circle class="fig-dot" data-node-color="red" cx="185" cy="70" r="4"/>
  <text class="fig-text" x="180" y="60">v<tspan baseline-shift="sub">o</tspan></text>
  <path class="fig-accent" d="M60 70 V36 H105 M135 36 H185 V70"/>
  <path class="fig-accent" d="M105 26 V46 M115 26 V46" stroke-width="2.5"/>
  <text class="fig-text" x="102" y="20" font-size="12">C<tspan baseline-shift="sub">F</tspan></text>

  <!-- 중앙 화살표 -->
  <path class="fig-ink" d="M220 70 H255 M247 64 L255 70 L247 76" stroke-width="2"/>
  <text class="fig-muted" x="216" y="92" font-size="11">밀러 분할</text>

  <!-- 우측: 변환 후 -->
  <text class="fig-muted" x="280" y="24" font-size="12">변환 후 (베이스단 등가 병렬망)</text>
  <path class="fig-ink" d="M280 70 H330"/>
  <circle class="fig-dot" data-node-color="blue" cx="330" cy="70" r="4"/>
  <text class="fig-text" x="322" y="60">v<tspan baseline-shift="sub">b</tspan></text>
  <!-- 신호원 저항 R_B + r_pi 병렬 -->
  <path class="fig-ink" d="M330 70 H300 V85 l-4 3 l8 4 l-8 4 l8 4 l-8 4 l8 4 l-4 3 V125"/>
  <path class="fig-ink" d="M292 125 H308 M295 129 H305 M298 133 H302"/>
  <text class="fig-text" x="245" y="105" font-size="11">R<tspan baseline-shift="sub">B</tspan> ‖ r<tspan baseline-shift="sub">π</tspan></text>
  <!-- 밀러 입력 커패시터 -->
  <path class="fig-ink" d="M330 70 H360 V90 M360 100 V125"/>
  <path class="fig-accent" d="M350 90 H370 M350 100 H370" stroke-width="2.5"/>
  <path class="fig-ink" d="M352 125 H368 M355 129 H365 M358 133 H362"/>
  <text class="fig-text" x="372" y="100" font-size="11">C<tspan baseline-shift="sub">in</tspan>=(1+g<tspan baseline-shift="sub">m</tspan>R<tspan baseline-shift="sub">C</tspan>)C<tspan baseline-shift="sub">F</tspan></text>
  <!-- 출력측 커패시터 -->
  <path class="fig-ink" d="M420 70 H470"/>
  <circle class="fig-dot" data-node-color="red" cx="470" cy="70" r="4"/>
  <text class="fig-text" x="465" y="60">v<tspan baseline-shift="sub">o</tspan></text>
  <path class="fig-ink" d="M470 70 V90 M470 100 V125"/>
  <path class="fig-accent" d="M460 90 H480 M460 100 H480" stroke-width="2.5"/>
  <path class="fig-ink" d="M462 125 H478 M465 129 H475 M468 133 H472"/>
  <text class="fig-text" x="485" y="100" font-size="11">C<tspan baseline-shift="sub">out</tspan></text>

</svg>