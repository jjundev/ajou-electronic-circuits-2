<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="가로축은 V CE, 세로축은 I C인 그래프예요. 선으로 그린 곡선 세 개가 원점 근처에서 짧게 선형으로 오르다가 평평해지고, 가장 위 곡선은 강조색 선이에요. 왼쪽 짧은 구간은 점선으로 나뉘어 안 쓰는 영역이라고 적혀 있고, 평평한 구간은 순방향 활성 영역이라고 적혀 있어요."><style>
