<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="선으로 그린 네모 세 칸이 n, p, n 순서로 붙어 있어요. 왼쪽 n 칸에서 컬렉터 C 단자가, 가운데 p 칸에서 강조색 선으로 베이스 B 단자가, 오른쪽 n 칸에서 에미터 E 단자가 나와요. 각 단자 아래에 MOSFET의 드레인 D, 게이트 G, 소스 S가 대응한다고 적혀 있어요."><style>
