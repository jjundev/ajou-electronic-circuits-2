<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-label="왼쪽 소신호 전원 v_cc의 위 단자가 위쪽 선으로 R_C 위 끝에 연결되고, R_C 아래 끝이 출력 노드 v_out이에요. v_out에서 접지로 Q₁의 제어 전류원 g_m·v_be와 r_o가 병렬로 내려가요. 베이스와 이미터가 모두 AC 접지라 v_be = 0이고, 화살표는 v_out에서 R_C 위쪽, 제어 전류원 아래쪽, r_o 아래쪽으로 나가는 방향이에요."><style>
