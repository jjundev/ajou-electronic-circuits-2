<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="차동쌍 소신호 등가회로. 위쪽 AC 접지 선에서 두 저항 R D가 내려와 출력 노드 v out1, v out2에 닿는다. 각 출력 노드와 노드 P 사이에 마름모 모양 종속 전류원 g m1 v1, g m2 v2가 있다. 두 소스는 강조색 선으로 노드 P에서 만나고, 노드 P는 색칠된 점이며 아래로 접지 경로가 없다. 입력 v in1, v in2는 테두리만 있는 원에서 선으로 게이트 노드(색칠된 점)에 이어진다. 각 게이트 노드 아래 테두리만 있는 원은 노드 P로 이어진 소스 단자이고, 둘 사이에 위가 +, 아래가 −인 제어 전압 v1, v2가 표시되어 있으며 그 사이는 개방이다. 종속 전류원 g m1 v1, g m2 v2는 이 v1, v2에 의존한다."><style>
