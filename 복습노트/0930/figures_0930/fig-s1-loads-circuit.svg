<svg xmlns="http://www.w3.org/2000/svg" width="470" height="244" viewBox="0 0 470 244" role="img" aria-label="PMOS 부하 두 가지를 나란히 그린 회로도. 두 트랜지스터 모두 소스가 위쪽 V DD 가로선에 붙고 드레인이 아래로 내려와 테두리만 있는 원으로 표시한 출력 노드에 닿는다. 왼쪽 M3는 게이트에서 나온 강조색 선이 아래로 돌아 드레인 선의 색칠된 점에 묶인 다이오드 연결 부하이고, 아래에 저항 1/g m, 작다고 적혀 있다. 오른쪽 M3는 게이트가 강조색 선으로 테두리만 있는 강조색 원 단자 V b에 이어진 전류원 부하이고, 아래에 저항 r O, 크다고 적혀 있다."><style>
