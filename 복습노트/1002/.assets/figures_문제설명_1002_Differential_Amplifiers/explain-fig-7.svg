</tspan>v<tspan baseline-shift="sub" font-size="10">π1</tspan></text><text class="fig-text" x="212" y="116">r<tspan baseline-shift="sub" font-size="10">O1</tspan></text><text class="fig-muted" x="212" y="134">(= r<tspan baseline-shift="sub" font-size="10">t</tspan>)</text><text class="fig-text" x="272" y="230">r<tspan baseline-shift="sub" font-size="10">π1</tspan></text><text class="fig-text" x="332" y="230">r<tspan baseline-shift="sub" font-size="10">O2</tspan></text><text class="fig-text" x="392" y="230">r<tspan baseline-shift="sub" font-size="10">O3</tspan></text><text class="fig-text" x="248" y="208" text-anchor="middle">−</text><text class="fig-text" x="248" y="256" text-anchor="middle">+</text><text class="fig-text" x="244" y="234" text-anchor="end">v<tspan baseline-shift="sub" font-size="10">π1</tspan></text><text class="fig-muted" x="320" y="302" text-anchor="middle">r<tspan baseline-shift="sub" font-size="10">e</tspan> = r<tspan baseline-shift="sub" font-size="10">π1</tspan> ∥ r<tspan baseline-shift="sub" font-size="10">O2</tspan> ∥ r<tspan baseline-shift="sub" font-size="10">O3</tspan></text><text class="fig-muted" x="250" y="90">v<tspan baseline-shift="sub" font-size="10">π1</tspan> = −v<tspan baseline-shift="sub" font-size="10">x</tspan></text></svg>
