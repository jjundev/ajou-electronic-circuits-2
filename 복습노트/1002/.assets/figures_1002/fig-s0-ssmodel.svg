<svg xmlns="http://www.w3.org/2000/svg" width="530" height="280" viewBox="0 0 530 280" role="img" aria-label="BJT 차동쌍의 소신호 등가회로. 양쪽 끝에 입력 전압원 v in1, v in2가 있고, 각각 베이스에서 r 파이를 거쳐 가운데 노드 P로 내려온다. 컬렉터에서 P로 향하는 종속 전류원 g m v 파이가 있고, 컬렉터와 위쪽 AC 접지 사이에 R C가 있다. 컬렉터가 출력 v out1, v out2이다. r 파이1에서 P를 지나 r 파이2로 가는 경로가 강조색 선이고, P는 색칠된 점이다. P 아래 테일은 개방이다."><style>
