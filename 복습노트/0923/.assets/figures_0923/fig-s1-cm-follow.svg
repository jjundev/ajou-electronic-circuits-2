<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="가로축은 두 입구 높이, 세로축은 높이인 그래프. 선으로 그린 입구 높이 직선과 점선으로 그린 묶인 곳 높이 직선이 같은 간격을 두고 나란히 오르고, 강조색 수평선인 나오는 곳 높이는 그대로인 그림"><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
