<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="가운데 소신호 전원 v_cc의 위 단자가 위쪽 선으로 R_C1과 R_C2의 위 끝에 함께 연결되고, 아래 단자는 접지 선에 연결돼요. R_C1 아래 끝이 노드 X, R_C2 아래 끝이 노드 Y예요. X에서 접지로 r_o1과 Q₁의 제어 전류원 g_m1·v_be1이, Y에서 접지로 r_o2와 Q₂의 제어 전류원 g_m2·v_be2가 병렬로 내려가요. 두 베이스와 이미터가 AC 접지라 v_be1 = v_be2 = 0이고, 출력은 v_out = v_X − v_Y예요. 화살표는 각 노드에서 나가는 전류 방향이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
