<g text-anchor="middle" font-family="Pretendard, sans-serif" font-weight="600">
<text class="fig-text" x="170" y="26" font-size="14">문제: 레이저 밝기가 흔들려요</text>
<text class="fig-muted fig-math" x="170" y="46" font-size="12"><tspan>g</tspan><tspan baseline-shift="sub" font-size="78%">m</tspan><tspan>·I</tspan><tspan baseline-shift="sub" font-size="78%">D</tspan><tspan>가 ±20%까지 달라져요</tspan></text>
<text class="fig-text" x="170" y="110" font-size="14">해법: 출력 전류를 재서 되돌려요</text>
<text class="fig-muted fig-math" x="170" y="130" font-size="12">1% 이내로 정한 K가 이득을 정해요</text>
<text class="fig-text" x="170" y="194" font-size="14">한계: 감지 저항이 개루프를 바꿔요</text>
<text class="fig-muted" x="170" y="214" font-size="12">복제를 달아 로딩 효과를 개루프에 남겨요</text>
<text class="fig-text" x="170" y="278" font-size="14">다음 문제: 내 채널 주파수만 골라요</text>
<text class="fig-muted" x="170" y="298" font-size="12">고주파 무선 신호는 아날로그 필터로 걸러요</text>
</g></svg>
