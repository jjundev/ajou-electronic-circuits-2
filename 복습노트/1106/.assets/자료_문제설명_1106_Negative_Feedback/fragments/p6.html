<div data-subpart="main"><h4>오차 전압에서 저항비 이득까지</h4><div data-answer-step="비교부의 오차"><p><span class="loc">㉠</span> 분배점 전압 $X_F=KY$가 반전 입력으로 돌아와요. $E=X-X_F$와 $Y=A_1E$를 합치면 오차의 상대 크기가 정해져요.</p>$$E/X=1/(1+KA_1)$$
</div><div data-answer-final=""><p>$KA_1\gg1$이면 $E/X$가 작아져 분배점 전압이 입력을 따라가요. $KY\simeq X$를 출력에 대해 풀면 이득이 저항비로 정해져요.</p>$$Y/X\simeq 1/K=1+R_1/R_2$$
</div></div>
