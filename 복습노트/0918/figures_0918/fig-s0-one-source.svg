<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-label="왼쪽 강조색 테두리 상자에 기준 하나라고 적혀 있고, 여기서 오른쪽 선 테두리 상자 세 개로 화살표가 뻗어요. 세 상자에는 그대로, 열 배, 십분의 일이 적혀 있어요."><style>
