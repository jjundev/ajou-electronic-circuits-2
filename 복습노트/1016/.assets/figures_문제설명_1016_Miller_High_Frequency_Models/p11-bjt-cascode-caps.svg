@font-face { font-family: Pretendard; font-style: normal; font-weight: 600; src: url(data:font/woff;base64,) format('woff'); }

svg { color: #1b2130; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
svg text, svg text[class], svg text tspan, .fig-math, .fig-math tspan { font-family: Pretendard, sans-serif; font-weight: 600; font-style: normal; }
svg tspan[baseline-shift="sub"], svg tspan[baseline-shift="super"] { font-size: 78%; }
svg :is(.fig-dot, .fig-text)[data-node-color="blue"] { fill: #2f6fdb; }
svg :is(.fig-dot, .fig-text)[data-node-color="red"] { fill: #d92d20; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style>

  <!-- 세 주요 노드 축 -->
  <!-- 1. 입력 노드 Vin -->
  <circle class="fig-dot" data-node-color="blue" cx="80" cy="50" r="5"/>
  <text class="fig-text" x="65" y="38" font-size="13">입력 V<tspan baseline-shift="sub">in</tspan></text>
  <path class="fig-ink" d="M40 50 H80"/>

  <!-- 2. 중간 노드 X -->
  <circle class="fig-dot" cx="280" cy="50" r="5"/>
  <text class="fig-text" x="268" y="38" font-size="13">중간 노드 X</text>

  <!-- 3. 출력 노드 Vout -->
  <circle class="fig-dot" data-node-color="red" cx="480" cy="50" r="5"/>
  <text class="fig-text" x="465" y="38" font-size="13">출력 V<tspan baseline-shift="sub">out</tspan></text>
  <path class="fig-ink" d="M480 50 H520"/>

  <!-- 커패시터 연결선들 -->
  <!-- Q1 커패시터 3개 -->
  <!-- C_pi1: Vin - 접지 -->
  <path class="fig-ink" d="M80 50 V85 M80 95 V125"/>
  <path class="fig-accent" d="M70 85 H90 M70 95 H90" stroke-width="2.5"/>
  <path class="fig-ink" d="M72 125 H88 M75 129 H85 M78 133 H82"/>
  <text class="fig-text" x="38" y="95" font-size="11">C<tspan baseline-shift="sub">π1</tspan></text>

  <!-- C_mu1: Vin - X (부유 피드백) -->
  <path class="fig-accent" d="M80 50 V15 H170 M190 15 H280 V50"/>
  <path class="fig-accent" d="M170 5 V25 M180 5 V25" stroke-width="2.5"/>
  <text class="fig-text" x="168" y="38" font-size="11">C<tspan baseline-shift="sub">μ1</tspan> (입력-X)</text>

  <!-- C_CS1: X - 접지 -->
  <path class="fig-ink" d="M260 50 V85 M260 95 V125"/>
  <path class="fig-accent" d="M250 85 H270 M250 95 H270" stroke-width="2.5"/>
  <path class="fig-ink" d="M252 125 H268 M255 129 H265 M258 133 H262"/>
  <text class="fig-text" x="220" y="95" font-size="11">C<tspan baseline-shift="sub">CS1</tspan></text>

  <!-- Q2 커패시터 3개 -->
  <!-- C_pi2: X - 베이스(접지) -->
  <path class="fig-ink" d="M300 50 V85 M300 95 V125"/>
  <path class="fig-accent" d="M290 85 H310 M290 95 H310" stroke-width="2.5"/>
  <path class="fig-ink" d="M292 125 H308 M295 129 H305 M298 133 H302"/>
  <text class="fig-text" x="314" y="95" font-size="11">C<tspan baseline-shift="sub">π2</tspan></text>

  <!-- C_mu2: Vout - 베이스(접지) -->
  <path class="fig-ink" d="M460 50 V85 M460 95 V125"/>
  <path class="fig-accent" d="M450 85 H470 M450 95 H470" stroke-width="2.5"/>
  <path class="fig-ink" d="M452 125 H468 M455 129 H465 M458 133 H462"/>
  <text class="fig-text" x="420" y="95" font-size="11">C<tspan baseline-shift="sub">μ2</tspan></text>

  <!-- C_CS2: Vout - 기판(접지) -->
  <path class="fig-ink" d="M500 50 V85 M500 95 V125"/>
  <path class="fig-accent" d="M490 85 H510 M490 95 H510" stroke-width="2.5"/>
  <path class="fig-ink" d="M492 125 H508 M495 129 H505 M498 133 H502"/>
  <text class="fig-text" x="514" y="95" font-size="11">C<tspan baseline-shift="sub">CS2</tspan></text>

  <!-- 노드별 묶음 캡션 -->
  <text class="fig-muted" x="200" y="165" font-size="12">중간점 총 커패시턴스: C<tspan baseline-shift="sub">X</tspan> = C<tspan baseline-shift="sub">CS1</tspan> + C<tspan baseline-shift="sub">π2</tspan></text>
  <text class="fig-muted" x="200" y="188" font-size="12">출력단 총 커패시턴스: C<tspan baseline-shift="sub">Y</tspan> = C<tspan baseline-shift="sub">μ2</tspan> + C<tspan baseline-shift="sub">CS2</tspan></text>

</svg>