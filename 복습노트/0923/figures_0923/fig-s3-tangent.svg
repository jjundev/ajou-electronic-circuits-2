<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-label="가로축은 양쪽을 미는 힘의 차이, 세로축은 물 흐름의 차이. 가운데를 지나는 S자 곡선과, 가운데에서 곡선에 닿는 강조색 곧은 선이 있다. 가운데 색칠된 점 근처에서는 두 선이 거의 겹치고, 멀어질수록 벌어진다."><style>
