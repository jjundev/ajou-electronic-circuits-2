<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" role="img" aria-label="텔레스코픽 캐스코드 반회로. 위에서부터 V_DD(AC 접지)와 v_z 사이에 M₇의 r_p, v_z와 v_o 사이에 M₅의 제어 전류원 g_mp v_sg5(v_z에서 v_o로, v_sg5 = v_z)와 r_p, v_o와 v_x 사이에 M₃의 g_mn v_gs3(v_o에서 v_x로, v_gs3 = −v_x)와 r_n, v_x와 접지 사이에 M₁의 g_mn v_i와 r_n이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
