<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="왼쪽에 선만 있는 상자 두 개가 위아래로 있어요. 위 상자에는 보통 것 +2, 아래 상자에는 반대 것 −2라고 적혀 있어요. 두 상자에서 나온 선이 오른쪽의 강조색 테두리 상자 하나로 모이고, 그 상자에는 크기 2, 규칙 하나라고 적혀 있어요."><style>
