<svg xmlns="http://www.w3.org/2000/svg" width="340" height="262" viewBox="0 0 340 262" role="img" aria-label="극점 평면이에요. 가로축은 실수부 시그마, 세로축은 허수부 제이 오메가예요. 원점을 중심으로 반지름 오메가 엔인 반원을 점선으로 그렸어요. 극점 한 쌍이 실수축 가까이에서 출발해 반원을 따라 위아래 끝으로 올라가는 선이 있고, Q 증가 화살표가 그 방향을 가리켜요. 원점에서 극점 하나까지 반지름 선을 긋고 오메가 엔이라고 적었어요. 반원의 위아래 끝, 허수축 위의 플러스 마이너스 제이 오메가 엔에는 불안정을 뜻하는 엑스 표시가 있어요. 모든 도형은 선으로만 그렸어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
