<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-label="위에서 아래로 이어지는 흐름도. 첫째 테두리 상자는 차이는 크게 키우고 같이 오는 소음은 버리고 싶다는 내용이에요. 화살표를 따라 둘째 상자는 위험색 테두리로, 저항으로 키우면 전기가 모자란다는 내용이에요. 셋째 테두리 상자는 문지기를 달고 한 층 더 쌓아 키운다는 내용이에요. 넷째 상자는 강조색 테두리로, 가운데 받침을 단단히 해서 소음이 새는 것을 막는다는 내용이에요. 맨 아래에 대신 전기 여유가 줄고 부품이 늘어난다는 글이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
