<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="선으로 그린 가로축과 세로축 위에 가로로 평평한 점선과, 오른쪽으로 갈수록 살짝 올라가는 강조색 곧은 선이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
