<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Q₁ 출력 노드 v_t와 이미터 노드 v_e 사이에 v_t에서 v_e 방향의 제어 전류원 g_m1·v_π1과 r_o1이 병렬로 있고, 시험 전류원 i_t가 접지에서 v_t 노드로 전류를 넣어요. v_e에서 접지로 r_π1(접지된 Q₁ 베이스), r_o2(Q₂), r_o3(Q₃)가 병렬로 연결되며, r_π1 양단 전압 v_π1은 베이스(접지) 쪽이 +, v_e 쪽이 −라서 v_π1 = −v_e예요."><style>
