<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="두 경우의 물 막대 두 개씩. 입구가 낮을 때와 높을 때 모두 왼쪽 막대와 오른쪽 막대의 높이가 같고, 두 경우의 막대 높이도 서로 같다. 막대는 선으로만 그린 테두리이고, 입구 높이는 막대 옆의 짧은 가로선으로 나타냈다."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
