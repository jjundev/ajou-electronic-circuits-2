<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" role="img" aria-label="왼쪽은 물통 아래 수도꼭지와 동그란 손잡이가 있고, 아래로 늘 같은 양의 물이 강조색 화살표로 흘러요. 오른쪽 그래프는 손잡이를 돌린 정도에 따라 나오는 물의 양을 보여 주는데, 점선 곧은 선이 아니라 위로 휘어진 강조색 선을 따라가요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
