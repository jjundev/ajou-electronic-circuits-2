<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-label="선으로 그린 똑같은 ㄱ자 수도꼭지 두 개가 나란히 있어요. 왼쪽 수도꼭지는 색칠된 손잡이가 위에 있고 강조색 물줄기 화살표 선이 아래로 떨어져요. 오른쪽 수도꼭지는 왼쪽을 위아래로 뒤집은 모양이라 손잡이가 아래에 있고 물줄기 화살표 선이 위로 올라가요."><style>
