<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="캐스코드의 소신호 등가회로예요. 위쪽 출력 노드와 가운데 노드 X 사이에 마름모 모양 종속 전류원 g m1 v gs1(아래 방향)과 저항 r O1이 병렬로 있고, 점선 테두리로 M1 자리라고 묶여 있어요. X와 접지 사이에는 저항 r O2 하나가 점선 테두리로 M2 자리라고 묶여 있어요. 오른쪽에는 강조색 원으로 그린 테스트 전압 v X가 출력에 걸려 있고, 강조색 화살표 i X가 출력 노드로 들어가요."><style>
