</style><rect x="0" y="0" width="440" height="258" rx="10" fill="#ffffff"/><rect width="440" height="258" fill="#ffffff"/><text x="18" y="30" fill="#111827" font-size="22">출력에 남는 전류는 두 변화의 합</text><text x="18" y="60" fill="#1d4ed8" font-size="20">1. 왼쪽 입력 가지: +1 μA</text><text x="32" y="86" fill="#111827" font-size="20">거울 → 출력으로 +1 μA 공급</text><text x="18" y="124" fill="#1d4ed8" font-size="20">2. 오른쪽 입력 가지: −1 μA</text><text x="32" y="150" fill="#111827" font-size="20">출력에서 빠지는 전류 1 μA 감소</text><text x="18" y="188" fill="#1d4ed8" font-size="20">3. 출력 순전류 증가</text><text x="32" y="214" fill="#111827" font-size="20">+1 μA − (−1 μA) = +2 μA</text></svg>
