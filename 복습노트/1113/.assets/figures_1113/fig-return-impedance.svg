<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" role="img" aria-label="두 그림이 나란히 있어요. 왼쪽은 입력 V in이 테두리 원 합산기의 플러스 입력으로 들어가 테두리 사각형 증폭기로 가고, 왼쪽을 향한 테두리 삼각형 귀환 회로망 K의 출력 V F가 강조선으로 합산기의 마이너스 입력에 직렬로 들어가요. K 출력을 오른쪽으로 가리키는 화살표 아래에 0이 적혀 있고 맨 아래에 전압원처럼 직렬이라고 적혀 있어요. 오른쪽은 접지에서 위로 흐르는 테두리 원 전류원 I in이 입력 노드로 가고, 같은 노드에서 아래로 I F가 강조선을 따라 테두리 삼각형 K의 출력으로 빠져요. K 출력을 오른쪽으로 가리키는 화살표 아래에 무한대가 적혀 있고 맨 아래에 전류원처럼 병렬이라고 적혀 있어요. V in, V F, 입력 노드에는 색칠된 점이 있어요"><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
