<svg xmlns="http://www.w3.org/2000/svg" width="380" height="222" viewBox="0 0 380 222" role="img" aria-label="전압 증폭기 회로예요. 왼쪽 입력 v in이 공통 소스 M1의 게이트로 들어가고, M1 소스는 접지, 드레인은 R D를 거쳐 위쪽 V DD에 이어져요. M1 드레인 노드는 오른쪽 소스 팔로워 M2의 게이트에 이어지고, M2 드레인은 V DD, 소스는 아래 전류원을 거쳐 접지로 가요. M2 소스가 오른쪽 출력 v out이에요. 입력 아래에는 오른쪽을 향한 화살표와 R in = 무한대, 출력 아래에는 왼쪽을 향한 화살표와 R out 약 1/g m2를 적었어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
