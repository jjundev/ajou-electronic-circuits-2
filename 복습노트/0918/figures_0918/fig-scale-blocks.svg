<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="두 칸으로 나뉜 그림이에요. 왼쪽은 선으로 그린 기준 상자 1개 옆에 강조색 테두리 상자 3개를 나란히 둬서 세 배가 흐르는 모습이에요. 오른쪽은 기준 쪽에 강조색 테두리 상자 3개를 두고 복사 상자는 1개라서 셋으로 나눈 한 몫이 흐르는 모습이에요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
