<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="선으로 그린 가로축과 세로축 위에 오른쪽으로 갈수록 점점 가파르게 휘어 올라가는 곡선이 있어요. 곡선 위 한 곳에 색칠된 점이 있고, 그 점에서 곡선에 살짝 닿는 곧은 강조색 선이 지나가요."><style>
