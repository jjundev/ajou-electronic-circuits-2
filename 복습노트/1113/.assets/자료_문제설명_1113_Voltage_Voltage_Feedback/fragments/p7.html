<h4>입력에서 빠지는 전류의 변화</h4>
<div data-answer-step="입력 전류 변화가 한 바퀴 도는 방향">
<p><span class="loc">㉠</span> $i_{in}$이 늘어 $v_X$가 올라가면 $M_1$의 드레인 전류가 늘어요. <span class="loc">㉡</span> $R_{D1}$의 전압 강하가 커지면서 $v_{out}$이 내려가요.</p>
<p>$v_{out}$은 소스가 접지된 $M_2$의 게이트 전압이에요. 이 전압이 내려가면 $M_2$가 $X$에서 빼는 전류도 줄어요.</p>
</div>
