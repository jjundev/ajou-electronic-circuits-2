<svg xmlns="http://www.w3.org/2000/svg" width="400" height="292" viewBox="0 0 400 292" role="img" aria-label="2행 2열 네 칸의 증폭기 그림이에요. 칸마다 선으로 그린 삼각형 증폭기가 있고, 왼쪽이 입력, 오른쪽이 출력이에요. 전압을 주고받는 단자에는 색칠된 점과 전압 이름을, 전류를 주고받는 도선에는 화살표와 전류 이름을 붙였어요. 왼쪽 위는 v in을 받아 v out을 내는 전압 증폭기 A v, 오른쪽 위는 i in을 받아 v out을 내는 트랜스임피던스 증폭기 R O, 왼쪽 아래는 v in을 받아 i out을 내는 트랜스컨덕턴스 증폭기 G m, 오른쪽 아래는 i in을 받아 i out을 내는 전류 증폭기 A I예요. 칸 아래에 각 이득의 정의를 출력 나누기 입력으로 적었어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
