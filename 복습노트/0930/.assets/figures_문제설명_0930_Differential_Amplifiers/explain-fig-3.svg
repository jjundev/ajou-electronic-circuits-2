<svg xmlns="http://www.w3.org/2000/svg" width="360" height="275" viewBox="130 0 360 275" role="img" aria-label="그림 (c)의 왼쪽 반회로. 위쪽 AC 접지(V_DD)와 출력 노드 v_o 사이에 M3의 r_o3만 있어요(게이트가 가상 접지인 중점에 묶여 v_sg3 = 0). v_o에서 가상 접지로 M1의 g_m1·v_gs1(아래로 흐름, v_gs1 = v_i), r_o1, 그리고 중점까지의 R_1이 병렬로 연결돼요."><style>
