<svg xmlns="http://www.w3.org/2000/svg" width="336" height="214" viewBox="0 0 336 214" role="img" aria-label="능동 1차 필터. 왼쪽 전압원 V in의 위 단자가 R 1과 C 1을 병렬로 묶은 입력 가지를 지나 OP-amp의 반전 단자로 가요. 반전 단자에서 R 2와 C 2를 병렬로 묶은 귀환 가지가 위로 돌아 오른쪽 출력 노드 V out에 닿고, 비반전 단자는 접지예요. 저항은 지그재그 선, 커패시터는 두 줄의 평행선, OP-amp는 굵은 테두리 삼각형이에요. 입력 V in의 점은 파랑, 반전 단자 노드의 점들은 빨강, 출력 V out 노드의 점들은 다시 파랑으로 색칠했어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
