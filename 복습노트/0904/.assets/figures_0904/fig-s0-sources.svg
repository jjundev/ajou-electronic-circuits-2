<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="세 그림. 왼쪽은 대신호 모델로, G 단자는 어디에도 이어지지 않고 D와 S 사이에 아래 방향 화살표가 든 전류원 원이 있어요. 가운데는 소스가 접지이고 게이트에 V_b를 건 NMOS로, 색칠된 점인 노드 X에서 접지 쪽으로 강조색 화살표 전류가 흘러요. 오른쪽은 소스가 V_DD에 붙고 게이트에 V_b를 건 PMOS로, V_DD에서 색칠된 점인 노드 Y 쪽으로 강조색 화살표 전류가 흘러요."><style>
