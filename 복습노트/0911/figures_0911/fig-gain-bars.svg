<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-label="테두리 막대 두 개(흐름을 만드는 힘, 출구가 버티는 힘)를 곱하면 오른쪽의 키 큰 강조색 테두리 막대(출력의 크기)가 돼요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="480" height="215" rx="10" fill="#ffffff"/>
<line class="fig-ink" x1="20" y1="170" x2="460" y2="170"/>
<rect class="fig-ink" x="40" y="110" width="70" height="60"/>
<text class="fig-text" x="75" y="190" font-size="12" text-anchor="middle">흐름을</text>
<text class="fig-text" x="75" y="206" font-size="12" text-anchor="middle">만드는 힘</text>
<text class="fig-text" x="150" y="145" font-size="22" text-anchor="middle">×</text>
<rect class="fig-ink" x="190" y="90" width="70" height="80"/>
<text class="fig-text" x="225" y="190" font-size="12" text-anchor="middle">출구가</text>
<text class="fig-text" x="225" y="206" font-size="12" text-anchor="middle">버티는 힘</text>
<text class="fig-text" x="300" y="145" font-size="22" text-anchor="middle">=</text>
<rect class="fig-accent" x="340" y="30" width="70" height="140"/>
<text class="fig-text" x="375" y="190" font-size="12" text-anchor="middle">출력의</text>
<text class="fig-text" x="375" y="206" font-size="12" text-anchor="middle">크기</text>
</svg>
