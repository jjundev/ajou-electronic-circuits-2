<svg xmlns="http://www.w3.org/2000/svg" width="560" height="205" viewBox="0 0 560 205" role="img" aria-label="선 세 개. 출구 1과 출구 2의 선은 가운데 세로 점선에서 똑같은 만큼 한 계단 내려간다. 맨 아래 강조선인 둘의 차이는 처음부터 끝까지 평평하다."><style>
