<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="왼쪽은 PMOS 소신호 등가회로예요. 위쪽 소스 노드에 강조색 선으로 그린 접지 기호가 붙어 있고, 소스와 아래쪽 드레인 사이에 위를 가리키는 화살표가 든 원형 전류원과 톱니 모양 저항이 나란히 있어요. 게이트는 따로 떨어진 작은 원이고, 게이트 옆에 +, 소스 옆에 − 표시와 v gs 라벨이 있어 전류원이 게이트–소스 전압 v gs로 제어됨을 보여요. 가운데 오른쪽을 가리키는 화살표를 지나 오른쪽 그림은 위아래를 뒤집은 모양으로, 드레인이 위, 소스와 강조색 접지 기호가 아래에 있고 전류원 화살표는 아래를 가리켜요. 오른쪽에서도 게이트 옆 +, 아래 소스 옆 −와 v gs 라벨이 같은 극성을 보여요."><style>
