<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="테두리 상자 네 개가 왼쪽부터 이해하기, 손으로 계산, 손으로 설계, 컴퓨터로 확인 순서로 선으로 이어져 있어요. 컴퓨터로 확인 상자는 강조색 테두리이고, 거기서 손으로 설계 상자로 돌아가는 강조색 점선에 모자란 만큼만 고치기라고 적혀 있어요. 아래에는 처음부터 컴퓨터로 숫자만 바꿔 보기라고 적힌 빨간 테두리 상자가 가위표로 지워져 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
