<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="가로축은 양쪽 전압, 세로축은 흐르는 양이에요. 점선 가로선은 흔들리지 않는 꿈의 공급기, 빨간 선은 부품 하나로 만든 공급기로 오른쪽으로 갈수록 눈에 띄게 올라가요. 강조색 선은 둘을 쌓은 공급기로 거의 평평해요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
.fig-accent { stroke: #2f6fdb; fill: none; stroke-width: 2.5; }
.fig-danger { stroke: #d92d20; fill: none; stroke-width: 2.5; }
.fig-dot { fill: #2f6fdb; }
.fig-text { fill: #1b2130; font-size: 13px; }
.fig-muted { fill: #4a5468; font-size: 12px; }
.axis { stroke: #dde2ea; stroke-width: 1.5; }
.tick { fill: #4a5468; font-size: 11px; }
.plot-truth { fill: none; stroke: #4a5468; stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot-fit { fill: none; stroke: #2f6fdb; stroke-width: 2.5; }
.pt-train { fill: #2f6fdb; }
.pt-test { fill: #b54708; }
.mark-ml { stroke: #2f6fdb; stroke-width: 1.5; stroke-dasharray: 3 3; }
.mark-map { stroke: #067647; stroke-width: 1.5; stroke-dasharray: 3 3; }
.plot-like { fill: none; stroke: #2f6fdb; stroke-width: 2; }
.plot-prior { fill: none; stroke: #6941c6; stroke-width: 2; stroke-dasharray: 6 4; }
.plot-post { fill: none; stroke: #067647; stroke-width: 3; }
</style><rect x="0" y="0" width="560" height="240" rx="10" fill="#ffffff"/>
      <line class="fig-ink" x1="70" y1="200" x2="530" y2="200"/>
      <line class="fig-ink" x1="70" y1="200" x2="70" y2="20"/>
      <text class="fig-muted" x="300" y="226" text-anchor="middle">양쪽 전압</text>
      <text class="fig-muted" x="50" y="110" text-anchor="middle" transform="rotate(-90 50 110)">흐르는 양</text>
      <line class="fig-ink" x1="70" y1="120" x2="520" y2="120" stroke-dasharray="6 5"/>
      <text class="fig-text" x="520" y="140" text-anchor="end">꿈의 공급기: 완전히 평평</text>
      <line class="fig-danger" x1="70" y1="150" x2="520" y2="50"/>
      <text class="fig-text" x="300" y="70" text-anchor="middle">하나로 만들면: 기울어요</text>
      <line class="fig-accent" x1="70" y1="125" x2="520" y2="115"/>
      <text class="fig-text" x="520" y="104" text-anchor="end">둘을 쌓으면: 거의 평평</text>
    </svg>
