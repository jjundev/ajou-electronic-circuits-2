<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="왼쪽부터 작은 입력 상자, 흐름을 바꾸는 상자, 출력 상자가 화살표로 이어져요. 출력 상자 위아래에 강조색 굵은 선 두 개가 벽처럼 막고 있어요."><style>
