<svg xmlns="http://www.w3.org/2000/svg" width="560" height="385" viewBox="0 0 560 385" role="img" aria-label="NPN 트랜지스터 세 개를 쌓은 전류원. 맨 아래 Q2 이미터는 접지이고, 그 위에 Q1, 맨 위에 Q3이 있어요. Q1과 Q2는 색칠된 점인 노드 X에서, Q3과 Q1은 색칠된 점인 노드 Y에서 만나요. 선으로 그린 괄호가 Y 아래의 2단 캐스코드를 묶고, 강조색 화살표가 Y에서 아래를 들여다보는 R_out,2를 가리켜요. 세 베이스에는 V_B3, V_B1, V_B2가 걸리고 모두 AC 접지예요. 강조색 점선과 저항이 AC 접지인 Q3 베이스와 Y 사이의 r_π3을 나타내고, 맨 위 출력의 강조색 화살표가 R_out,3이에요."><style>
