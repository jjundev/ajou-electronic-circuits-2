<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="가로축은 미는 힘, 세로축은 나오는 물 양인 그래프예요. 선으로 그린 곡선 세 개가 처음에 짧게 오르다가 곧 평평해져요. 가장 위의 곡선은 강조색 선이고 손잡이를 많이 돌린 경우예요. 맨 앞 짧은 오르막 구간은 점선으로 나뉘어 쓰지 않는 곳이라고 적혀 있어요."><style>
