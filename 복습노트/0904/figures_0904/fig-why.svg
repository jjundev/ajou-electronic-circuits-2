<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="세 칸 흐름도. 첫 칸은 경고색 테두리 안에 휜 곡선 하나가 있고 그대로 풀면 어렵다고 적혀 있어요. 둘째 칸은 선 테두리 안의 휜 곡선 위에 색칠된 점이 하나 있고, 그 점에 곧은 강조색 선이 닿아 있어요. 셋째 칸은 강조색 테두리 안에서 작은 물결 선이 뒤집힌 큰 강조색 물결 선으로 바뀌어요. 칸 사이는 선 화살표로 이어져요."><style>
