exam: "2015-1 중간고사"
header: "2015.4.23. Electronic Circuits II Midterm (Class : 화B목A / 화D목C)"
sources:
  - ../../2013-2019_중간/2015-1_중간_모범답안.pdf
notes:
  - "원본 파일의 원래 이름은 15Mid_Solution.pdf다. 6쪽이고 1쪽은 표지(시험 날짜·과목, 분반, Name·ID 칸, 배점표)라 문항이 없다."
  - "영문 시험지다. 배점은 표지 배점표로 확인했다: 1번 30, 2번 20, 3번 20, 4번 30 (총 100). 소문항 배점 (10pt), (5pt)는 원문에 인쇄된 대로 각 문제의 원문 절에 남겼다."
  - "원본은 모범답안이다. 인쇄된 문제 위에 손글씨 풀이(파란 펜)와 채점 배점·밑줄(빨간 펜), 붙여 넣은 메모 상자(5쪽 왼쪽, A_v 식)가 겹친다. 이것들은 옮기지 않았다 (FORMAT-EXAM.md의 스캔 답안지 규칙)."
  - "3번은 4–5쪽에 걸친다 (소문항 1)은 4쪽, 2)와 3)은 5쪽)."
