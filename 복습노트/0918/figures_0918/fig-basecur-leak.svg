<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="받은 물 100이 오른쪽으로 흐르다 갈라지는 그림이에요. 대부분인 약 98은 기준 쪽으로 가고, 위험색 선으로 그린 샛길 두 개로 1씩 새요. 복사 쪽도 기준 쪽과 같은 약 98을 받아요."><style>
