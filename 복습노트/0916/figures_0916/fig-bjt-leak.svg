<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="두 칸을 위아래로 쌓은 그림 두 개. 왼쪽은 이음새에 옆길이 하나, 오른쪽은 같은 모양에 강조색 선으로 그린 옆길이 하나 더 있어요."><style>
