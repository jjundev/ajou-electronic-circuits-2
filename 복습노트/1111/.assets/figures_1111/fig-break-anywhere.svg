<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-label="귀환 블록도 두 개를 위아래로 그렸어요. 두 그림 모두 입력을 접지해 X는 0이고, 테두리 원 모양의 비교부, 테두리 상자 A1, 왼쪽을 향한 테두리 삼각형 K가 강조선 루프를 이뤄요. 위 그림은 A1 출력 끝 N과 K 입력 끝 M 사이를 끊고 M에 아래가 접지된 시험 신호원 V test를 달았어요. 아래 그림은 비교부 출력 끝 N과 A1 입력 끝 M 사이를 끊고 M에 V test를 달았으며, A1 출력 Y에서 K로 귀환해요. 노드 N, M, Y는 색칠된 점이에요. 맨 아래 글자는 어느 자리에서 끊어도 마이너스 V N 나누기 V test가 K A1이라고 적혀 있어요"><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
