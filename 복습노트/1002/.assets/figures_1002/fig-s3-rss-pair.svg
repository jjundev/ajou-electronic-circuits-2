<svg xmlns="http://www.w3.org/2000/svg" width="380" height="250" viewBox="95 15 380 250" role="img" aria-label="대칭 MOS 차동쌍. 전원 V DD에서 저항 R D 두 개가 M1, M2의 드레인으로 내려오고, 두 게이트에는 강조선으로 같은 입력 변화 ΔV in,CM이 들어간다. 두 소스는 가운데 색칠된 점 P에서 만난다. P 아래에서 길이 둘로 갈라져 왼쪽은 이상적 전류원 I SS, 오른쪽은 강조선으로 그린 저항 R SS를 거쳐 접지로 간다. R SS 옆에 변화 전류 2ΔI D, P 옆에 ΔV P가 적혀 있다."><style>
