<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-label="같은 높이의 막대 두 개예요. 왼쪽 막대는 위쪽 강조색 테두리 칸이 위 칸 몫, 아래쪽 테두리 칸이 아래 칸 몫이에요. 오른쪽 막대는 강조색 테두리 칸이 전체를 차지하고, 바닥의 빨간 선이 아래 칸 몫이 없음을 보여 줘요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
