<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="왼쪽은 테두리만 있는 상자 두 개가 나란히 있고 각각 아래에 용수철이 달려 있으며, 가운데에 세로 강조 점선이 있다(전체). 화살표 오른쪽에는 강조선으로 그린 상자 하나와 용수철 하나만 남아 있다(반쪽만)."><style>
