<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="왼쪽에는 높이가 다른 테두리 상자 두 개가 있고, 두 상자 윗변의 높이 차이를 강조선 눈금으로 표시했다. 화살표 오른쪽에서는 두 상자가 같은 만큼 위로 떠올랐지만, 강조선 눈금으로 표시한 높이 차이는 왼쪽과 같다."><style>
