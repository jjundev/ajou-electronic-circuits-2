<svg xmlns="http://www.w3.org/2000/svg" width="440" height="305" viewBox="0 0 440 305" role="img" aria-label="연습문제 12.12의 바뀐 회로. 위쪽 V DD 레일에 PMOS M3과 M4의 소스가 붙어 있어요. 두 PMOS 게이트는 가로선으로 이어지고, 그 선에서 내려온 도선이 M3 드레인 노드 V D1에 닿아 M3이 다이오드 연결이에요. M3 드레인 V D1 아래에 NMOS M1이 있고, M1 게이트는 왼쪽 입력 v in에 연결돼요. 오른쪽 열은 M4 드레인이 출력 노드 v out이고, 그 아래에 NMOS M2가 있으며, v out은 오른쪽 출력 단자로만 나가요. M1과 M2의 소스는 아래 가로선에서 만나 꼬리 전류원 I SS를 거쳐 접지로 가요. V D1 노드에서 오른쪽으로 나온 도선이 가운데의 R1 위 단자로 가고, R1 아래 노드 X에서 R2가 접지로 내려가며, X는 오른쪽으로 M2 게이트에 연결돼요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
