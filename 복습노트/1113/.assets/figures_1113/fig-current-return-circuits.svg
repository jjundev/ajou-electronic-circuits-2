<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="두 회로 그림이에요. 왼쪽 (c)는 위로 향하는 화살표가 든 테두리 원 입력 전류원 i in의 아래쪽이 접지되고, 위쪽 선이 파란 점 노드 v n을 지나 i e 화살표를 거쳐 테두리 삼각형 증폭기로 가며, 삼각형 오른쪽에서 출력 화살표가 나가요. 파란 점 노드에서 아래로 내려간 선에는 아래로 향하는 i F 화살표가 있고 트랜지스터 M 1의 드레인에 닿아요. M 1의 소스는 접지되고 게이트 선은 오른쪽 테두리 원 단자로 가며 그 아래에 귀환 신호라고 적혀 있어요. 오른쪽 (d)는 같은 구조에서 파란 점 노드 v n 아래로 내려간 i F 선이 오른쪽으로 꺾여 지그재그 저항 R F를 지나 오른쪽 테두리 원 단자로 가고, 그 아래에 귀환 신호라고 적혀 있어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
