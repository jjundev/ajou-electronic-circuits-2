<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" role="img" aria-label="두 그림이 나란히 있어요. 왼쪽은 테두리 사각형 증폭기의 출력 도선이 오른쪽 끝 V out 단자로 가고, 중간 분기점에서 아래로 내려간 강조선이 왼쪽을 향한 테두리 삼각형 귀환 회로망 K의 입력에 병렬로 닿아요. 그 입력을 왼쪽으로 가리키는 화살표 아래에 무한대가 적혀 있고 맨 아래에 볼트미터처럼 병렬이라고 적혀 있어요. 오른쪽은 테두리 사각형 증폭기에서 나온 출력 전류 I out의 경로가 끊겨 테두리 삼각형 K 안의 입력 포트를 강조선으로 지나 다시 증폭기로 돌아와요. 그 입력 포트를 가리키는 화살표 아래에 0이 적혀 있고 맨 아래에 커런트 미터처럼 직렬이라고 적혀 있어요. V out 단자와 분기점에는 색칠된 점이 있어요"><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
