<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="출력 노드 v_o와 중간 노드 v_x 사이에 Q2의 제어 전류원 g_m2·v_be2(v_o에서 v_x 방향)와 r_O2가 병렬로 있어요. v_x에서 접지로 Q1의 제어 전류원 g_m1·v_in(v_x에서 접지 방향), r_O1, 그리고 접지된 Q2 베이스로 가는 r_π2가 있어요. r_π2 양단 v_be2는 베이스(접지) 쪽이 +, v_x 쪽이 −라 v_be2 = −v_x예요. 입력 전압원 v_in은 Q1 베이스에 바로 걸려요."><style>
