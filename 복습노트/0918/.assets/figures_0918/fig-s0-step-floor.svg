<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="그림 두 개. 왼쪽 그림에서는 같은 높이의 강조색 막대 아래로, 왼쪽 바닥은 낮고 오른쪽 바닥은 경고색 테두리 턱으로 높아서 두 틈 길이가 달라요. 오른쪽 그림에서는 두 바닥이 같은 높이의 선 테두리 턱이라서 두 틈 길이가 같아요."><style>
