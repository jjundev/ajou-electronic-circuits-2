">r<tspan baseline-shift="sub" font-size="10">O</tspan> (M₃)</text><text class="fig-text" x="312" y="210">r<tspan baseline-shift="sub" font-size="10">O</tspan> (M₁)</text><text class="fig-muted" x="262" y="280">테일 = 가상 접지</text></svg>
