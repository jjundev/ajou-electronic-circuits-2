<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262" role="img" aria-label="위에서 아래로 이어지는 흐름도. 첫째 테두리 상자는 한 줄로 보내면 흔들림까지 커진다는 내용이고 위험색 선으로 그렸어요. 화살표를 따라 둘째 테두리 상자는 두 줄로 보내 빼면 같은 흔들림이 지워진다는 내용이에요. 셋째 상자는 강조색 테두리로, 두 줄 끝을 펌프 하나에 묶으면 흐름이 늘 같아진다는 내용이에요. 맨 아래에 대신 전기를 두 배 쓴다는 글이 있어요."><style>
svg { color: #1b2130; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
.fig-ink { stroke: #1b2130; fill: none; stroke-width: 2; }
