<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="왼쪽 예전 그림은 큰 상자가 강조색 테두리이고 속의 작은 상자 세 개는 보통 선이에요. 오른쪽 지금 그림은 큰 상자가 보통 선이고 속의 작은 상자 세 개가 강조색 테두리예요. 두 그림 사이에 왼쪽에서 오른쪽을 가리키는 화살표 선이 있어요."><style>
