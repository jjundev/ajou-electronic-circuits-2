<svg xmlns="http://www.w3.org/2000/svg" width="340" height="204" viewBox="0 0 340 204" role="img" aria-label="왼쪽은 좁은 관으로 물을 받는 큰 통이라 천천히 차고, 오른쪽은 넓은 관으로 물을 받는 작은 통이라 금방 찬다. 통은 테두리로, 통 안의 물은 색칠된 사각형으로 그렸다."><style>
