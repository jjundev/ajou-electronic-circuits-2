<svg xmlns="http://www.w3.org/2000/svg" width="620" height="170" viewBox="0 0 620 170" role="img" aria-label="왼쪽에서 오른쪽으로 이어진 길 위에 점 일곱 개가 있어요. 처음 두 점, 소개와 복습은 색칠된 점이고 나머지 다섯 점, 전류 복사와 쌓기, 두 입력 비교, 빠른 신호, 되먹임, 거르기는 테두리만 있는 점이에요."><style>
