<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="테두리로 그린 물통 두 개. 왼쪽 통은 구멍이 하나라 천천히 바뀌고, 오른쪽 통은 강조색 선으로 그린 큰 구멍이 하나 더 있어 금방 바뀐다. 통 안의 물은 색칠된 사각형이다."><style>
