<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="왼쪽 실제 회로에는 선으로 그린 증폭하는 부분 상자 아래에 강조색 테두리의 자리를 잡아 주는 부분 상자가 붙어 있어요. 오른쪽 작은 흔들림만 볼 때는 그 상자 대신 강조색 선 세 줄로 된 바닥 기호만 남아요."><style>
