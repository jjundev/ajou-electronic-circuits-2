<svg xmlns="http://www.w3.org/2000/svg" width="580" height="215" viewBox="0 0 580 215" role="img" aria-label="위쪽 선과 바닥 선 사이에 상자 두 개가 있는 그림이에요. 오른쪽 위 넣어 주는 거울 상자는 위에 매달려 증폭하는 곳으로 흘려 보내요. 강조색 선이 그 상자에서 왼쪽 아래 빼 주는 거울 상자로 이어져, 빼 주는 거울이 바닥으로 끌어내요."><style>
