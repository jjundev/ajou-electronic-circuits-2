<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="그림 12.30을 다시 그린 회로. 왼쪽 입력 전류원 I in은 아래가 접지이고 위로 노드 X에 전류를 넣어요. 노드 X는 오른쪽으로 M1 게이트에 연결되고 아래로 M2 드레인에 연결돼요. M1은 소스가 접지이고 드레인이 R D1을 거쳐 V DD에 연결되며, 그 드레인 노드가 오른쪽 출력 V out이에요. V out 도선은 오른쪽에서 갈라져 아래로 내려가 왼쪽으로 꺾여 M2 게이트에 연결돼요. M2는 소스가 접지예요. R D1에는 아래로 흐르는 I D1, X에서 M2 드레인으로는 아래로 흐르는 I D2가 표시돼 있어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
