<svg xmlns="http://www.w3.org/2000/svg" width="560" height="345" viewBox="0 0 560 345" role="img" aria-label="왼쪽은 PNP 캐스코드 전류원. 맨 위 V_CC에 Q2 이미터가 붙고, Q2 컬렉터와 Q1 이미터가 색칠된 점인 노드 X에서 만나요. Q1 컬렉터가 맨 아래 출력이고, 강조색 화살표가 아래에서 들여다보는 R_out이에요. 오른쪽 소신호 등가회로에서는 맨 위 AC 접지와 X 사이에 r_O2와 강조색 선으로 그린 r_π1이 나란히 있고, X와 출력 사이에 r_O1과 위쪽 화살표가 든 마름모 전류원 g_m1 v_be1이 나란히 있어요."><style>
