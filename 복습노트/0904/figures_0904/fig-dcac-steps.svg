<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="위쪽에 1 자리 잡기, 2 흔들림만 보기라는 두 상자 테두리가 화살표로 이어져 있어요. 아래 왼쪽은 안 변하는 전지를 바닥 기호에 잇는 그림, 아래 오른쪽은 안 변하는 물줄기 원을 끊긴 선으로 바꾸는 그림이에요."><style>
