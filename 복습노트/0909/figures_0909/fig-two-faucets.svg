<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="선으로 그린 세로 관 두 개가 나란히 있어요. 두 관 모두 가운데로 강조색 선의 큰 물줄기가 위에서 아래로 흘러요. 왼쪽 관의 손잡이에는 드는 물이 없다고 적혀 있고, 오른쪽 관의 손잡이에서는 강조색 점선의 가는 물줄기가 관 안으로 들어가요."><style>
