<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-label="테두리 막대 그래프 두 묶음. 쓰는 전기 묶음에서 강조색 테두리의 두 줄 회로 막대가 한 줄 회로 막대의 두 배 높이예요. 키우는 정도 묶음에서는 두 막대의 높이가 같아요."><style>
