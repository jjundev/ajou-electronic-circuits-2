<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="전압-전압 귀환 블록도예요. 왼쪽 두 테두리 원 단자 사이가 입력 V in이에요. 위 단자는 테두리 사각형 A 0의 플러스 입력으로 가고, A 0의 마이너스 입력은 아래 테두리 사각형 K의 플러스 출력 단자로, K의 마이너스 출력 단자는 아래 입력 단자로 이어져 입력 고리가 한 줄로 이어진 직렬 연결이에요. A 0 입력 사이 전압은 V 1, K 출력 사이 전압은 V F예요. 오른쪽에서 A 0의 두 출력선은 오른쪽 끝 두 테두리 원 단자 V out으로 가요. K의 위 입력선은 아래 출력선을 반원 모양으로 넘어 위 출력선의 파란 점에 닿고, K의 아래 입력선은 아래 출력선의 빨간 점에 닿아 출력에는 병렬로 붙어요. 위에는 감지 V out 병렬, 아래에는 반송 V F는 K V out 직렬이라고 적혀 있어요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
