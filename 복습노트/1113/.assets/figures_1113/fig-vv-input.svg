<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="입력 임피던스를 구하는 블록도예요. 왼쪽 아래가 접지된 테두리 원 전압원 v in의 위쪽이 빨간 점 노드 V in을 지나 테두리 원 합산기의 플러스 입력으로 가요. 그 위에는 오른쪽을 향한 화살표와 R in closed가 적혀 있어요. 합산기 출력선에는 오른쪽 화살표 I in이 있고, 점선 상자 피드포워드 시스템 안의 파란 점 노드 I in R in에 닿아요. 그 노드에서 지그재그 저항 R in 개루프가 접지로 내려가고, 오른쪽으로 테두리 삼각형 A 0를 지나 빨간 점 노드 A 0 I in R in으로 나가요. 그 노드에서 아래로 내려가 테두리 사각형 K를 지나 왼쪽 파란 점 노드 V F는 K A 0 I in R in을 거쳐 합산기의 마이너스 입력으로 올라가요."><style>/* Copyright (c) 2021, Kil Hyung-jin (https://github.com/orioncactus/pretendard),
