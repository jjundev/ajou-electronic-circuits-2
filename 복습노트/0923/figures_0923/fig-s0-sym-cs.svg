<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" role="img" aria-label="대칭 회로. 위쪽 V DD 선에 잡음 표시가 있고, 저항 R D 두 개를 지나 두 트랜지스터의 드레인 X와 Y로 내려와요. 왼쪽 게이트에는 +v in, 오른쪽 게이트에는 −v in이 들어가고 소스는 접지예요. X와 Y는 색칠된 점이고, 둘을 잇는 강조색 점선이 출력 V out이에요."><style>
